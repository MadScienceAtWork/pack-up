  const clock = el(sc, 'e', P16(...R.clock), art('alarm'));
  const lying = el(sc, 'e lying', P16(...R.lying), figure(c, { eyes: 'closed' }));
  const blanket = el(sc, 'e', P16(...R.blanket), art('blanket', { color: c.accent }));
  const curL = el(sc, 'e curtain cl', P16(...R.curL), art('curtain'));
  const curR = el(sc, 'e curtain cr', P16(...R.curR), art('curtain'));
  const dark = el(sc, 'dark'); dark.style.opacity = .5;
  let asleep = true;
  const snore = () => { if (!alive() || !asleep) return; const [x, y] = scenePt(sc, R.pillow[0] + 40, R.pillow[1] - 60); zzzAt(x, y); later(snore, 1500); };
  later(snore, 600);
  flash(clock, 'wiggle'); Sfx.play('alarm');

  setBanner([art('curtain')], L.wakeCurtains);
  [curL, curR].forEach(cu => cu.classList.add('tap', 'glowy'));
  S.help = () => Hint.tap(curL);
  later(S.help, 1200);
  const openCurtains = () => {
    if (curL.classList.contains('open')) return;
    Hint.stop(); [curL, curR].forEach(cu => cu.classList.remove('glowy', 'tap')); curL.classList.add('open'); curR.classList.add('open');
    dark.style.opacity = 0; Sfx.play('whoosh'); Sfx.play('tweet', .6);
    const [wx, wy] = scenePt(sc, 700, 230); for (let i = 0; i < 2; i++) fxSpawn(art('bird'), '', wx, wy + i * 30, 46, 30, [{ opacity: 0 }, { opacity: 1, dx: 80, dy: -20 }, { opacity: 0, dx: 260, dy: -60 }], 1800 + i * 300);
    later(() => {
      setBanner([art('tapHand')], L.wakeTickle);
      lying.classList.add('tap', 'glowy'); blanket.classList.add('tap');
      S.help = () => Hint.tap(lying); later(S.help, 600);
    }, 900);
  };
  curL.addEventListener('click', openCurtains); curR.addEventListener('click', openCurtains);
  const tickle = async () => {
    if (!asleep || !curL.classList.contains('open')) return;
    asleep = false; Hint.stop(); lying.classList.remove('glowy'); Sfx.play('giggle');
    lying.innerHTML = figure(c, { eyes: 'happy', mouth: 'cheer' }); flash(lying, 'wiggle');
    await wait(900); if (!alive()) return;
    lying.innerHTML = figure(c, { mouth: 'yawn' }); Sfx.play('yawn');
    await wait(1100); if (!alive()) return;
    lying.remove(); blanket.classList.remove('tap'); Sfx.play('boing');
    const g = girlEl(sc, c, R.standX + 120, R.floor, 420, { pose: 'cheer', mouth: 'cheer' });
    g.animate([{ transform: 'translate(40%, -30%) scale(.8)', opacity: 0 }, { offset: .5, transform: 'translate(10%, -20%)', opacity: 1 }, { transform: 'none' }], { duration: 600, easing: 'ease-out' });
    later(done, 1500);
  };
  lying.addEventListener('click', tickle); blanket.addEventListener('click', tickle);
};
function zzzAt(x, y) {

STEPS.play = (root, def, done) => {
  const c = S.child, L = CONFIG.labels, R = ROOM.living, alive = tkGuard();
  const sc = sceneBox(root, 'living');
  const list = (def.choices || ['couch', 'bar']).filter(k => CONFIG.plays[k]);
  let girl = girlEl(sc, c, 600, R.floor, 400);
  let taps = 0, kind = null, lights = null;
  const row = choiceRow(sc, list.map(k => ({ id: k, word: CONFIG.plays[k], html: art(PLAY_ICON[k] || 'playIcon') })), pick);
  setBanner([art('playIcon')], L.playPick);
  S.help = () => Hint.tap($('.choice', row)); later(S.help, 900);

  function pick(k) {
    if (GAMES[k]) { Hint.stop(); GAMES[k](root, done); return; }
    kind = k; row.remove(); girl.remove(); lights?.remove(); lights = null;
    const h = 400 * (c.look.height || 1);
    if (k === 'couch') { girl = girlEl(sc, c, R.seatX, R.seatY, 400, { pose: 'sit', mouth: 'cheer' }, 'tap jumpy'); Sfx.play('boing'); }
    else if (k === 'barre') { girl = girlEl(sc, c, R.barreX, R.floor, 400, { pose: 'ballet', mouth: 'cheer' }, 'tap'); Sfx.play('ting'); }
    else {
      lights = el(sc, 'disco', '', [0, 1, 2, 3, 4].map(i => `<span style="left:${10 + i * 19}%;top:${8 + (i % 2) * 14}%;background:${['#e5675c', '#f4d36b', '#8cc47e', '#7aa9de', '#a98bd8'][i]};animation-delay:${i * .2}s"></span>`).join(''));
      girl = girlEl(sc, c, R.danceX, R.floor, 420, { pose: 'cheer', mouth: 'cheer' }, 'tap dance'); Sfx.play('tune');
    }
    setBanner([art('tapHand'), art(PLAY_ICON[k])], L.playTap);
    S.help = () => Hint.tap(girl); later(S.help, 1200);
    girl.addEventListener('click', fun);
    later(() => alive() && doneBtn(root, done), 5000);
  }
  function fun() {
    Hint.stop(); taps++;
    const [x, y, r] = rectC(girl);
    if (kind === 'couch') {
      Sfx.play('boing'); Sfx.play('giggle', .1);
      fxSpawn(art('cushion', { color: ['#f4d36b', '#f29bb8', '#a98bd8'][taps % 3] }), '', x + rand(-60, 60), r.bottom - 40, 70, 70,
        [{ t: 'rotate(0)' }, { dx: rand(-200, 200), dy: -260, t: 'rotate(200deg)' }, { opacity: 0, dx: rand(-260, 260), dy: 40, t: 'rotate(400deg)' }], 1100);
    } else if (kind === 'barre') {
      const moves = [{ pose: 'tiptoe', eyes: 'happy' }, { pose: 'ballet', mouth: 'cheer' }, { pose: 'tiptoe', mouth: 'cheer' }];
      girl.draw(moves[taps % 3]); Sfx.play('ting'); notesFrom(girl);
      if (taps % 2) girl.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(-1)' }, { transform: 'scaleX(1)' }], { duration: 700, easing: 'ease-in-out' });
      sparkleAt(x, y - 40, 5);
    } else {
      Sfx.play('tune'); notesFrom(girl);
      girl.draw({ pose: ['wave', 'stand', 'cheer'][taps % 3], mouth: 'cheer', eyes: taps % 2 ? 'happy' : 'open' });
    }
    if (taps >= 2) doneBtn(root, done);
  }
};

STEPS.bubbles = (root, def, done) => {
  const c = S.child, L = CONFIG.labels, alive = tkGuard(), n = def.count || 10;
  const sc = sceneBox(root, 'garden');
  const girl = girlEl(sc, c, 250, 940, 430, { pose: 'cheer', mouth: 'cheer' });
  const dots = el(sc, 'popcount', '', Array.from({ length: n }, () => '<span></span>').join(''));
  let popped = 0, finishedGame = false;
  const spawn = () => {
    if (!alive() || finishedGame) return;
    const size = rand(9, 13), x = rand(26, 88);
    const b = el(sc, 'gbub', `left:${x}%;top:100%;width:${size}%;`);
    const H = sc.clientHeight, dur = rand(5200, 8000);
    const a = b.animate([{ transform: 'translate(0, 0)' }, { transform: `translate(${rand(-60, 60)}px, ${-H * .55}px)` }, { transform: `translate(${rand(-60, 60)}px, ${-H * 1.25}px)` }], { duration: dur, easing: 'linear', fill: 'forwards' });
    a.onfinish = () => b.remove();
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); if (b.classList.contains('popped')) return;
      b.classList.add('popped'); a.pause(); Hint.stop();
      Sfx.play('bubblePop'); Sfx.play('pop', .02);
      const [x2, y2] = rectC(b); sparkleAt(x2, y2, 5);
      b.animate([{ transform: getComputedStyle(b).transform, opacity: 1 }, { transform: getComputedStyle(b).transform + ' scale(1.5)', opacity: 0 }], { duration: 220, fill: 'forwards' }).onfinish = () => b.remove();
      popped++; const d = dots.children[popped - 1]; if (d) { d.classList.add('on'); flash(d, 'pop'); }
      if (popped >= n && !finishedGame) {
        finishedGame = true; Sfx.play('cheer'); girl.draw({ pose: 'cheer', mouth: 'cheer', eyes: 'happy' }); flash(girl, 'bounce');
        later(done, 1600);
      }
    });
    later(spawn, rand(550, 900));
  };
  [0, 250, 500].forEach(t => later(spawn, t));
  setBanner([art('bubbleWand')], L.bubbles);
  S.help = () => { const b = $$('.gbub:not(.popped)', sc).find(x => { const r = x.getBoundingClientRect(); return r.top > 120; }); b && Hint.tap(b); };
  later(S.help, 1800);
};

    [plateEl, cup].forEach(d => {
      d.classList.add('tap');
      Drag.attach(d, {

GAMES.blocks = (root, done) => {
  const c = S.child, L = CONFIG.labels, alive = tkGuard(), FLOOR = 900, RIGHT = 1220;
  const sc = sceneBox(root, 'playroom');
  girlEl(sc, c, 140, 940, 360, { pose: 'cheer', mouth: 'cheer' });
  const TYPES = [
    { kind: 'sq', w: 120, h: 120, color: '#e5675c', tx: 1330, ty: 600 },
    { kind: 'long', w: 240, h: 64, color: '#7aa9de', tx: 1300, ty: 760 },
    { kind: 'tall', w: 64, h: 180, color: '#f4d36b', tx: 1470, ty: 590 },
    { kind: 'tri', w: 130, h: 110, color: '#8cc47e', tx: 1440, ty: 610 }
  ];
  TYPES[3].tx = 1400; TYPES[3].ty = 600; TYPES[2].tx = 1480; TYPES[2].ty = 640; TYPES[0].tx = 1280; TYPES[0].ty = 610;
  const placed = [];
  const place = (b, d) => Object.assign(d.style, { left: (b.x / 16) + '%', top: (b.y / 10) + '%', width: (b.w / 16) + '%', height: (b.h / 10) + '%' });
  TYPES.forEach(t => {
    const d = el(sc, 'e tray-block tap', '', blockHTML(t)); place({ x: t.tx, y: t.ty, w: t.w, h: t.h }, d);
    d.addEventListener('pointerdown', e => grab(e, t));
  });
  setBanner([art('blocksIcon')], L.blocks);
  S.help = () => Hint.drag($('.tray-block', sc), $('.who-fig', sc)); later(S.help, 1000);
  const toScene = (cx, cy) => { const r = sc.getBoundingClientRect(); return [(cx - r.left) / r.width * 1600, (cy - r.top) / r.height * 1000]; };

  function grab(e, t) {
    e.preventDefault(); Hint.stop(); Sfx.play('pick');
    const b = { kind: t.kind, w: t.w, h: t.h, color: t.color, x: 0, y: 0 };
    const d = el(sc, 'e block held', '', blockHTML(b));
    const follow = ev => { const [x, y] = toScene(ev.clientX, ev.clientY); b.x = x - b.w / 2; b.y = y - b.h / 2; place(b, d); };
    follow(e);
    const move = ev => { ev.preventDefault(); follow(ev); };
    const up = () => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      d.classList.remove('held');
      if (b.x + b.w / 2 > RIGHT) { d.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.5)' }], 200).onfinish = () => d.remove(); return; }
      b.x = Math.max(260, Math.min(RIGHT - b.w, b.x));
      drop(b, d);
    };
    addEventListener('pointermove', move, { passive: false }); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  }
  /* where would a block at this x come to rest? */
  function landing(b) {
    const over = placed.filter(p => p.x < b.x + b.w - 8 && p.x + p.w > b.x + 8);
    if (!over.length) return { top: FLOOR, support: null };
    const top = Math.min(...over.map(p => p.y));
    return { top, support: over.filter(p => Math.abs(p.y - top) < 3) };
  }
  async function drop(b, d) {
    const startY = b.y, { top, support } = landing(b);
    const cx = b.x + b.w / 2;
    let stable = !support || (support.every(p => p.kind !== 'tri') && cx >= Math.min(...support.map(p => p.x)) - 4 && cx <= Math.max(...support.map(p => p.x + p.w)) + 4);
    const restY = top - b.h, H = sc.clientHeight;
    const fall = Math.max(0, restY - startY) / 1000 * H;
    await finished(d.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${fall}px)` }], { duration: 180 + Math.sqrt(Math.max(1, fall)) * 22, easing: 'cubic-bezier(.5,0,1,1)', fill: 'forwards' }));
    if (!alive()) return;
    d.getAnimations().forEach(a => a.cancel());
    b.y = restY; place(b, d);
    if (stable) {
      Sfx.play('thud'); d.animate([{ transform: 'scale(1.06, .9)' }, { transform: 'none' }], { duration: 220, easing: 'ease-out' });
      placed.push(b); d.classList.add('tap'); d.addEventListener('click', () => { flash(d, 'wiggle'); Sfx.play('pop'); });
      if (placed.length > 14) { const old = placed.shift(); old.el?.remove(); }
      b.el = d;
      const [x, y] = rectC(d);
      if (placed.length >= 5) { sparkleAt(x, y, 6); doneBtn(root, done); }
      return;
    }
    // it tips over the edge and tumbles down
    Sfx.play('nope');
    const leftEdge = Math.min(...support.map(p => p.x)), rightEdge = Math.max(...support.map(p => p.x + p.w));
    const dir = support.some(p => p.kind === 'tri') ? (Math.random() < .5 ? -1 : 1) : (cx < (leftEdge + rightEdge) / 2 ? -1 : 1);
    const nb = { ...b, w: b.h, h: b.w };
    nb.x = Math.max(260, Math.min(RIGHT - nb.w, dir < 0 ? leftEdge - nb.w - 6 : rightEdge + 6));
    const land = landing(nb), ny = land.top - nb.h, W = sc.clientWidth;
    const dx = ((nb.x + nb.w / 2) - cx) / 1600 * W, dy = ((ny + nb.h / 2) - (b.y + b.h / 2)) / 1000 * H;

/* =====================================================================
   MINI-GAME ENGINE — every step is a few small "stages" in a row.
   Helpers: drag something onto something, pour, stir, swipe, paint, tap.
   Nothing can be failed and nothing is timed.
   ===================================================================== */

/* help hand: set what the help button shows; it also shows by itself after a moment */
let helpGen = 0;
function setHelp(fn, delay = 900) { const g = ++helpGen; S.help = () => { if (g === helpGen) fn(); }; later(() => { if (g === helpGen) S.help(); }, delay ?? 900); }
function clearHelp() { helpGen++; S.help = () => {}; Hint.stop(); }

/* little row of stage icons at the top of a scene */
function stageStrip(sc, icons) {
  const d = el(sc, 'stagestrip', '', icons.map(ic => `<span class="ss"><span class="ssi">${ic}</span><span class="tbox"><svg viewBox="0 0 40 40"><path class="tick" d="M7 21 L16 31 L35 6"/></svg></span></span>`).join('<i></i>'));
  return {
    el: d,
    now: i => $$('.ss', d).forEach((s, j) => s.classList.toggle('now', j === i)),
    tick: i => { const s = $$('.ss', d)[i]; if (s) { s.classList.add('done'); flash(s, 'pop'); } }
  };
}
/* run stages [{ icon, word, run: async () => {} }] one after the other, then done() */
async function runStages(sc, stages, done) {
  const alive = tkGuard();
  const strip = stages.length > 1 ? stageStrip(sc, stages.map(s => s.icon)) : null;
  for (let i = 0; i < stages.length; i++) {
    if (!alive()) return;
    strip?.now(i);
    if (stages[i].word) setBanner([stages[i].icon], stages[i].word);
    S.help = () => {};
    await stages[i].run();
    if (!alive()) return;
    strip?.tick(i); Sfx.play('tick');
    await wait(stages[i].pause ?? 500);
  }
  if (alive()) done();
}

/* place an element in scene units */
function put(e, x, y, w, h) { e.style.left = (x / 16) + '%'; e.style.top = (y / 10) + '%'; if (w != null) { e.style.width = (w / 16) + '%'; e.style.height = (h / 10) + '%'; } return e; }
function glideTo(e, x, y, ms = 450) {
  return new Promise(res => {
    e.style.transition = `left ${ms}ms ease-in-out, top ${ms}ms ease-in-out`; put(e, x, y);
    setTimeout(() => { e.style.transition = ''; res(); }, ms + 20);
  });
}
/* centre of an element in scene units */
function sceneXY(sc, e) { const r = sc.getBoundingClientRect(), [x, y] = rectC(e); return [(x - r.left) / r.width * 1600, (y - r.top) / r.height * 1000]; }

/* tap something (it glows and the help hand points at it) */
function tapOn(e, opts = {}) {
  return new Promise(res => {
    e.classList.add('tap'); if (opts.glow !== false) e.classList.add('glowy');
    if (!opts.noHelp) setHelp(() => Hint.tap(e), opts.helpDelay);
    const h = ev => { ev.stopPropagation(); e.removeEventListener('click', h); e.classList.remove('glowy'); clearHelp(); Sfx.play(opts.sound || 'pop'); res(e); };
    e.addEventListener('click', h);
  });

/* tap something several times (each tap calls onTap(n)) */
function tapTimes(e, n, onTap, opts = {}) {
  return new Promise(res => {
    let k = 0; e.classList.add('tap'); if (opts.glow !== false) e.classList.add('glowy');
    setHelp(() => Hint.tap(e), opts.helpDelay);
    const h = ev => { ev.stopPropagation(); Hint.stop(); k++; onTap?.(k); if (k >= n) { e.removeEventListener('click', h); e.classList.remove('glowy'); clearHelp(); res(e); } };
    e.addEventListener('click', h);
  });
}

/* drag e onto one of the targets; resolves with the target it landed on.
   (each element is wired to the drag system once; later calls just swap the job) */
function dragTo(e, targets, opts = {}) {
  const list = Array.isArray(targets) ? targets : [targets];
  return new Promise(res => {
    e.classList.remove('locked'); e.classList.add('tap');
    e._job = { list, opts, res };
    if (!e._wired) {
      e._wired = true;
      Drag.attach(e, {
        targets: () => {
          const j = e._job; if (!j || e.classList.contains('locked')) return [];
          return j.list.map(t => ({ el: t, accept: true, glow: j.opts.glow, margin: j.opts.margin ?? 90, shrink: j.opts.shrink ?? .7, fade: j.opts.fade,
            flyTo: j.opts.flyTo ? () => j.opts.flyTo(t) : undefined,
            onDrop: () => { e.classList.add('locked'); e.classList.remove('lifted'); if (j.opts.hide) e.style.visibility = 'hidden'; const r = j.res; e._job = null; clearHelp(); r(t); } }));
        },
        onStart: () => { const j = e._job; j?.list.forEach(t => t.classList.add('target')); j?.opts.onStart?.(); },
        onEnd: () => { e._job?.list.forEach(t => t.classList.remove('target')); },
        onTap: () => { Sfx.play('pop'); e._job?.opts.onTap ? e._job.opts.onTap() : S.help(); },
        onMiss: () => { Sfx.play('nudge'); e._job?.opts.onMiss?.(); }

    }
    if (opts.help !== false) setHelp(() => Hint.drag(e, list.find(t => t.isConnected) || list[0]), opts.helpDelay);

}

/* free-drag a tool around the scene (follows the finger); returns a remover */
function holdTool(tool, { onMove, onDown, onUp, head = [.5, .5] } = {}) {
  let active = false, dead = false, dx = 0, dy = 0;
  const down = e => {
    e.preventDefault(); e.stopPropagation(); Hint.stop(); active = true;
    const r = tool.getBoundingClientRect(); dx = e.clientX - r.left; dy = e.clientY - r.top;
    tool.classList.add('held'); onDown?.();
    const move = ev => {
      if (!active || dead || !tool.offsetParent) return; ev.preventDefault();
      const host = tool.offsetParent.getBoundingClientRect();
      tool.style.left = ((ev.clientX - dx - host.left) / host.width * 100) + '%';
      tool.style.top = ((ev.clientY - dy - host.top) / host.height * 100) + '%';
      const tr = tool.getBoundingClientRect();
      onMove?.(tr.left + tr.width * head[0], tr.top + tr.height * head[1], ev);
    };
    const up = () => { active = false; tool.classList.remove('held'); removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); onUp?.(); };
    addEventListener('pointermove', move, { passive: false }); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  };

  tool.classList.add('tool');
  return () => { dead = true; tool.classList.remove('held'); tool.removeEventListener('pointerdown', down); };
}
const inside = (x, y, e, pad = 0) => { const r = e.getBoundingClientRect(); return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad; };

/* pour: hold the container over the target and it tips and pours until full */
function pourInto(cont, target, opts = {}) {
  return new Promise(res => {
    const sc = cont.offsetParent, home = [cont.style.left, cont.style.top];
    let p = 0, over = false, last = 0, raf = 0, finishedPour = false;
    const tick = t => {
      if (!cont.isConnected) return;
      if (over && !finishedPour) {
        const dt = last ? Math.min(60, t - last) : 16; p = Math.min(1, p + dt / (opts.time || 1600));
        opts.onProgress?.(p);
        if (Math.random() < .5) {
          const r = cont.getBoundingClientRect(), sx = r.left + r.width * (opts.spout?.[0] ?? .15), sy = r.top + r.height * (opts.spout?.[1] ?? .2);
          const tr = target.getBoundingClientRect(), ty = tr.top + tr.height * .35;
          const s = rand(8, 16);
          fxSpawn(opts.drop ? opts.drop() : '', 'pourdrop', sx + rand(-6, 6), sy, s, s, [{ opacity: 1 }, { opacity: 1, dy: (ty - sy) * .9 }, { opacity: 0, dy: ty - sy }], 420).effect.target.style.background = opts.color || '#fff';
        }
        if (Math.random() < .08) Sfx.play(opts.sound || 'pourtick');
        if (p >= 1) { finishedPour = true; cont.classList.remove('tilt'); remove(); Sfx.play('ting'); cont.style.transition = 'left .4s, top .4s'; cont.style.left = home[0]; cont.style.top = home[1]; setTimeout(() => { cont.style.transition = ''; clearHelp(); res(); }, 420); }
      }
      last = t; raf = requestAnimationFrame(tick);
    };
    const remove = holdTool(cont, {
      head: opts.spout || [.15, .2],
      onMove: (x, y) => { const o = inside(x, y, target, opts.margin ?? 60); if (o !== over) { over = o; cont.classList.toggle('tilt', o); target.classList.toggle('target', o); } },
      onUp: () => { over = false; cont.classList.remove('tilt'); target.classList.remove('target'); }
    });
    raf = requestAnimationFrame(tick);
    setHelp(() => Hint.drag(cont, target), opts.helpDelay);
  });
}

/* stir: move the spoon round and round inside the target */
function stirIn(spoon, target, turns = 3, onTurn) {
  return new Promise(res => {
    let angle = null, total = 0, done2 = false;
    const remove = holdTool(spoon, {
      head: [.5, .85],
      onMove: (x, y) => {
        if (done2) return;
        const [cx, cy, r] = rectC(target);
        if (Math.hypot(x - cx, y - cy) > Math.max(r.width, r.height) * .75) { angle = null; return; }
        const a = Math.atan2(y - cy, x - cx);
        if (angle != null) { let d = a - angle; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; total += Math.abs(d); onTurn?.(total / (2 * Math.PI)); }
        angle = a;
        if (Math.random() < .12) Sfx.play('scrub');
        if (total >= turns * 2 * Math.PI) { done2 = true; remove(); clearHelp(); res(); }
      }
    });
    setHelp(() => {
      const [cx, cy, r] = rectC(target); const h = $('#hand');
      const at = (a) => Hint.at(cx + Math.cos(a) * r.width * .3, cy + Math.sin(a) * r.height * .3);
      Hint.stop(); const kf = []; for (let i = 0; i <= 16; i++) kf.push({ transform: at(i / 16 * Math.PI * 4), opacity: i === 0 || i === 16 ? 0 : 1 });
      Hint.anims.push(h.animate(kf, { duration: 2400 }));
    });

/* swipe up (or just tap) on something */
function swipeUp(e) {
  return new Promise(res => {
    e.classList.add('tap', 'glowy');
    let y0 = null;
    const down = ev => { y0 = ev.clientY; ev.preventDefault(); };
    const up = ev => { if (y0 == null) return; const dy = ev.clientY - y0; y0 = null; if (dy < 30) { cleanup(); res(); } };
    const cleanup = () => { e.removeEventListener('pointerdown', down); removeEventListener('pointerup', up); e.classList.remove('glowy'); clearHelp(); };
    e.addEventListener('pointerdown', down); addEventListener('pointerup', up);
    setHelp(() => { const [x, y] = rectC(e); Hint.stop(); const h = $('#hand'); Hint.anims.push(h.animate([{ transform: Hint.at(x, y + 40), opacity: 0 }, { offset: .2, transform: Hint.at(x, y + 40), opacity: 1 }, { offset: .7, transform: Hint.at(x, y - 80), opacity: 1 }, { transform: Hint.at(x, y - 100), opacity: 0 }], { duration: 1400, iterations: 2 })); });
  });
}

/* paint: rub a tool over an area until it's covered (butter, sunscreen, polish...) */
function paintArea(tool, area, cells, opts = {}) {
  return new Promise(res => {
    let n = 0, finished2 = false;
    const remove = holdTool(tool, {
      head: opts.head || [.5, .2],
      onMove: (x, y) => {
        if (finished2) return;
        if (opts.gate && !opts.gate(x, y)) return;
        for (const c of cells) {
          if (c.classList.contains('on')) continue;
          const [cx, cy, r] = rectC(c);
          if (Math.hypot(x - cx, y - cy) < Math.max(r.width, r.height) * (opts.reach || 1)) { c.classList.add('on'); n++; if (Math.random() < .3) Sfx.play(opts.sound || 'scrub'); opts.onPaint?.(c, n / cells.length); }
        }

/* make a grid of paint cells over an area (scene units) */

  const out = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) out.push(el(parent, 'pcell ' + cls, P16(x + i * w / nx, y + j * h / ny, w / nx, h / ny), inner));
  return out;
}

/* pick one of several big picture buttons; resolves with the chosen id */
function choose(parent, list, cls = '') {

    const row = choiceRow(parent, list, (id) => { clearHelp(); setTimeout(() => { row.remove(); res(id); }, 220); }, cls);
    setHelp(() => Hint.tap($('.choice', row)));
  });

/* a sticker that flies to the step rail when a step is done (just for fun) */
function cheerBurst(e, n = 8) { const [x, y] = rectC(e); sparkleAt(x, y, n); }

/* tap every element in a list (any order), each `times` taps; onTap(el, k) */
function tapAll(list, onTap, opts = {}) {

    const need = opts.times || 1; let left = list.length;
    const help = () => setHelp(() => { const t = list.find(e => (e._taps || 0) < need); t && Hint.tap(t); }, opts.helpDelay);
    list.forEach(e => {
      e._taps = 0; e.classList.add('tap'); if (opts.glow !== false) e.classList.add('glowy');
      const h = ev => {

        if (e._taps >= need) { e.removeEventListener('click', h); e.classList.remove('glowy'); if (--left <= 0) { clearHelp(); res(); return; } }

/* drag every item onto the target, in any order; onLand(item) after each */

    const hint = () => setHelp(() => { const n = items.find(i => i.isConnected && !i.classList.contains('locked')); n && Hint.drag(n, target); }, opts.helpDelay);

/* throw some art in an arc from one scene point to another (scene units) */
function arcFly(sc, html, from, to, size, opts = {}) {

  e._n = name; e._o = { ...o }; e.dataset.k = name;
  e.set = (patch = {}) => { Object.assign(e._o, patch); const k = e._n + JSON.stringify(e._o); if (k !== e._k) { e._k = k; e.innerHTML = art(e._n, e._o); } return e; };
  e.swap = (n, o2 = {}) => { e._n = n; e.dataset.k = n; e._o = { ...o2 }; return e.set(); };
  return e.set();
}
/* blend two #rrggbb colours */
function mixHex(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), Bc = p(b); return '#' + A.map((v, i) => Math.round(v + (Bc[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

  /* drag a curtain sideways to open it */
  const openCurtain = (cu, dir) => new Promise(res => {
    let x0 = null, opened = false;
    cu.classList.add('tap', 'glowy');
    const set = f => { cu.style.transform = `translateX(${dir * 26 * f}%) scaleX(${1 - .6 * f})`; };
    const down = e => { e.preventDefault(); x0 = e.clientX; Hint.stop(); cu.style.transition = 'none'; };
    const move = e => {
      if (x0 == null || opened) return;
      const w = sc.getBoundingClientRect().width, f = Math.max(0, Math.min(1, dir * (e.clientX - x0) / (w * .18)));
      set(f); dark.style.opacity = Math.max(.08, .5 - f * .2 - (curL.dataset.open ? .2 : 0) - (curR.dataset.open ? .2 : 0));
      if (f > .55) finish();
    };
    const up = () => { if (x0 == null) return; x0 = null; if (!opened) { cu.style.transition = 'transform .4s'; set(0); } };
    const finish = () => {
      opened = true; cu.dataset.open = 1; cu.classList.remove('glowy', 'tap'); cu.style.transition = 'transform .5s'; set(1);
      Sfx.play('whoosh'); cu.removeEventListener('pointerdown', down); removeEventListener('pointermove', move); removeEventListener('pointerup', up); res();
    };

      lying.innerHTML = figure(c, { eyes: 'closed', mouth: 'o' });

        [lying, blanket].forEach(e => { e.classList.add('tap'); e.addEventListener('click', go); }); blanket.classList.add('glowy');

      blanket.animate([{ transform: 'none' }, { transform: 'translateY(-4%) rotate(-2deg)' }, { transform: 'translateY(-2%) rotate(2deg)' }, { transform: 'none' }], { duration: 900 });
      await wait(950); if (!alive()) return;

STEPS.dress = (root, def, done) => {
  const c = S.child, L = CONFIG.labels, R = ROOM.dress, pj = def.set === 'pyjamas', alive = tkGuard();
  const school = !pj && schoolDay(c);
  const sc = sceneBox(root, 'dressRoom');
  if (pj) { const d = el(sc, 'dark'); d.style.opacity = .2; }
  const mirror = el(sc, 'e standmirror', P16(70, 380, 170, 492), art('standMirror'));
  const refl = el(sc, 'e reflection', P16(90, 470, 130, 230), '');
  const basket = el(sc, 'e laundry', P16(540, 740, 170, 145), art('laundry'));
  const girl = girlEl(sc, c, R.girlX, R.floor, R.girlH);
  const feet = el(sc, 'e zone feet', '', ''); const fh = R.girlH * (c.look.height || 1); put(feet, R.girlX - 90, R.floor - fh * .2, 180, fh * .22);
  const body = el(sc, 'e zone body', '', ''); put(body, R.girlX - 130, R.floor - fh * .95, 260, fh * .8);
  const look = {};                                // what she's putting on right now
  const wearing = () => ({ ...wearNow(c), ...look });
  const redraw = (o = {}) => { girl.draw({ ...wearing(), ...o }); refl.innerHTML = `<div class="flip">${figure(c, { ...wearing(), ...o })}</div>`; };
  redraw();
  const inside = (cls) => el(sc, 'e wardrobe-shelf ' + cls, P16(790, 140, 740, 460), '');

  /* stage 1: tap her, the old clothes pop off, then drag them to the wash */
  const clothesOff = async () => {
    await tapOn(girl, { sound: 'whoosh' });
    const old = wearing().outfit || {};
    const pile = el(sc, 'e pile pop-in', P16(R.girlX + 120, R.floor - 110, 150, 112), art('clothesPile', { color: old.top || old.color || '#4d6a9c', stars: old.pattern === 'stars' }));
    look.outfit = UNDIES; redraw({ mouth: 'cheer' }); flash(girl, 'bounce');
    await dragTo(pile, basket, { margin: 110, shrink: .4, fade: true, hide: true });
    Sfx.play('whoosh'); flash(basket, 'bump'); cheerBurst(basket, 5);
    redraw();
  };
  /* stage 2: the wardrobe */
  const pickClothes = async () => {
    const set = pj ? CONFIG.pyjamas : CONFIG.outfits;
    const ids = pj ? Object.keys(set) : school ? c.uniforms.filter(id => set[id]) : Object.keys(set).filter(id => !set[id].uniform);
    const rows = ids.length > 4 ? 2 : 1, per = Math.ceil(ids.length / rows), slot = R.rail[2] / per;
    const w = rows > 1 ? Math.min(slot, 140) : Math.min(slot * 1.08, 190), h = w * 120 / 84;
    const rail2 = rows > 1 ? el(sc, 'e', P16(R.rail[0], R.rail2 - 10, R.rail[2], 20), `<svg class="art" viewBox="0 0 720 20" preserveAspectRatio="none"><g filter="url(#mk)"><path d="M6 10 H714" stroke="${INK}" stroke-width="16" stroke-linecap="round"/><path d="M6 10 H714" stroke="#c3c8d0" stroke-width="8" stroke-linecap="round"/></g></svg>`) : null;
    const hangers = ids.map((id, i) => {
      const r = Math.floor(i / per), k = i % per, inRow = Math.min(per, ids.length - r * per), off = (per - inRow) * slot / 2;
      const hg = el(sc, 'e hanger', P16(R.rail[0] + off + slot * (k + .5) - w / 2, (r ? R.rail2 : R.rail[1]) - 12, w, h), art('outfitHanger', set[id])); hg.dataset.id = id; return hg;
    });
    let chosen = null;
    await new Promise(res => {
      const wear = id => {
        chosen = id; hangers.forEach(x => x.classList.toggle('worn', x.dataset.id === id));
        look.outfit = outfitDef(id); setLook(c, pj ? 'pyjamas' : school ? 'uniform' : 'outfit', id);
        redraw({ pose: 'cheer', mouth: 'cheer' }); flash(girl, 'bounce'); Sfx.play('sparkle'); cheerBurst(girl, 8); bubble(girl, set[id].word);
        later(() => redraw(), 900);
        doneBtn(sc, res);
      };
      hangers.forEach(hg => {
        hg.classList.add('tap');
        Drag.attach(hg, { targets: () => [{ el: body, accept: true, margin: 100, shrink: .5, fade: true, onDrop: () => { hg.classList.remove('lifted'); wear(hg.dataset.id); } }],
          onTap: () => wear(hg.dataset.id), onMiss: () => Sfx.play('nudge') });
      });
      setHelp(() => Hint.drag(hangers[0], girl));
    });
    $('.done-btn', sc)?.remove(); hangers.forEach(h => h.remove()); rail2?.remove();
  };
  /* stages 3 and 4: socks and shoes (pick a pair from the wardrobe, drag onto her feet) */
  const pickPair = async (kind) => {
    const list = kind === 'socks' ? (school ? ['white', 'green'] : ['white', 'pink', 'sky', 'lemon', 'mint'])
      : kind === 'shoes' ? (school ? ['school', 'sneakers'] : ['sneakers', 'sparkly', 'gumboots', 'sandals']) : Object.keys(SLIPPERS);
    const shelf = inside(kind), n = list.length, w = Math.min(170, 700 / n);
    const items = list.map((k, i) => {
      const html = kind === 'socks' ? art('socks', { color: SOCKS[k], stripes: i % 2 === 1 && !school }) : kind === 'shoes' ? art('shoes', { kind: k }) : art('slippers', { color: SLIPPERS[k] });
      const it = el(sc, 'e pair pop-in', P16(800 + (740 - n * w) / 2 + i * w + 6, 330, w - 12, (w - 12) * (kind === 'socks' ? 1 : .67)), html); it.dataset.k = k; it.style.animationDelay = (i * .06) + 's'; return it;
    });
    await new Promise(res => {
      const put2 = k => {
        items.forEach(x => x.classList.toggle('worn', x.dataset.k === k));
        if (kind === 'socks') { look.socks = SOCKS[k]; setLook(c, 'socks', SOCKS[k]); }
        else if (kind === 'shoes') { look.shoes = k; setLook(c, 'shoes', k); }
        else { setLook(c, 'slipper', SLIPPERS[k]); look.outfit = { ...(look.outfit || wearing().outfit), slipper: SLIPPERS[k] }; }
        redraw({ mouth: 'cheer' }); Sfx.play('pop'); const [x, y] = rectC(feet); sparkleAt(x, y, 6);
        bubble(feet, kind === 'shoes' ? SHOE_KINDS[k] : kind === 'socks' ? 'socks' : 'slippers');
        doneBtn(sc, res);
      };
      items.forEach(it => { it.classList.add('tap'); Drag.attach(it, { targets: () => [{ el: feet, accept: true, margin: 120, shrink: .4, fade: true, onDrop: () => { it.classList.remove('lifted'); put2(it.dataset.k); } }], onTap: () => put2(it.dataset.k), onMiss: () => Sfx.play('nudge') }); });
      setHelp(() => Hint.drag(items[0], feet));
    });
    $('.done-btn', sc)?.remove(); items.forEach(x => x.remove()); shelf.remove();
  };
  /* stage 5: twirl in the mirror */
  const mirrorTime = async () => {
    await tapOn(mirror, { sound: 'tada' });
    redraw({ pose: 'cheer', mouth: 'cheer', eyes: 'happy' });
    girl.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(-1)' }, { transform: 'scaleX(1)' }], { duration: 800, easing: 'ease-in-out' });
    refl.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(-1)' }, { transform: 'scaleX(1)' }], { duration: 800, easing: 'ease-in-out' });
    cheerBurst(girl, 10); cheerBurst(mirror, 8); Sfx.play('sparkle', .3);
    await wait(1300);
  };

  runStages(sc, pj ? [
    { icon: art('laundry'), word: 'Clothes in the wash', run: clothesOff },
    { icon: art('pjIcon'), word: L.pjs, run: pickClothes },
    { icon: art('slippers'), word: 'Pick your slippers', run: () => pickPair('slippers') }
  ] : [
    { icon: art('laundry'), word: 'Pyjamas in the wash', run: clothesOff },
    { icon: art('hanger'), word: L.dress, run: pickClothes },
    { icon: art('socks', { color: '#f7b6c9' }), word: 'Pick your socks', run: () => pickPair('socks') },
    { icon: art('shoes'), word: 'Pick your shoes', run: () => pickPair('shoes') },
    { icon: art('standMirror'), word: 'Look in the mirror', run: mirrorTime }
  ], done);
};

GAMES.fort = (root, done) => {
  const c = S.child, R = ROOM.living, alive = tkGuard();
  const sc = sceneBox(root, 'living');
  const cols = ['#f4d36b', '#f29bb8', '#9fd3f0', '#8cc47e'];
  const homes = [[740, 520], [1080, 520], [300, 820], [1250, 840]];
  const cushions = cols.map((col, i) => el(sc, 'e cushionel', P16(homes[i][0], homes[i][1], 150, 150), art('cushion', { color: col })));
  const spots = [[560, 700], [1000, 700], [700, 640], [860, 640]].map(([x, y]) => el(sc, 'e fortslot', P16(x, y, 150, 150), art('slot')));
  const girl = girlEl(sc, c, 360, R.floor, 400, { mouth: 'cheer' });
  const blanket = el(sc, 'e fortblanket', P16(1180, 640, 330, 190), art('blanket', { color: '#a98bd8' }));
  let fort = null;
  runStages(sc, [
    { icon: art('cushion', { color: '#f29bb8' }), word: 'Build a fort', run: async () => {
      for (let i = 0; i < cushions.length; i++) {
        const open = spots.filter(s => !s.dataset.full);
        const hit = await dragTo(cushions[i], open, { margin: 70, shrink: 1 });
        hit.dataset.full = 1; const [x, y] = sceneXY(sc, hit); put(cushions[i], x - 75, y - 75); hit.style.opacity = 0;
        cushions[i].style.transform = `rotate(${[-8, 8, -4, 5][i]}deg)`; Sfx.play('thud'); cheerBurst(cushions[i], 4);
      }
    } },
    { icon: art('fortIcon'), word: 'Blanket on top!', run: async () => {
      const zone = el(sc, 'e zone', P16(560, 560, 600, 260), '');
      await dragTo(blanket, zone, { margin: 140, shrink: .8, fade: true, hide: true });
      zone.remove(); spots.forEach(s => s.remove());
      fort = el(sc, 'e fort pop-in', P16(520, 520, 680, 382), art('fortTop'));
      Sfx.play('whoosh'); Sfx.play('sparkle', .3); cheerBurst(fort, 10);
      girl.draw({ pose: 'cheer', mouth: 'cheer', eyes: 'happy' });
    } },
    { icon: figure(c, { mouth: 'cheer' }), word: 'Peekaboo! Find her', run: async () => {
      await finished(girl.animate([{ transform: 'none' }, { transform: 'translateX(120%) scale(.8)', opacity: 0 }], { duration: 600, fill: 'forwards' }));
      girl.remove();
      // she pops out of the door, the top, or a side, and hides again
      const peek = girlEl(sc, c, 860, 900, 330, { mouth: 'cheer', eyes: 'happy' }, 'peeker tap');
      const places = [{ x: 860, y: 900, from: 'translateY(60%)' }, { x: 620, y: 760, from: 'translateX(60%) rotate(20deg)' }, { x: 1100, y: 760, from: 'translateX(-60%) rotate(-20deg)' }, { x: 860, y: 690, from: 'translateY(70%)' }];
      let found = 0, cur = -1, showing = false, gen = 0;
      const show = () => {
        if (!alive() || found >= 5) return;
        let k; do { k = Math.floor(Math.random() * places.length); } while (k === cur); cur = k;
        const p = places[k], h = 330 * (c.look.height || 1), w = h * 120 / 210;
        put(peek, p.x - w / 2, p.y - h, w, h);
        peek.animate([{ transform: p.from, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 300, fill: 'forwards', easing: 'ease-out' });
        showing = true; Sfx.play('pop');
        const g = ++gen; later(() => { if (g === gen) hide(); }, 1700);
      };
      const hideNow = () => { gen++; peek.animate([{ transform: 'none', opacity: 1 }, { transform: places[cur].from, opacity: 0 }], { duration: 260, fill: 'forwards' }); later(show, 700); };
      const hide = () => { if (!showing) return; showing = false; hideNow(); };
      await new Promise(res => {
        peek.addEventListener('click', () => {
          if (!showing) return; showing = false; found++; clearHelp();
          peek.innerHTML = figure(c, { pose: 'cheer', mouth: 'cheer', eyes: 'happy' }); Sfx.play('giggle'); cheerBurst(peek, 6);
          bubble(peek, ['peekaboo!', 'found me!', 'hee hee!', 'boo!', 'again!'][found - 1]);
          gen++; later(() => { peek.innerHTML = figure(c, { mouth: 'cheer', eyes: 'happy' }); hideNow(); }, 600);
          if (found >= 5) later(res, 900);
        });
        setHelp(() => showing && Hint.tap(peek), 2500);
        later(show, 500);
      });
    } }
  ], done);
};

/* ---------- ballet: watch the moves, then copy them ---------- */
const MOVES = {
  tiptoe: { pose: 'tiptoe', eyes: 'happy' },
  ballet: { pose: 'ballet', mouth: 'cheer' },
  star: { pose: 'star', mouth: 'cheer' },

GAMES.barre = (root, done) => {
  const c = S.child, R = ROOM.living, alive = tkGuard();
  const sc = sceneBox(root, 'living');
  const girl = girlEl(sc, c, 1330, R.floor, 420, { pose: 'ballet', mouth: 'cheer' });
  const teacher = el(sc, 'e teacher', P16(90, 150, 470, 560), `<div class="tbub">${art('dream')}</div><div class="tcard"></div><div class="tbird">${art('magpie')}</div>`);
  bubble(teacher, 'Miss Magpie');
  const pad = el(sc, 'movepad', '', Object.keys(MOVES).map(k => `<button class="mv box-b" data-k="${k}">${figure(c, MOVES[k])}</button>`).join(''));
  const card = $('.tcard', teacher);
  const doMove = async (k) => {
    const m = MOVES[k]; girl.draw(m); Sfx.play('ting');
    if (m.spin) girl.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(-1)' }, { transform: 'scaleX(1)' }], { duration: 600 });
    else flash(girl, 'bounce');
    notesFrom(girl);
  };
  const easy = (c.look.height || 1) < 1;
  const rounds = easy ? [1, 2, 2] : [1, 2, 3];
  const showSeq = async (seq) => {
    pad.classList.add('off');
    for (const k of seq) {
      if (!alive()) return;
      card.innerHTML = figure(c, MOVES[k]); card.classList.remove('pop-in'); void card.offsetWidth; card.classList.add('pop-in'); Sfx.play('tvtune', 0, 'heelers');
      await wait(1000);
    }
    card.innerHTML = `<div class="yourturn">${art('tapHand')}</div>`;
    pad.classList.remove('off');
  };
  const playRound = (n) => async () => {
    const seq = Array.from({ length: n }, () => Object.keys(MOVES)[Math.floor(Math.random() * 4)]);
    pad.dataset.seq = seq.join(',');
    await showSeq(seq);
    let i = 0;
    await new Promise(res => {
      const onBtn = async e => {
        const b = e.target.closest('.mv'); if (!b || pad.classList.contains('off')) return;
        clearHelp(); const k = b.dataset.k; flash(b, 'pop'); await doMove(k);
        if (k === seq[i]) { i++; if (i >= seq.length) { pad.removeEventListener('click', onBtn); cheerBurst(girl, 8); Sfx.play('cheer'); later(res, 900); } }
        else { i = 0; Sfx.play('nope'); flash(girl, 'shake'); bubble(girl, 'watch again!'); await wait(900); if (alive()) await showSeq(seq); }
      };
      pad.addEventListener('click', onBtn);
      setHelp(() => Hint.tap($(`.mv[data-k="${seq[i]}"]`, pad)), 2600);
    });
  };
  runStages(sc, [
    ...rounds.map((n, r) => ({ icon: `<span class="roundno">${'★'.repeat(r + 1)}</span>`, word: r === 0 ? 'Copy the dance' : 'Copy the dance again', run: playRound(n) })),
    { icon: art('flower'), word: 'Take a bow!', run: async () => {
      pad.remove(); teacher.remove();
      girl.draw({ pose: 'tiptoe', eyes: 'happy' }); Sfx.play('clap'); Sfx.play('tada', .4);
      for (let i = 0; i < 9; i++) { const [x] = rectC(girl), r = sc.getBoundingClientRect(); fxSpawn(art('flower', { color: ['#f29bb8', '#f4d36b', '#e5675c', '#a98bd8'][i % 4] }), '', r.left + rand(.2, .9) * r.width, r.top + 20, 54, 54, [{ t: 'rotate(0)', opacity: 1 }, { dx: (x - r.left - r.width / 2) * .3 + rand(-80, 80), dy: r.height * .55, t: 'rotate(260deg)', opacity: 1 }, { dx: rand(-100, 100), dy: r.height * .7, t: 'rotate(380deg)', opacity: 0 }], 1600 + i * 90); }
      await wait(1800);
    } }
  ], done);
};

/* ---------- bubble treasure ---------- */
AM_GAMES.bubbles = (root, def, done) => {
  const c = S.child, alive = tkGuard(), goal = def.count ? Math.min(def.count, 8) : 8;
  const sc = sceneBox(root, 'garden');
  const girl = girlEl(sc, c, 250, 940, 430, { pose: 'cheer', mouth: 'o' }, 'tap');
  const wand = el(sc, 'e wandel', P16(280, 470, 70, 160), art('wand'));
  const jar = el(sc, 'e jar', P16(1380, 700, 170, 212), art('jar'));
  const jarIn = el(jar, 'jarin', '', '');
  const treasures = ['heartIcon', 'sparkleStar', 'butterfly', 'ladybug', 'note', 'flower'];
  let got = 0, blown = 0, over = false;
  const makeBubble = (x, y, size, opts = {}) => {
    const b = el(sc, 'gbub' + (opts.giant ? ' giant' : ''), `left:${x}%;top:${y}%;width:${size}%;`);
    const t = opts.giant ? null : (opts.treasure ?? Math.random() < .55) ? treasures[Math.floor(Math.random() * treasures.length)] : null;
    if (t) { b.innerHTML = `<div class="bin">${art(t, { color: '#f29bb8' })}</div>`; b.dataset.t = t; }
    const H = sc.clientHeight, dur = rand(5200, 8200) * (opts.giant ? 1.4 : 1);
    const a = b.animate([{ transform: 'translate(0, 0)' }, { transform: `translate(${rand(-80, 80)}px, ${-H * .5}px)` }, { transform: `translate(${rand(-80, 80)}px, ${-H * 1.2}px)` }], { duration: dur, easing: 'linear', fill: 'forwards' });
    a.onfinish = () => b.remove();
    b.addEventListener('pointerdown', e => { e.preventDefault(); popIt(b, a, opts.giant); });
    return b;
  };
  const popIt = (b, a, giant) => {
    if (b.classList.contains('popped') || over) return;
    b.classList.add('popped'); a.pause(); clearHelp();
    Sfx.play('bubblePop'); Sfx.play('pop', .02);
    const [x, y] = rectC(b), sr = sc.getBoundingClientRect();
    if (giant) {
      for (let i = 0; i < 4; i++) makeBubble((x - sr.left) / sr.width * 100 - 4 + rand(-6, 6), (y - sr.top) / sr.height * 100 - 4 + rand(-6, 6), 8, { treasure: true });
      sparkleAt(x, y, 10); Sfx.play('ting');
    } else sparkleAt(x, y, 4);
    const t = b.dataset.t;
    b.animate([{ transform: getComputedStyle(b).transform, opacity: 1 }, { transform: getComputedStyle(b).transform + ' scale(1.5)', opacity: 0 }], { duration: 220, fill: 'forwards' }).onfinish = () => b.remove();
    if (t && got < goal) {
      got++;
      const [jx, jy, jr] = rectC(jar);
      const f = fxSpawn(art(t, { color: '#f29bb8' }), '', x, y, 44, 44, [{ t: 'scale(1)' }, { dx: (jx - x) * .5, dy: (jy - y) * .5 - 120, t: 'scale(1.2) rotate(180deg)' }, { dx: jx - x, dy: jr.bottom - 40 - got * 14 - y, t: 'scale(.8) rotate(360deg)' }], 900);
      setTimeout(() => { const d = document.createElement('div'); d.className = 'jt'; d.style.left = (12 + (got * 37) % 70) + '%'; d.style.bottom = (6 + Math.floor((got - 1) / 2) * 13) + '%'; d.innerHTML = art(t, { color: '#f29bb8' }); jarIn.appendChild(d); flash(jar, 'bump'); Sfx.play('ting'); }, 880);
      if (got >= goal) finish();
    }
  };
  const blow = () => {
    blown++; Sfx.play('whoosh');
    const [wx, wy] = rectC(wand), sr = sc.getBoundingClientRect();
    for (let i = 0; i < 4; i++) setTimeout(() => { if (!over && alive()) makeBubble((wx - sr.left) / sr.width * 100 + i * 4, (wy - sr.top) / sr.height * 100 - 6, rand(8, 12), {}); }, i * 160);
    if (blown % 3 === 0) setTimeout(() => !over && alive() && makeBubble(40 + rand(0, 20), 70, 22, { giant: true }), 700);
  };
  const swoop = () => {
    if (!alive() || over) return;
    const p = el(sc, 'e swoop', P16(-200, 200, 150, 120), art('magpie'));
    Sfx.play('warble');
    p.animate([{ transform: 'translate(0, 0) scaleX(-1)' }, { transform: `translate(${sc.clientWidth * 1.3}px, ${sc.clientHeight * .15}px) scaleX(-1)` }], { duration: 3200, easing: 'ease-in-out' }).onfinish = () => p.remove();
    const tick = () => { if (!p.isConnected) return; $$('.gbub:not(.popped)', sc).forEach(b => { const [bx, by] = rectC(b); if (inside(bx, by, p, 10)) popIt(b, b.getAnimations()[0], b.classList.contains('giant')); }); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    later(swoop, rand(9000, 14000));
  };
  const finish = () => {
    over = true; Sfx.play('cheer'); girl.draw({ pose: 'cheer', mouth: 'cheer', eyes: 'happy' }); flash(girl, 'bounce');
    jar.classList.add('glowy'); $$('.gbub', sc).forEach(b => b.remove());
  };
  girl.addEventListener('click', () => { if (!over) { clearHelp(); flash(girl, 'bounce'); girl.draw({ pose: 'cheer', mouth: 'o' }); blow(); } });
  wand.addEventListener('click', () => girl.click());
  setBanner([art('bubbleWand')], 'Tap her to blow bubbles!');
  runStages(sc, [{ icon: art('jar'), word: 'Fill the jar with treasures', run: () => new Promise(res => {
    const check = () => { if (over) later(res, 1800); else later(check, 300); };
    check(); later(swoop, 6000);
    setHelp(() => { const b = $$('.gbub:not(.popped)', sc).find(x => x.dataset.t && x.getBoundingClientRect().top > 100); b ? Hint.tap(b) : Hint.tap(girl); }, 1500);
    blow();
  }) }], done);
};

AM_GAMES.memory = (root, def, done) => {
  const c = S.child, alive = tkGuard();

  const animals = shuffle(['kangaroo', 'koala', 'magpie', 'frog', 'duck', 'penguin', 'puppy', 'butterfly']).slice(0, pairs);
  const deck = shuffle([...animals, ...animals]);
  const cols = pairs === 3 ? 3 : 4, rows = 2, cw = 210, ch = 260, gap = 40;
  const x0 = 800 - (cols * cw + (cols - 1) * gap) / 2, y0 = 300;
  const cards = deck.map((a, i) => {
    const d = el(sc, 'e mcard tap', P16(x0 + (i % cols) * (cw + gap), y0 + Math.floor(i / cols) * (ch + 30), cw, ch),
      `<div class="mflip"><div class="mback">${art('sparkleStar')}</div><div class="mfront">${art(a)}</div></div>`);
    d.dataset.a = a; return d;
  });
  const girl = girlEl(sc, c, 150, 940, 360, { mouth: 'smile' });
  let open = [], matched = 0, busy = false;
  runStages(sc, [{ icon: art('memoryIcon'), word: 'Find the pairs', run: () => new Promise(res => {
    cards.forEach(d => d.addEventListener('click', async () => {
      if (busy || d.classList.contains('up') || d.classList.contains('matched')) return;

      await wait(700); if (!alive()) return;
      if (a.dataset.a === b.dataset.a) {
        a.classList.add('matched'); b.classList.add('matched'); matched++;
        Sfx.play('ting'); Sfx.play('cheer', .1); cheerBurst(a, 6); cheerBurst(b, 6); bubble(b, a.dataset.a === 'magpie' ? 'magpie!' : a.dataset.a + '!');
        funReact(a, 'boing'); funReact(b, 'boing'); girl.draw({ pose: 'cheer', mouth: 'cheer' }); later(() => girl.draw({ mouth: 'smile' }), 900);
        if (matched >= pairs) later(res, 1200);
      } else { Sfx.play('nudge'); a.classList.remove('up'); b.classList.remove('up'); }

  const strip = el(sc, 'seekstrip', '', who.map(a => `<span class="sk" data-a="${a}">${art(a)}</span>`).join(''));

  let found = 0;
  runStages(sc, [{ icon: art('seekIcon'), word: 'Find the hiding animals', run: () => new Promise(res => {
    const findIt = (a) => {
      const d = critters[a]; if (!d || d.classList.contains('found')) return;
      clearHelp(); d.classList.add('found'); found++;
      const s = SPOTS[place[a]], [dx, dy] = [s.pop[0] - s.animal[0], s.pop[1] - s.animal[1]];
      sc.appendChild(d); Sfx.play({ koala: 'snore', kangaroo: 'boing', magpie: 'warble', frog: 'ribbit', duck: 'duck' }[a] || 'pop'); Sfx.play('ting', .2);

      if (found >= who.length) { Sfx.play('cheer', .6); later(res, 1600); }

STEPS.eat = (root, def, done) => {
  const c = S.child, L = CONFIG.labels, R = ROOM.kitchen, alive = tkGuard(), night = S.routine === 'night';
  const sc = sceneBox(root, 'kitchen');
  el(sc, 'e', P16(...R.win), art(night ? 'windowNight' : 'windowDay'));
  const gh = R.girlH * (c.look.height || 1), gw = gh * 120 / 210, top = R.girlTop + .62 * (R.girlH - gh);
  const girl = el(sc, 'e who-fig', P16(R.girlX - gw / 2, top, gw, gh), figure(c, { pose: 'sit' }));
  const mouthY = top + gh * 80 / 210;
  el(sc, 'e', P16(...R.table), art('tableFront'));
  const cup = el(sc, 'e cup', P16(1010, 556, 90, 110), art('cup'));
  const menu = (def.menu || []).filter(id => CONFIG.foods[id]);
  setBanner([art(CONFIG.foods[menu[0]]?.art || 'cereal')], L.eatPick);
  choose(sc, menu.map(id => ({ id, word: CONFIG.foods[id].word, html: art(CONFIG.foods[id].art) }))).then(id => {
    if (!alive()) return;
    cup.style.display = 'none';
    const food = CONFIG.foods[id], recipe = RECIPES[food.recipe || id];
    const ctx = { sc, girl, c, food, vessel: null, extras: [], keep: [] };
    const cook = recipe ? recipe(ctx) : [];
    const eatStage = { icon: art('spoon'), word: L.eatTap, run: () => eatIt(ctx) };
    const stages = [...cook, eatStage];
    if (def.clear) stages.push(
      { icon: art('sinkIcon'), word: L.clearTable, run: () => toSink(ctx) },
      { icon: art('cloth'), word: 'Wipe the table', run: () => wipe(ctx) });
    runStages(sc, stages, done);
  });

  /* eat: tap the food, a spoonful flies to her mouth */
  async function eatIt(ctx) {
    ctx.extras.forEach(e => { if (!ctx.keep.includes(e)) e.remove(); }); ctx.extras = [];
    if (ctx.vessel) ctx.vessel.remove();
    const p = el(sc, 'e plate tap', P16(...R.plate), art(ctx.eatArt || ctx.food.art, ctx.foodOpts || {})); ctx.vessel = p;
    const total = $$('.bite', p).length || 1;
    cup.style.display = '';
    await new Promise(res => {
      let busy = false;
      p.addEventListener('click', async () => {
        if (busy) return;
        const left = $$('.bite', p).filter(b => b.style.display !== 'none'); if (!left.length) return;
        busy = true; clearHelp();
        const spoon = el(sc, 'e spoonfly', P16(R.girlX - 30, 560, 60, 150), art('spoon'));
        const H = sc.clientHeight, up = (560 - mouthY + 10) / 1000 * H;
        await finished(spoon.animate([{ transform: 'translate(0, 0) rotate(20deg)' }, { transform: `translate(0, ${-up}px) rotate(0deg)` }], { duration: 360, easing: 'ease-in-out', fill: 'forwards' }));
        if (!alive()) return;
        left[left.length - 1].style.display = 'none'; ctx.keep.forEach(k => k.style.opacity = (left.length - 1) / total);
        girl.innerHTML = figure(c, { pose: 'sit', mouth: 'chew' }); Sfx.play('chomp');
        spoon.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' }).onfinish = () => spoon.remove();
        await wait(480); if (!alive()) return;
        girl.innerHTML = figure(c, { pose: 'sit' }); busy = false;
        if (left.length === 1) {
          girl.innerHTML = figure(c, { pose: 'cheer', mouth: 'cheer', eyes: 'happy' }); Sfx.play('yum'); setBanner([art('heartIcon')], L.yum);
          const [x, y] = rectC(girl); for (let i = 0; i < 5; i++) fxSpawn(art('heartIcon'), '', x + rand(-80, 80), y - 40, 40, 40, [{ opacity: 0 }, { opacity: 1, dy: -40 }, { opacity: 0, dy: -130 }], 1200 + i * 120);
          later(res, 1300);
        }
      });
      setHelp(() => Hint.tap(p));
    });
    girl.innerHTML = figure(c, { pose: 'sit' }); ctx.keep.forEach(k => k.remove()); ctx.keep = [];
  }
  /* dishes to the sink */
  async function toSink(ctx) {
    const sink = el(sc, 'e sinkzone', P16(...R.sink), '');
    for (const d of [ctx.vessel, cup]) {
      await dragTo(d, sink, { margin: 160, shrink: .3, fade: true, hide: true });
      Sfx.play('splash'); const [x, y] = rectC(sink); foam(x, y, 6);
    }
    sink.remove(); Sfx.play('ting');
  }
  /* crumbs and a spill appear; rub them away with the cloth */
  async function wipe(ctx) {
    const spots = [[700, 640, 0], [860, 660, '#e5675c'], [980, 636, 0], [560, 650, 0]].map(([x, y, sp]) => ({ el: el(sc, 'germ', P16(x - 40, y - 26, 80, 52), art('crumbs', { spill: sp || null })) }));
    const cloth = el(sc, 'e clothel', P16(1180, 560, 150, 100), art('cloth'));
    setHelp(() => Hint.drag(cloth, spots.find(s => !s.gone)?.el || cloth));
    await new Promise(res => scrubber(cloth, spots, {
      need: 200, headX: .5, headY: .5,
      onScrub: (x, y) => { if (Math.random() < .3) foam(x, y, 1); Sfx.play('scrub'); },
      onClean: sp => { sp.el.classList.add('pop'); Sfx.play('squish'); },
      onAll: () => { cloth.style.pointerEvents = 'none'; Sfx.play('ting'); const [x, y] = scenePt(sc, 800, 640); sparkleAt(x, y, 10); girl.innerHTML = figure(c, { pose: 'cheer', mouth: 'cheer' }); later(res, 900); }
    }));
  }
};

/* the girl reacts at the table */
function yay(ctx, word) {
  const { girl, c } = ctx; girl.innerHTML = figure(c, { pose: 'cheer', mouth: 'cheer', eyes: 'happy' });
  if (word) bubble(girl, word);
  later(() => { if (girl.isConnected) girl.innerHTML = figure(c, { pose: 'sit' }); }, 1000);
}
const look = (ctx, mouth = 'o') => { ctx.girl.innerHTML = figure(ctx.c, { pose: 'sit', mouth }); };
/* recipe-scoped helpers: everything made here is cleared away when it's time to eat */
const mk = (ctx, cls, box, name, o) => { const e = liveArt(ctx.sc, cls, box, name, o); ctx.extras.push(e); return e; };
const tray = (ctx, list) => { const a = trayItems(ctx.sc, list); ctx.extras.push(...a); return a; };
const plateXY = ([px, py]) => [K_SPOT.vessel[0] + px / 160 * K_SPOT.vessel[2], K_SPOT.vessel[1] + py / 90 * K_SPOT.vessel[3]];

  return [
    { icon: art('cerealBox'), word: 'Pour the cereal', run: async () => {
      await pourStep(ctx.sc, 'cerealBox', bowl, { at: [1130, 400, 140, 210], time: 1700, color: '#d39c4f', sound: 'rattle', spout: [.25, .08], onProgress: p => bowl.set({ hoops: Math.round(p * 13) / 13 }) });
      yay(ctx);
    } },
    { icon: art('milkCarton'), word: 'Pour the milk', run: async () => {
      await pourStep(ctx.sc, 'milkCarton', bowl, { at: [1150, 410, 110, 206], time: 1500, color: '#fff', spout: [.3, .1], onProgress: p => bowl.set({ milk: Math.round(p * 8) / 8 }) });

      mk(ctx, 'ingr', [1000, 596, 340, 64], 'board');
      const ban = mk(ctx, 'ingr', [1040, 512, 240, 96], 'bananaWhole');
      const edge = k => 1040 + 240 * (1 - .27 * k);
      const knife = mk(ctx, 'ingr chopper', [edge(1) - 90, 408, 180, 64], 'knife');
      const slices = [];
      await tapTimes(ban, 3, k => {
        Sfx.play('chop');
        knife.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(120%)' }, { transform: 'translateY(0)' }], { duration: 260 });
        ban.style.clipPath = `inset(0 ${k * 27}% 0 0)`;
        const s = mk(ctx, 'ingr pop-in', [edge(k) + 4, 540, 64, 64], 'bananaSlice'); slices.push(s);
        s.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${18 + k * 4}%) rotate(90deg)` }], { duration: 300, fill: 'forwards' });
        later(() => { if (k < 3) put(knife, edge(k + 1) - 90, 408); }, 280);

/* ---------------- TOAST: in, down, POP, spread, cut ---------------- */
const SPREADS = [
  { id: 'butter', word: 'butter', color: '#f9e08a', lid: '#7aa9de' },
  { id: 'jam', word: 'jam', color: '#e5675c', lid: '#f4d36b' },

RECIPES.toast = ctx => {
  const sc = ctx.sc;
  const toaster = mk(ctx, 'appl', [300, 438, 264, 192], 'toaster', { bread: 0 });
  ctx.vessel = liveArt(sc, 'vessel', K_SPOT.vessel, 'plateEmpty');
  const slots = [[664, 522, 124, 112], [812, 522, 124, 112]];
  let slices = [], col = SPREADS[0].color;
  return [
    { icon: art('bread'), word: 'Bread in the toaster', run: async () => {
      const items = tray(ctx, [{ art: 'bread', tall: .9 }, { art: 'bread', tall: .9 }]);
      await dropAll(items, toaster, i => toaster.set({ bread: i + 1 }));
    } },
    { icon: art('toaster', { bread: 2, down: true }), word: 'Push it down', run: async () => {
      await tapOn(toaster, { sound: 'click' });
      toaster.set({ bread: 2, down: true }); look(ctx, 'o');
      const glow = mk(ctx, 'k-steam', [330, 330, 200, 112], 'wisp');
      for (let i = 0; i < 7; i++) { await wait(330); Sfx.play('tick'); flash(toaster, 'bump'); }
      glow.remove();
      Sfx.play('boing'); toaster.set({ bread: 0, down: false });
      await Promise.all(slots.map((s, i) => arcFly(sc, art('bread', { toast: true }), [400 + i * 60, 440], [s[0] + s[2] / 2, s[1] + s[3] / 2], [s[2], s[3]], { lift: 300, spin: 360, ms: 800 + i * 120 })));
      slices = slots.map(s => mk(ctx, 'vessel2', s, 'bread', { toast: true }));
      Sfx.play('thud'); yay(ctx, 'pop!');
    } },
    { icon: art('knife', { blob: '#e5675c' }), word: 'Spread it', run: async () => {
      const pick = await choose(sc, SPREADS.map(s => ({ id: s.id, word: s.word, html: art('spreadJar', { color: s.color, lid: s.lid }) })));
      const sp = SPREADS.find(s => s.id === pick); col = sp.color;
      const jar = mk(ctx, 'ingr pop-in', [1190, 492, 126, 140], 'spreadJar', { color: sp.color, lid: sp.lid });
      const knife = mk(ctx, 'ingr', [1000, 560, 180, 64], 'knife');
      const cells = slots.flatMap(s => paintCells(sc, s[0] + 20, s[1] + 26, s[2] - 40, s[3] - 44, 3, 3, 'spread'));
      cells.forEach(cl => { cl.style.background = col; cl.style.borderRadius = '45%'; cl.style.opacity = ''; ctx.extras.push(cl); });
      let loaded = false;
      await paintArea(knife, slices[0], cells, {
        head: [.12, .5], reach: 1.5, sound: 'squish',
        helpTo: () => loaded ? slices[0] : jar,
        gate: (x, y) => { if (!loaded && inside(x, y, jar, 20)) { loaded = true; knife.set({ blob: col }); Sfx.play('squish'); flash(jar, 'bump'); setHelp(() => Hint.drag(knife, slices[0])); } return loaded; }
      });
      slices.forEach(s => s.set({ toast: true, spread: col })); cells.forEach(cl => cl.remove());

    } }

};

  const sc = ctx.sc;
  const bowl = mk(ctx, 'appl', [300, 476, 260, 146], 'mixBowl', {});
  const stack = ctx.vessel = liveArt(sc, 'vessel', K_SPOT.vessel, 'pancakeStack', { n: 0 });

  return [
    { icon: art('flourBag'), word: 'Make the batter', run: async () => {

      const [fx, fy] = sceneXY(sc, bowl); const [px, py] = scenePt(sc, fx, fy - 40); for (let i = 0; i < 6; i++) later(() => foam(px + rand(-60, 60), py, 1), i * 80);

      const [bx, by] = sceneXY(sc, bowl);
      arcFly(sc, art('eggShell'), [bx, by - 50], [bx - 170, by + 40], [60, 40], { lift: 120, spin: -220 });
      arcFly(sc, art('eggShell'), [bx, by - 50], [bx + 150, by + 40], [60, 40], { lift: 150, spin: 220 });
      await wait(500);
      setBanner([art('milkCarton')], 'Pour the milk');
      await pourStep(sc, 'milkCarton', bowl, { at: [1150, 410, 110, 206], time: 1400, color: '#fff', spout: [.3, .1], onProgress: p => bowl.set({ milk: Math.round(p * 5) / 5 }) });

/* ---------------- TEETH ---------------- */
STEPS.teeth = (root, def, done) => {
  const c = S.child, alive = tkGuard(), night = NIGHT();
  const sc = sceneBox(root, 'bathroom');
  const base = { look: c.look, ...wearNow(c) };
  const brushCol = c.look.dress || '#7aa9de';
  const mouth = o => art('figureMouth', { ...base, ...o });
  runStages(sc, [
    { icon: art('pasteTube'), word: 'Toothpaste on', run: async () => {
      const br = liveArt(sc, 'tbrush', [250, 520, 1000, 225], 'brushBig', { color: brushCol, paste: 0 });
      const tube = liveArt(sc, 'tube pop-in', [884, 400, 420, 175], 'pasteTube', { squish: 0 });
      await tapTimes(tube, 3, k => {
        Sfx.play('squish'); tube.set({ squish: k });
        tube.animate([{ transform: 'scale(1,1)' }, { transform: 'scale(.96,.8)' }, { transform: 'scale(1,1)' }], { duration: 300 });
        br.set({ color: brushCol, paste: k / 3 }); flash(br, 'bump');
      });
      Sfx.play('ting'); cheerBurst(br, 6); await wait(600);
      await Promise.all([br, tube].map(e => finished(e.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(10%)' }], { duration: 350, fill: 'forwards' }))));
      br.remove(); tube.remove();
    } },
    { icon: art('germ', { color: '#8cc47e' }), word: night ? 'Get the sleepy germs!' : 'Brush the germs!', run: () => brushGerms() },
    { icon: art('rinseCup'), word: 'Rinse and spit', run: () => rinse() },
    { icon: art('sparkleTooth'), word: 'Sparkly smile!', run: () => sparkle() }
  ], done);

  let face = null;
  async function brushGerms() {
    face = el(sc, 'e mface', P16(160, 90, 1000, 767), mouth({ mouth: 'smile' }));
    const basin = el(sc, 'e basin', P16(1160, 700, 400, 160), art('basin'));
    setBanner([art('figureHead', { ...base, mouth: 'teeth' })], 'Open wide!');
    await tapOn(face, { sound: 'pop' }); face.classList.remove('tap');
    face.innerHTML = mouth({ mouth: 'teeth' });
    setBanner([art('germ')], night ? 'Get the sleepy germs!' : 'Brush the germs!');
    const SP = [[540, 520], [660, 512], [780, 520], [560, 645], [660, 652], [760, 645], [600, 585], [720, 585]];
    const cols = ['#8cc47e', '#a98bd8', '#f0a65a', '#7cc7c0', '#e98aa6', '#f4d36b'];
    const n = (c.look.height || 1) < 1 ? 5 : 6, used = new Set();
    const spots = Array.from({ length: n }, (_, i) => {
      let k; do { k = Math.floor(Math.random() * SP.length); } while (used.has(k)); used.add(k);
      const [x, y] = SP[k];
      const g = el(sc, 'germ pop-in', P16(x - 55, y - 55, 110, 110), art('germ', { color: cols[i] }) + (night ? `<div class="gcap">${art('sleepCap')}</div>` : ''));
      g.style.animationDelay = (i * .12) + 's';
      return { el: g, k };
    });
    later(() => Sfx.play('giggle'), 300);
    // germs hop to another tooth every so often (but never while being brushed)
    const hop = () => {
      if (!alive() || !spots.some(s => !s.gone)) return;
      const free = spots.filter(s => !s.gone && (s.work || 0) < 25);
      if (free.length) {
        const s = free[Math.floor(Math.random() * free.length)];
        const open = SP.map((_, k) => k).filter(k => !spots.some(o => !o.gone && o.k === k));
        if (open.length) { s.k = open[Math.floor(Math.random() * open.length)]; const [x, y] = SP[s.k]; glideTo(s.el, x - 55, y - 55, 380); Sfx.play('squeak'); if (night) bubble(s.el, 'zzz'); }
      }
      later(hop, night ? 2600 : 1700);
    };
    later(hop, 1800);
    const tool = el(sc, 'tool brushtool', P16(1180, 380, 300, 300), art('toothbrush'));
    await new Promise(res => {
      scrubber(tool, spots, {
        need: 200, headX: .78, headY: .3,
        onStart: () => Sfx.play('pick'),
        onScrub: (x, y) => { foam(x, y, 1); Sfx.play('scrub'); },
        onClean: sp => { sp.el.getAnimations().forEach(an => an.cancel()); sp.el.classList.add('pop'); Sfx.play('squish'); const [x, y] = rectC(sp.el); sparkleAt(x, y, 4); setHelp(help); },
        onAll: () => { tool.style.pointerEvents = 'none'; clearHelp(); later(res, 500); }
      });
      const help = () => Hint.drag(tool, spots.find(s => !s.gone)?.el || face);
      setHelp(help);
    });
    tool.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }).onfinish = () => tool.remove();
  }
  async function rinse() {
    face.innerHTML = mouth({ mouth: 'smile' });
    const cup = el(sc, 'e rcup', P16(1380, 560, 130, 117), art('rinseCup'));
    await tapOn(cup, { sound: 'splash' });
    await glideTo(cup, 600, 640, 450);
    face.innerHTML = mouth({ mouth: 'chew' }); Sfx.play('gargle');
    setBanner([art('rinseCup')], 'Gargle gargle!');
    const [mx, my] = scenePt(sc, 660, 560);
    for (let i = 0; i < 8; i++) later(() => foam(mx + rand(-120, 120), my + rand(-30, 30), 1), i * 140);
    face.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-1%)' }, { transform: 'translateY(0)' }], { duration: 180, iterations: 6 });
    await wait(1300); if (!alive()) return;
    cup.remove(); setBanner([art('basin')], 'Spit!');
    const basin = $('.basin', sc);
    await tapOn(basin, { sound: 'spit' });
    face.innerHTML = mouth({ mouth: 'o' });

/* slide the zip pull along the zip to close the bag (a tap zips it for you) */
function zipDrag(bag) {
  return new Promise(res => {
    const svg = $('.bp-closed', bag), gap = $('.zip-gap', svg), pull = $('.zip-pull', svg);
    const P = [[62, 134], [150, 74], [238, 134]];
    const at = t => { const u = 1 - t; return [u * u * P[0][0] + 2 * u * t * P[1][0] + t * t * P[2][0], u * u * P[0][1] + 2 * u * t * P[1][1] + t * t * P[2][1]]; };
    const set = q => { const [x, y] = at(q); pull.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`); gap.setAttribute('stroke-dashoffset', (-100 * q).toFixed(2)); };
    let p = 0, lastSnd = 0, active = false, x0 = 0, moved = 0, over = false;
    set(0);
    setBanner([art('zipIcon')], 'Zip it up!');
    bag.classList.add('zipme');
    const toScreen = q => { const r = svg.getBoundingClientRect(), [x, y] = at(q); return [r.left + x / 300 * r.width, r.top + y / 340 * r.height]; };
    const help = () => { Hint.stop(); const h = $('#hand'); const kf = []; for (let i = 0; i <= 10; i++) { const [x, y] = toScreen(i / 10); kf.push({ transform: Hint.at(x, y), opacity: i === 0 || i === 10 ? 0 : 1 }); } Hint.anims.push(h.animate(kf, { duration: 1600, iterations: 2 })); };
    const finish = () => {
      if (over) return; over = true; cleanup(); set(1); Sfx.play('ting'); flash(bag, 'bump'); res();
    };
    const move = e => {
      if (!active) return; e.preventDefault(); moved += Math.abs(e.clientX - x0); x0 = e.clientX;
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 300, q = Math.min(1, Math.max(0, (x - 62) / 176));
      if (q > p) { p = q; set(p); if (p - lastSnd > .14) { Sfx.play('zip', 0, .22); lastSnd = p; } }
      if (p >= .95) finish();
    };
    const up = () => {
      if (!active) return; active = false;
      if (moved < 12 && !over) { over = true; cleanup(); zipAnim(bag, false, 650).then(() => { Sfx.play('ting'); res(); }); }
    };
    const down = e => { e.preventDefault(); e.stopPropagation(); Hint.stop(); active = true; x0 = e.clientX; moved = 0; move(e); };
    const cleanup = () => { bag.classList.remove('zipme'); bag.removeEventListener('pointerdown', down); removeEventListener('pointermove', move); removeEventListener('pointerup', up); clearHelp(); };
    bag.addEventListener('pointerdown', down); addEventListener('pointermove', move, { passive: false }); addEventListener('pointerup', up);
    setHelp(help, 700);
  });
}

GAMES.blocks = (root, done) => {
  const c = S.child, alive = tkGuard(), FLOOR = 900, RIGHT = 1220;
  const sc = sceneBox(root, 'playroom');
  const girl = girlEl(sc, c, 140, 940, 360, { pose: 'cheer', mouth: 'cheer' });
  const TYPES = [
    { kind: 'sq', w: 120, h: 120, color: '#e5675c', tx: 1280, ty: 610 },
    { kind: 'long', w: 240, h: 64, color: '#7aa9de', tx: 1300, ty: 760 },
    { kind: 'tall', w: 64, h: 180, color: '#f4d36b', tx: 1480, ty: 640 },
    { kind: 'tri', w: 130, h: 110, color: '#8cc47e', tx: 1400, ty: 600 }
  ];
  const placed = [], trayEls = {};
  let onPlace = null, allow = ['sq', 'long', 'tall'];
  const place = (b, d) => Object.assign(d.style, { left: (b.x / 16) + '%', top: (b.y / 10) + '%', width: (b.w / 16) + '%', height: (b.h / 10) + '%' });
  TYPES.forEach(t => {
    const d = el(sc, 'e tray-block tap', '', blockHTML(t)); place({ x: t.tx, y: t.ty, w: t.w, h: t.h }, d); trayEls[t.kind] = d;
    d.addEventListener('pointerdown', e => { if (allow.includes(t.kind)) grab(e, t); });
  });
  const showTray = () => TYPES.forEach(t => trayEls[t.kind].classList.toggle('off', !allow.includes(t.kind)));
  showTray();
  const toScene = (cx, cy) => { const r = sc.getBoundingClientRect(); return [(cx - r.left) / r.width * 1600, (cy - r.top) / r.height * 1000]; };
  function grab(e, t) {
    e.preventDefault(); Hint.stop(); Sfx.play('pick');
    const b = { kind: t.kind, w: t.w, h: t.h, color: t.color, x: 0, y: 0 };
    const d = el(sc, 'e block held', '', blockHTML(b));
    const follow = ev => { const [x, y] = toScene(ev.clientX, ev.clientY); b.x = x - b.w / 2; b.y = y - b.h / 2; place(b, d); };
    follow(e);
    const move = ev => { ev.preventDefault(); follow(ev); };
    const up = () => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      d.classList.remove('held');
      if (b.x + b.w / 2 > RIGHT) { d.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.5)' }], 200).onfinish = () => d.remove(); return; }
      b.x = Math.max(260, Math.min(RIGHT - b.w, b.x));
      drop(b, d);
    };
    addEventListener('pointermove', move, { passive: false }); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  }
  function landing(b) {
    const over = placed.filter(p => p.x < b.x + b.w - 8 && p.x + p.w > b.x + 8);
    if (!over.length) return { top: FLOOR, support: null };
    const top = Math.min(...over.map(p => p.y));
    return { top, support: over.filter(p => Math.abs(p.y - top) < 3) };
  }
  async function drop(b, d) {
    const startY = b.y, { top, support } = landing(b), cx = b.x + b.w / 2;
    const stable = !support || (support.every(p => p.kind !== 'tri') && cx >= Math.min(...support.map(p => p.x)) - 4 && cx <= Math.max(...support.map(p => p.x + p.w)) + 4);
    const restY = top - b.h, H = sc.clientHeight, fall = Math.max(0, restY - startY) / 1000 * H;
    await finished(d.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${fall}px)` }], { duration: 180 + Math.sqrt(Math.max(1, fall)) * 22, easing: 'cubic-bezier(.5,0,1,1)', fill: 'forwards' }));
    if (!alive()) return;
    d.getAnimations().forEach(a => a.cancel()); b.y = restY; place(b, d);
    if (stable) {
      Sfx.play('thud'); d.animate([{ transform: 'scale(1.06, .9)' }, { transform: 'none' }], { duration: 220, easing: 'ease-out' });
      placed.push(b); b.el = d; d.classList.add('tap'); d.addEventListener('click', () => { flash(d, 'wiggle'); Sfx.play('pop'); });
      onPlace?.(b, support); return;
    }
    Sfx.play('nope');
    const leftEdge = Math.min(...support.map(p => p.x)), rightEdge = Math.max(...support.map(p => p.x + p.w));
    const dir = support.some(p => p.kind === 'tri') ? (Math.random() < .5 ? -1 : 1) : (cx < (leftEdge + rightEdge) / 2 ? -1 : 1);
    const nb = { ...b, w: b.h, h: b.w };

/* ---------- a little puppet theatre that plays inside the TV ---------- */
function cartoonStage(tv, live) {
  const W = () => tv.clientWidth, H = () => tv.clientHeight;
  const tf = p => `translate(${p.x / 100 * W()}px, ${p.y / 100 * H()}px) rotate(${p.r}deg) scale(${p.s * p.f}, ${p.s})`;
  const S2 = {
    /* add an actor: art html, top-left x/y and width in % of the screen; ar = art height / width */
    add(html, x, y, w, ar, z = 3, origin = '50% 100%') {
      const h = w * ar * W() / H();
      const e = el(tv, 'act', `left:${x}%;top:${y}%;width:${w}%;height:${h}%;z-index:${z};transform-origin:${origin}`, `<div class="in">${html}</div>`);
      e.p = { x: 0, y: 0, r: 0, s: 1, f: 1 }; e.h = h; return e;
    },
    look(e, html) { $('.in', e).innerHTML = html; },
    walk(e, on) { e.classList.toggle('walking', on); },
    /* move to new offsets (relative to where it started); mid = optional half-way point (for arcs) */
    to(e, q, ms, ease = 'ease-in-out', mid) {
      const a = { ...e.p }, b = { ...e.p, ...q }; e.p = b;
      const kf = [{ transform: tf(a) }]; if (mid) kf.push({ transform: tf({ ...a, ...mid }), offset: .5 }); kf.push({ transform: tf(b) });
      e.getAnimations().forEach(x => x.cancel());
      return finished(e.animate(kf, { duration: ms, easing: ease, fill: 'forwards' }));
    },
    arc(e, q, ms, lift = 20, spin = 0) {
      const a = { ...e.p }, b = { ...e.p, ...q, r: (q.r ?? a.r) + spin }; e.p = b; const kf = [];
      for (let i = 0; i <= 10; i++) { const t = i / 10; kf.push({ transform: tf({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t - lift * 4 * t * (1 - t), r: a.r + (b.r - a.r) * t, s: a.s + (b.s - a.s) * t, f: b.f }) }); }
      e.getAnimations().forEach(x => x.cancel());
      return finished(e.animate(kf, { duration: ms, easing: 'linear', fill: 'forwards' }));
    },
    fade(e, to = 0, ms = 300) { return finished(e.animate([{ opacity: getComputedStyle(e).opacity }, { opacity: to }], { duration: ms, fill: 'forwards' })); },
    sfx(name, ...a) { if (live()) Sfx.play(name, 0, ...a); },
    async wait(ms) { await wait(ms); return live(); }
  };
  return S2;
}

STEPS.books = (root, def, done) => {
  const c = S.child, L = CONFIG.labels, R = ROOM.bedroom, alive = tkGuard();
  const sc = sceneBox(root, 'bedroom');
  el(sc, 'e', P16(...R.win), art('windowNight'));
