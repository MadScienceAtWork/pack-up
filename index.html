<script>
/* =====================================================================
   ROUTINE CONFIG — edit this part to change the game.
   ---------------------------------------------------------------------
   children : who plays (order = order on the start screen)
     look     : hair / dress colours, hairstyle (pigtails | long), freckles, height (1 = tallest)
     backpack : colour, pocket colour, deco (rainbow | unicorn | none)
     items    : { id }               -> uses the item from CONFIG.items
                { id, days:["mon"] } -> only on those days (sun mon tue wed thu fri sat)
                { id, color:"#hex" } -> colour just for this child
                { id, spot:"shelf" } -> where it goes when unpacking (overrides item)
   items    : real things for the bag. word = shown on screen
              hide = rooms it likes to hide in (bedroom bathroom play kitchen table books)
   decoys   : silly things hiding in the house that DON'T go in the bag
              fun  = what it does when tapped (strum bubbles squeak duck spin clang boing blub)
   sillyCount : how many silly things hide each game (grown-up menu can change it)
   spots    : where things live in the house when unpacking
   surprises: silly things that pop out of the bag when it is opened
   routines : Morning and Night — the steps in order (reorder or delete freely)
   steps    : each step's word and which mini-game it uses (kind)
   outfits / pyjamas : clothes to pick from (type + colours + pattern)
   children.hairStyles : the 3 hair styles each girl can choose
   foods / shows / books : what's on the menu, on TV and on the book shelf
   After editing, bump CACHE in sw.js so the installed app picks up the change.
   ===================================================================== */
const CONFIG = {
  title: "Pack Up!",
  sillyCount: 6,

  children: [
    {
      id: "luna",
      name: "Luna",
      badge: "moon",
      accent: "#f29bb8",
      look: { hair: "#bd8a55", hairDark: "#93683c", style: "pigtails", bobble: "#f29bb8", freckles: true, height: 1 },
      outfit: "pinkDress", pyjamas: "starPjs",
      uniforms: ["uniformDress", "uniformPolo"],                   // school days: only these
      schoolDays: ["mon", "tue", "wed", "thu", "fri"],
      hairStyles: ["pigtails", "ponytail", "plaits"],
      afterWord: "After school",
      fromWord: "Findon",
      place: "school",                  // school: one-storey building with a sports yard
      backpack: { color: "#7cc47e", pocket: "#d8f0cd", deco: "rainbow" },
      items: [
        { id: "bottle", color: "#9b82d9" },
        { id: "lunch" },
        { id: "clothes" },
        { id: "sunscreen" },
        { id: "readingBag", days: ["mon"] },
        { id: "libraryBag", days: ["wed"] },
        { id: "mathsBag",   days: ["fri"] }
      ]
    },
    {
      id: "stella",
      name: "Stella",
      badge: "star",
      accent: "#7aa9de",
      look: { hair: "#dcb679", hairDark: "#a98049", style: "long", bobble: "#7aa9de", clip: "star", freckles: false, height: 0.82 },
      outfit: "blueDress", pyjamas: "unicornNightie",
      hairStyles: ["long", "bun", "pigtails"],
      afterWord: "After Nino",
      fromWord: "Nino",
      place: "childcare",               // childcare: playground and gum trees
      backpack: { color: "#e5675c", pocket: "#fcd6ce", deco: "unicorn" },
      items: [
        { id: "bottle", color: "#ef9ab8" },
        { id: "toy" },
        { id: "hat" },
        { id: "clothes" }
      ]
    }
  ],

  items: {
    bottle:     { word: "water bottle",      art: "bottle",     spot: "bench",  color: "#7aa9de", hide: ["kitchen", "table"] },
    lunch:      { word: "lunch box",         art: "lunchbox",   spot: "bench",  color: "#e5675c", hide: ["kitchen", "table"] },
    clothes:    { word: "change of clothes", art: "clothes",    spot: "basket",                   hide: ["bedroom", "bathroom"] },
    sunscreen:  { word: "sunscreen",         art: "sunscreen",  spot: "sink",                     hide: ["bathroom", "bedroom"] },
    hat:        { word: "hat",               art: "hat",        spot: "hook",   color: "#f4d36b", hide: ["bedroom", "play"] },
    toy:        { word: "toy",               art: "doll",       spot: "toybox",                   hide: ["play", "bedroom"] },
    readingBag: { word: "reading bag",       art: "readingBag", spot: "bookshelf",  color: "#7aa9de", hide: ["books", "table"] },
    libraryBag: { word: "library bag",       art: "libraryBag", spot: "bookshelf",  color: "#8cc47e", hide: ["books", "play"] },
    mathsBag:   { word: "maths bag",         art: "mathsBag",   spot: "bookshelf",  color: "#f4d36b", hide: ["table", "books"] }
  },

  decoys: {
    guitar:    { word: "guitar",       art: "guitar",     fun: "strum",   hide: ["play", "bedroom"] },
    bubbles:   { word: "bubble wand",  art: "bubbleWand", fun: "bubbles", hide: ["play", "bathroom"] },
    guineaPig: { word: "guinea pig",   art: "guineaPig",  fun: "squeak",  hide: ["play", "bedroom", "kitchen"] },
    cap:       { word: "baseball cap", art: "cap",        fun: "spin",    hide: ["bedroom", "play"] },
    duck:      { word: "rubber duck",  art: "duck",       fun: "duck",    hide: ["bathroom"] },
    saucepan:  { word: "saucepan",     art: "saucepan",   fun: "clang",   hide: ["kitchen"] },
    cactus:    { word: "cactus",       art: "cactus",     fun: "boing",   hide: ["table", "books"] },
    fishbowl:  { word: "fish bowl",    art: "fishbowl",   fun: "blub",    hide: ["books", "table"] }
  },

  rooms: { bedroom: "bedroom", bathroom: "bathroom", play: "play area", kitchen: "kitchen", table: "table", books: "book shelf" },

  // where things live in the house when unpacking (bench sink basket hook toybox bookshelf)
  spots: {
    bench:     { word: "kitchen bench" },
    sink:      { word: "bathroom sink" },
    basket:    { word: "washing basket" },
    hook:      { word: "hook" },
    toybox:    { word: "toy box" },
    bookshelf: { word: "book shelf" }
  },

  // silly things that pop out when the bag is opened (one at random; delete any you don't want)
  surprises: {
    kangaroo: "kangaroo!", koala: "koala!", frog: "frog!", chicken: "chicken!",
    puppy: "puppy!", penguin: "penguin!", butterflies: "butterflies!", elephant: "elephant!"
  },

  // the two daily routines, step by step (ids from `steps` below)
  routines: {
    morning: { word: "Morning", icon: "sun",  steps: ["wakeUp", "getDressed", "play", "game", "breakfast", "teeth", "hair", "pack", "goOut"] },
    night:   { word: "Night",   icon: "moon", steps: ["comeHome", "playNight", "dinner", "bath", "pyjamas", "shows", "books", "teeth", "bed"] }
  },

  // every step: word is shown on screen ({place} = school or childcare), kind = which mini-game runs
  steps: {
    wakeUp:     { word: "wake up",       kind: "wakeUp" },
    getDressed: { word: "get dressed",   kind: "dress", set: "outfits" },
    play:       { word: "play",          kind: "play", choices: ["couch", "barre"] },
    playNight:  { word: "play",          kind: "play", choices: ["trampoline", "blocks", "dolls"] },
    game:       { word: "play a game",   kind: "bubbles", count: 10 },
    breakfast:  { word: "breakfast",     kind: "eat", menu: ["cereal", "toast", "pancakes", "smoothie"] },
    teeth:      { word: "brush teeth",   kind: "teeth" },
    hair:       { word: "do hair",       kind: "hair" },
    pack:       { word: "pack bag",      kind: "pack" },
    goOut:      { word: "go to {place}", kind: "goOut" },
    comeHome:   { word: "come home",     kind: "unpack" },
    dinner:     { word: "dinner",        kind: "eat", menu: ["spaghetti", "tacos", "sausages", "soup"], clear: true },
    bath:       { word: "bath",          kind: "bath" },
    pyjamas:    { word: "pyjamas",       kind: "dress", set: "pyjamas" },
    shows:      { word: "watch a show",  kind: "shows" },
    books:      { word: "read a book",   kind: "books" },
    bed:        { word: "go to bed",     kind: "bed" }
  },

  // clothes to choose from. type: dress | tee | overalls | tutu | pjs | nightie
  // pattern: dots | stars | hearts | check | stripes | rainbow
  outfits: {
    uniformDress: { word: "school dress", type: "dress", color: "#2f6b4f", pattern: "check", patColor: "#a9d3b4", crest: true, uniform: true },
    uniformPolo:  { word: "school polo",  type: "polo",  top: "#2f6b4f", bottom: "#2b2b2e", crest: true, uniform: true },
    pinkDress:   { word: "pink dress",    type: "dress",    color: "#f29bb8", pattern: "dots" },
    blueDress:   { word: "blue dress",    type: "dress",    color: "#7aa9de", pattern: "dots" },
    rainbow:     { word: "rainbow dress", type: "dress",    color: "#fff",    pattern: "rainbow" },
    tee:         { word: "shirt and shorts", type: "tee",   top: "#f4d36b", bottom: "#8cc47e", pattern: "hearts", patColor: "#e5675c" },
    overalls:    { word: "overalls",      type: "overalls", top: "#e5675c", bottom: "#6c8fc2" },
    tutu:        { word: "tutu",          type: "tutu",     top: "#a98bd8", bottom: "#f7b6c9", pattern: "stars" }
  },
  pyjamas: {
    starPjs:        { word: "star pyjamas",    type: "pjs",     top: "#4d6a9c", bottom: "#4d6a9c", pattern: "stars", patColor: "#f4d36b" },
    spottyPjs:      { word: "spotty pyjamas",  type: "pjs",     top: "#8cc47e", bottom: "#8cc47e", pattern: "dots" },
    stripyPjs:      { word: "stripy pyjamas",  type: "pjs",     top: "#f0a65a", bottom: "#f0a65a", pattern: "stripes" },
    unicornNightie: { word: "heart nightie",   type: "nightie", color: "#f7c6d6", pattern: "hearts", patColor: "#e5675c" }
  },
  hairStyles: { pigtails: "pigtails", ponytail: "ponytail", plaits: "plaits", bun: "bun", long: "long hair" },

  plays: { couch: "bounce on the couch", barre: "ballet", dance: "dance party", trampoline: "trampoline", blocks: "build with blocks", dolls: "play with dolls" },

  // food: four bites each
  foods: {
    cereal:    { word: "cereal",    art: "cereal" },
    toast:     { word: "toast",     art: "toast" },
    pancakes:  { word: "pancakes",  art: "pancakes" },
    smoothie:  { word: "smoothie",  art: "smoothie" },
    spaghetti: { word: "spaghetti", art: "spaghetti" },
    tacos:     { word: "tacos",     art: "tacos" },
    sausages:  { word: "sausage sizzle", art: "sizzle" },
    soup:      { word: "soup",      art: "soup" }
  },

  shows: { heelers: "Blue Heelers", pigs: "British Pigs", racoon: "Ranger Racoon" },

  // books: each page is [picture, word]

    zoo:    { word: "Zoo Animals", cover: "elephant",  color: "#f4d36b", pages: [["kangaroo", "kangaroo"], ["koala", "koala"], ["penguin", "penguin"], ["elephant", "elephant"]] },
    pets:   { word: "Pets",        cover: "puppy",     color: "#7aa9de", pages: [["puppy", "puppy"], ["guineaPig", "guinea pig"], ["fishbowl", "fish"], ["chicken", "chicken"]] },
    garden: { word: "Garden",      cover: "butterfly", color: "#8cc47e", pages: [["butterfly", "butterfly"], ["frog", "frog"], ["duck", "duck"], ["cactus", "cactus"]] }
  },

  labels: {
    home: "Who's playing?",
    choose: "Morning or night?",

    playPick: "What will you play?",
    playTap: "Tap to play!",
    bubbles: "Pop the bubbles!",
    eatPick: "What would you like?",
    eatTap: "Tap your food to eat",
    clearTable: "Clear the table",
    tramp: "Tap to jump!",
    blocks: "Build a tower!",
    dolls: "Give everyone a treat",
    barre: "Tap to dance!",
    yum: "Yum!",
    teeth: "Scrub the germs away",
    sparkly: "Sparkly clean!",
    hairPick: "Pick a hair style",
    bath: "Scrub-a-dub!",
    showPick: "Pick a show",
    bookPick: "Pick a book",
    bookTap: "Tap to turn the page",
    theEnd: "The End",
    intoBed: "Hop into bed",
    lightOff: "Turn off the light",
    goodNight: "Good night",
    goDrive: "Tap the car to drive",
    goIn: "Walk to {place}",
    morningDone: "Morning done!",
    nightDone: "Night night!",
    find: "Find your things",
    silly: "Silly! Not for your bag",
    packed: "All packed!",
    drive: "Tap the car to drive home",

    cellBring: "bring in",
    cellOpen: "open bag",
    help: "help",
    play: "Again",
    done: "Done",
    hooray: "Hooray"
  }
};

:root {
  --paper: #f7f0e1;
  --card: #fffbf2;
  --ink: #2b2523;
  --soft: #8a7f76;
  --sun: #f4d36b;
  --glow: rgba(244, 211, 107, .8);
  --shadow: rgba(120, 110, 100, .3);
  --accent: #f29bb8;
  --font: "Andika", "Comic Neue", system-ui, sans-serif;
  --wob: 18px 26px 20px 24px / 24px 18px 26px 20px;
  --wob2: 26px 16px 24px 18px / 18px 24px 16px 26px;
  --line: 4px solid var(--ink);
  --btn: clamp(72px, 10.5vmin, 92px);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--font); font-weight: 700;
  touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.5), transparent 45%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: none; }
svg.art { display: block; width: 100%; height: 100%; overflow: visible; }

#app { position: fixed; inset: 0; z-index: 1; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

/* ---------- bikablo boxes ---------- */
.box-b { border: var(--line); border-radius: var(--wob); background: var(--card); box-shadow: 6px 7px 0 var(--shadow); }

/* ---------- top bar ---------- */
.topbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; align-items: center; gap: 14px; padding: 12px 18px 8px; }
.btn { width: var(--btn); height: var(--btn); border: var(--line); border-radius: var(--wob); background: var(--card);
  box-shadow: 5px 6px 0 var(--shadow); display: grid; place-items: center; transition: transform .12s; }
.btn:active { transform: translate(3px, 3px); box-shadow: 2px 3px 0 var(--shadow); }
.btn svg { width: 62%; height: 62%; }
.btn.help { width: calc(var(--btn) * 1.12); height: calc(var(--btn) * 1.12); background: #fff3c4; grid-template-rows: 1fr auto; padding: 6px 0 5px; }
.btn.help svg { width: 60%; height: 100%; }
.btn.help span { font-size: 16px; line-height: 1; }
.btn.small { width: calc(var(--btn) * .72); height: calc(var(--btn) * .72); opacity: .8; }
.btn.tiny { width: 46px; height: 46px; opacity: .45; border-width: 3px; box-shadow: none; }
.btn.invisible { visibility: hidden; }

.banner { position: relative; display: flex; align-items: center; gap: 12px; min-width: 0; padding: 4px 22px; min-height: 74px;
  border: var(--line); border-radius: 10px 14px 12px 16px; background: #fff; box-shadow: 6px 7px 0 var(--shadow); transform: rotate(-.6deg); }
.banner-icons { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; }
.banner-icons .bi { width: 52px; height: 52px; display: grid; place-items: center; }
.banner-icons .bi.arrow { width: 34px; }
.banner-text { font-size: clamp(22px, 3.2vw, 36px); line-height: 1.08; min-width: 0; }
.banner.silly { background: #fff1a8; animation: wiggle .5s; }

#screen { position: relative; min-height: 0; }
.enter { animation: enter .35s ease-out both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }
@keyframes wiggle { 25% { transform: rotate(-6deg) scale(1.05); } 60% { transform: rotate(5deg) scale(1.05); } }
.wiggle { animation: wiggle .5s ease-in-out; }

/* ribbon name banner (bikablo) */
.ribbon { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 2px 18px; z-index: 0;
  font-size: clamp(26px, 3.4vw, 40px); }
.ribbon .rb { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; padding: 2px 18px;
  background: color-mix(in srgb, var(--accent) 35%, white); border: var(--line); border-radius: 6px; box-shadow: 5px 6px 0 var(--shadow); }
.ribbon::before, .ribbon::after { content: ""; position: absolute; top: 30%; width: 34px; height: 76%; background: color-mix(in srgb, var(--accent) 65%, white);
  border: var(--line); z-index: 0; }
.ribbon::before { left: -6px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 34% 50%); }
.ribbon::after { right: -6px; clip-path: polygon(0 0, 100% 0, 66% 50%, 100% 100%, 0 100%); }
.ribbon .badge { width: 1.05em; height: 1.05em; }

/* ---------- home ---------- */
.home { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3vw; padding: 1vh 3vw 4vh; }
.kid-card { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); justify-items: center; padding: 3vh 2vw 2vh; transition: transform .15s; }
.kid-card:active { transform: scale(.97); }
.kid-card .ribbon { font-size: clamp(40px, 6vmin, 62px); }
.kid-pics { display: flex; align-items: flex-end; justify-content: center; gap: 2vw; width: 100%; min-height: 0; padding-top: 2vh; }
.kid-pics .fig { height: calc(94% * var(--gh, 1)); aspect-ratio: 120/210; }
.kid-pics .mini-bag { height: 52%; aspect-ratio: 300/340; }

/* ---------- mode ---------- */
.modes { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3vw; padding: 1vh 4vw 4vh; }
.mode-card { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; justify-items: center; align-items: center; padding: 3vh 2vw; gap: 1vh; transition: transform .15s; }
.mode-card:active { transform: scale(.97); }
.mode-card .mode-art { height: 100%; max-height: 38vh; aspect-ratio: 1.3; display: flex; align-items: center; justify-content: center; gap: 4%; }
.mode-card .mode-art > span { height: 80%; aspect-ratio: 1; }
.mode-card .mode-art > span.wide { aspect-ratio: 420/250; height: 50%; }
.mode-card .mode-time { font-size: clamp(24px, 3.2vw, 36px); color: var(--soft); }
.mode-card .mode-word { font-size: clamp(42px, 6vw, 68px); }
.today-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; padding: 2px 12px; border: 3px dashed var(--ink); border-radius: 14px; }
.today-chip .ic { width: 40px; height: 40px; }

/* ---------- game layout ---------- */
.game { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding: 4px 18px 16px; }
.strip { display: flex; align-items: center; gap: 8px; padding: 6px 12px; min-width: 0; }
.strip .who { flex: 0 0 auto; margin-right: 6px; }
.strip .who .ribbon { font-size: clamp(20px, 2.3vw, 28px); }
.cells { flex: 1; display: flex; gap: 4px 6px; justify-content: space-evenly; flex-wrap: wrap; min-width: 0; }
.cell { position: relative; display: grid; grid-template-columns: auto auto auto; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border-radius: 14px; text-align: left; }
.cell .ic { width: clamp(42px, 4.2vw, 54px); height: clamp(42px, 4.2vw, 54px); }
.cell .word { font-size: clamp(14px, 1.45vw, 19px); line-height: 1.05; max-width: 92px; }
.cell .tbox { position: relative; width: 28px; height: 28px; border: 3px solid var(--ink); border-radius: 6px 9px 7px 8px; background: #fff; }
.cell .tbox svg { width: 130%; height: 130%; overflow: visible; margin: -15%; }
.cell .day-tag { position: absolute; left: -4px; top: -10px; font-size: 13px; padding: 0 6px; border: 2.5px solid var(--ink); border-radius: 6px; background: var(--sun); }
.tick { fill: none; stroke: #4f9a55; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; transition: stroke-dashoffset .45s ease-out; }
.cell.done .tick { stroke-dashoffset: 0; }
.cell.done .word { color: var(--soft); }
.cell.done .ic { opacity: .55; }
.cell.step .ic { width: clamp(50px, 5vw, 64px); }
.cell.step .word { max-width: 70px; }
.pop { animation: rowpop .5s ease-out; }
@keyframes rowpop { 40% { background: rgba(244,211,107,.55); transform: scale(1.06); } }

.play { position: relative; min-height: 0; min-width: 0; }

/* ---------- backpack ---------- */
.backpack { position: relative; aspect-ratio: 300/340; transform-origin: 50% 95%; transition: transform .25s; }
.backpack .bp-layer { position: absolute; inset: 0; }
.backpack .bp-inner { position: absolute; inset: 0; transform: scale(calc(1 + var(--fill, 0) * .02)); transform-origin: 50% 95%; transition: transform .3s; }
.backpack.closed .bp-back, .backpack.closed .bp-front, .backpack.closed .bp-peek { display: none; }
.backpack.open .bp-closed { display: none; }
.bp-back { transform-origin: 50% 40%; }
.bp-peek { position: absolute; left: 20%; width: 60%; top: 6%; height: 40%; display: flex; justify-content: center; align-items: flex-end; }
.bp-peek .peek { width: 38%; margin: 0 -7%; aspect-ratio: 1; transform: translateY(8%); animation: peekin .35s ease-out both; }
@keyframes peekin { from { transform: translateY(60%) scale(.6); opacity: 0; } }
.backpack.near { transform: scale(1.08); }
.near-glow::after { content: ""; position: absolute; inset: -6%; border-radius: 40%; box-shadow: 0 0 0 8px var(--glow), 0 0 40px 14px var(--glow); pointer-events: none; }
.backpack.bump { animation: bump .45s ease-out; }
@keyframes bump { 30% { transform: scale(1.07, .94); } 65% { transform: scale(.98, 1.04); } }
.backpack.nope { animation: nope .6s ease-in-out; }
@keyframes nope { 20% { transform: rotate(-9deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
.pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); } 50% { transform: scale(1.05); filter: drop-shadow(0 0 14px var(--sun)); } }

/* ---------- people ---------- */
.leg { transform-box: fill-box; transform-origin: 50% 0; }
.walking .leg-l { animation: legswing .34s ease-in-out infinite alternate; }
.walking .leg-r { animation: legswing .34s ease-in-out infinite alternate-reverse; }
@keyframes legswing { from { transform: rotate(16deg); } to { transform: rotate(-16deg); } }
.walking > svg { animation: bob .34s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-3%); } }

/* ---------- pack: the house ---------- */
.pack-main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(190px, 22%, 290px); gap: 10px; min-height: 0; }
.house-wrap { container-type: size; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
.house { position: relative; width: min(100cqw, 100cqh * 5 / 3); aspect-ratio: 5 / 3; }
.house > svg.art { position: absolute; inset: 0; }
.room-label { position: absolute; font-size: clamp(12px, 1.5cqw, 18px); padding: 0 8px; background: #fff; border: 2.5px solid var(--ink); border-radius: 5px; transform: rotate(-2deg); box-shadow: 3px 3px 0 var(--shadow); pointer-events: none; }
.obj { position: absolute; width: 9%; height: 15%; touch-action: none; border-radius: 20%; }
.obj.gone, .obj.lifted { visibility: hidden; }
.obj.sparkle { animation: sparkle .7s ease-in-out 4 alternate; border-radius: 50%; }
@keyframes sparkle { from { box-shadow: 0 0 0 0 var(--glow); background: transparent; } to { box-shadow: 0 0 0 10px var(--glow), 0 0 30px 14px var(--glow); background: rgba(255,246,200,.7); } }
.bag-zone { position: relative; display: flex; align-items: flex-end; justify-content: center; min-height: 0; padding-bottom: 4%; }
.bag-zone .door { position: absolute; right: -4%; bottom: 0; height: 96%; aspect-ratio: 200/400; }
.bag-zone .girl { position: relative; z-index: 1; height: calc(60% * var(--gh, 1)); aspect-ratio: 120/210; margin-right: -14%; }
.bag-zone .backpack { position: relative; z-index: 2; height: 44%; max-width: 80%; }

/* ---------- unpack: driving ---------- */
.outside { position: absolute; inset: 0; overflow: hidden; container-type: size; display: flex; align-items: flex-end; justify-content: center;
  background: linear-gradient(to bottom, #e3eff6, #f4efe2); }
.stage { position: relative; width: min(100cqw, 200cqh); aspect-ratio: 2 / 1; }
.strip-scene, .hills { position: absolute; top: 0; left: -50%; width: 400%; height: 100%; will-change: transform; }
.strip-scene > svg.art, .hills > svg.art { position: absolute; inset: 0; }
.homehouse { position: absolute; left: 77.5%; width: 8%; top: 12%; height: 68%; transition: transform .25s; }
.homehouse > svg.art { position: absolute; inset: 0; }
.homehouse .hdoor { transform-box: fill-box; transform-origin: 0% 50%; transition: transform .45s ease-in-out; }
.homehouse.open .hdoor, .homehouse.near .hdoor { transform: scaleX(.18); }
.homehouse.near { transform: scale(1.04); }
.place-label { position: absolute; transform: translateX(-50%) rotate(-2deg); font-size: clamp(13px, 1.6cqw, 20px); padding: 0 10px; background: #fff; border: 3px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--shadow); white-space: nowrap; }
.car-wrap { position: absolute; left: 4%; bottom: 7.6%; width: 40%; aspect-ratio: 420/250; z-index: 3; }
.car-wrap .car { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.car-wrap .car-bag { position: absolute; z-index: 1; left: 28%; top: 25%; width: 17.5%; touch-action: none; }
.car-wrap .car-bag.lifted, .car-wrap .car-bag.gone { visibility: hidden; }
.car-wrap .car-girl { position: absolute; z-index: 2; aspect-ratio: 120/210; transition: opacity .3s; pointer-events: none; }
.car-wrap.tapme { cursor: pointer; }
.car-wrap.tapme .car { animation: pulse 1.8s ease-in-out infinite; }
.wheel { transform-box: fill-box; transform-origin: center; }
.driving .wheel { animation: spin .32s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.driving .car { animation: carbob .22s ease-in-out infinite alternate; }
@keyframes carbob { to { transform: translateY(-1.2%) rotate(-.4deg); } }
.girl-out { position: absolute; z-index: 4; bottom: 9%; aspect-ratio: 120/210; }
.girl-out.hidden { visibility: hidden; }

/* ---------- unpack: inside the house ---------- */
.unpack-play > .pack-main { height: 100%; }
.game.indoors .cell.step { display: none; }
.zone { position: absolute; border-radius: 18px; transition: background .2s; }
.zone.glow { background: rgba(255,246,200,.35); box-shadow: 0 0 0 6px var(--glow), 0 0 30px 12px var(--glow); animation: glowpulse 1.2s ease-in-out infinite; z-index: 1; }
.zone.near { background: rgba(255,246,200,.6); box-shadow: 0 0 0 8px var(--glow), 0 0 40px 16px var(--glow); z-index: 1; }
.zone.glow-once { animation: glowonce .7s ease-out; }
@keyframes glowonce { 30% { background: rgba(255,246,200,.6); box-shadow: 0 0 0 8px var(--glow); } }
@keyframes glowpulse { 50% { box-shadow: 0 0 0 9px var(--glow), 0 0 44px 18px var(--glow); } }
.zone-label { position: absolute; left: 50%; top: -4px; transform: translate(-50%, -100%) rotate(-2deg); white-space: nowrap; font-size: clamp(13px, 1.5cqw, 18px);
  padding: 0 8px; background: #fff; border: 2.5px solid var(--ink); border-radius: 5px; box-shadow: 3px 3px 0 var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; }
.zone.glow .zone-label, .zone.near .zone-label { opacity: 1; }
.zone-items { position: absolute; display: flex; justify-content: center; align-items: flex-end; pointer-events: none; z-index: 2; }
.zone-items .placed { height: 100%; aspect-ratio: 1; margin: 0 -1.2%; animation: peekin .35s ease-out both; }
.unpack-zone .pile { position: absolute; left: 0; right: 0; top: 0; bottom: 48%; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-end; gap: 2px; z-index: 3; }
.pile-item { width: clamp(76px, 7vw, 104px); aspect-ratio: 1; touch-action: none; border-radius: 20%; }
.pile-item.lifted, .pile-item.gone { visibility: hidden; }
.pile-item.in-bag { opacity: 0; pointer-events: none; }
.unpack-zone .backpack { height: 42%; }
.unpack-zone .mat { position: absolute; left: 6%; right: 6%; bottom: 3%; height: 3.5%; background: #d9845f; border: 3px solid var(--ink); border-radius: 8px; box-shadow: 4px 4px 0 var(--shadow); }

/* bag surprises */
.critter { pointer-events: none; z-index: 5; }
.critter .balloon { position: absolute; left: 66%; bottom: 57%; width: 40%; aspect-ratio: 60/150; animation: sway 1.4s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes sway { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
.zz { font: 700 34px var(--font); color: var(--ink); }
.flap svg { animation: flapping .16s ease-in-out infinite alternate; }
@keyframes flapping { from { transform: rotate(-6deg); } to { transform: rotate(6deg) translateY(-4%); } }
.wag .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wagging .2s ease-in-out infinite alternate; }
@keyframes wagging { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
.flutter svg { animation: flutter .13s ease-in-out infinite alternate; }
@keyframes flutter { to { transform: scaleX(.3); } }
.ears .ear { transform-box: fill-box; transform-origin: 0% 50%; animation: earflap .15s ease-in-out infinite alternate; }
@keyframes earflap { to { transform: scaleX(.7) rotate(-6deg); } }

/* ---------- drag, hints, bubbles, fx ---------- */
#drag-layer, #fx-layer { position: fixed; inset: 0; pointer-events: none; }
#drag-layer { z-index: 50; } #fx-layer { z-index: 60; overflow: hidden; }
.drag-clone { position: fixed !important; margin: 0 !important; pointer-events: none; z-index: 51; will-change: transform; filter: drop-shadow(0 14px 10px rgba(43,37,35,.25)); }
#hand { position: fixed; left: 0; top: 0; width: 86px; height: 86px; opacity: 0; will-change: transform; z-index: 2; }
.ghost { position: fixed; left: 0; top: 0; opacity: 0; will-change: transform; }
.bubble { position: fixed; left: 0; top: 0; z-index: 3; transform: translate(-50%, -100%); padding: 6px 16px; font-size: clamp(20px, 2.6vw, 30px); white-space: nowrap;
  background: #fff; border: var(--line); border-radius: 18px 22px 20px 16px; box-shadow: 5px 6px 0 var(--shadow); animation: bubblein .25s ease-out both; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -16px; width: 22px; height: 18px; background: #fff; border-right: var(--line); border-bottom: var(--line); transform: translateX(-50%) skewX(-30deg) rotate(30deg); }
@keyframes bubblein { from { opacity: 0; transform: translate(-50%, -80%) scale(.7); } }
.fx { position: fixed; left: 0; top: 0; will-change: transform, opacity; }
.fx.bub { border-radius: 50%; border: 3px solid #5d8fc9; background: radial-gradient(circle at 35% 30%, #fff 0 18%, rgba(205,234,255,.65) 20%); }
.fun-hop { animation: hop .5s ease-out 2; }
@keyframes hop { 40% { transform: translateY(-28%) rotate(-6deg); } }
.fun-spin { animation: fspin .7s ease-in-out; }
@keyframes fspin { to { transform: rotate(360deg) scale(1.1); } }
.fun-shake { animation: fshake .6s ease-in-out; }
@keyframes fshake { 20% { transform: rotate(-12deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(6deg); } }
.fun-squash { animation: squash .6s ease-out; }
@keyframes squash { 25% { transform: scale(1.25, .7); } 55% { transform: scale(.85, 1.2) translateY(-12%); } 80% { transform: scale(1.05, .95); } }
.fun-wobble { animation: fwob .8s ease-in-out; }
@keyframes fwob { 25% { transform: translateX(-8%) rotate(-5deg); } 75% { transform: translateX(8%) rotate(5deg); } }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; }
.overlay[hidden] { display: none; }
#celebrate { background: rgba(247,240,225,.97); }
#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cele-card { position: relative; display: grid; justify-items: center; gap: 1.5vh; text-align: center; animation: enter .5s ease-out both; }
.cele-pics { display: flex; align-items: flex-end; gap: 2vw; height: min(36vh, 300px); }
.cele-fig { height: calc(100% * var(--gh, 1)); aspect-ratio: 120/210; animation: jump .7s ease-in-out infinite; }
@keyframes jump { 50% { transform: translateY(-12%); } }
.cele-badge { height: 45%; aspect-ratio: 1; align-self: flex-start; animation: float 2.6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-12px) rotate(6deg); } }
.cele-title { font-size: clamp(52px, 9vmin, 96px); line-height: 1; }
.cele-sub { display: flex; align-items: center; gap: 14px; font-size: clamp(26px, 4.6vmin, 42px); }
.cele-sub .ic { width: 1.6em; height: 1.6em; }
.cele-btns { display: flex; gap: 4vw; margin-top: 1vh; }
.big-btn { min-width: 190px; height: 104px; padding: 0 26px; border: var(--line); border-radius: var(--wob); background: var(--card); box-shadow: 6px 7px 0 var(--shadow);
  display: inline-flex; align-items: center; justify-content: center; gap: 14px; font-size: 32px; }
.big-btn:active { transform: translate(3px, 3px); }
.big-btn svg { width: 58px; height: 58px; }
.big-btn.primary { background: #e9f6df; }

#grownup { background: rgba(43,37,35,.35); font-family: system-ui, sans-serif; font-weight: 400; }
#grownup .panel { width: min(640px, 92vw); max-height: 90vh; overflow: auto; touch-action: pan-y; background: #fffdf8; border: var(--line); border-radius: 22px; padding: 18px 22px; }
#grownup h2 { margin: 0 0 6px; font-size: 24px; }
#grownup h3 { margin: 16px 0 6px; font-size: 18px; }
#grownup p { margin: 4px 0 8px; color: #6b625b; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 14px; border: 2px solid var(--ink); border-radius: 12px; background: #fff; font-size: 17px; min-width: 56px; }
.chip.on { background: var(--sun); }
#grownup button { touch-action: manipulation; }
.panel-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }

/* ---------- portrait ---------- */
@media (orientation: portrait) {
  .home, .modes { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; padding: 1vh 5vw 3vh; }
  .kid-card { padding: 2vh 4vw 1.5vh; }
  .mode-card .mode-art { max-height: 20vh; }
  .pack-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .house-wrap { container-type: inline-size; }
  .house { width: 100%; }
  .obj { width: 10%; height: 16.6%; }
  .bag-zone .girl { height: calc(80% * var(--gh, 1)); }
  .bag-zone .backpack { height: 58%; }
  .bag-zone .door { right: 8%; }
  .unpack-zone .pile { bottom: 52%; }
  .unpack-zone .backpack { height: 48%; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse, .zone.glow, .cele-badge, .cele-fig, .car-wrap.tapme .car { animation: none !important; }
}
/* ---------- morning / night cards ---------- */
.mode-card { grid-template-rows: minmax(0, 1fr) auto auto auto; }
.mode-card .mode-art > span.mi { height: 46%; aspect-ratio: 1; align-self: flex-start; margin-top: 4%; }
.mode-card .mode-art > span.fig-mini { height: calc(100% * var(--gh, 1)); aspect-ratio: 120 / 210; align-self: flex-end; }
.mode-card .mode-art { aspect-ratio: 1.1; }
.mode-steps { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 100%; }
.mode-steps .ms { width: clamp(30px, 3.6vw, 44px); aspect-ratio: 1; }
.mode-card.r-night { background: #e7e9f7; }
.mode-card.r-morning { background: #fff8e0; }

/* ---------- routine layout: step rail + stage ---------- */
.routine { height: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 2px 16px 14px; }
.rail { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px 6px; min-height: 0; }
.rstep { position: relative; flex: 0 0 auto; width: clamp(46px, 6.6vh, 64px); aspect-ratio: 1; padding: 4px; border-radius: 14px; transition: background .2s; }
.rstep .ic { display: block; width: 100%; height: 100%; }
.rstep.now { background: rgba(244,211,107,.65); box-shadow: 0 0 0 3px var(--sun); }
.rstep.done:not(.now) .ic { opacity: .45; }
.rstep .tbox { position: absolute; right: -7px; bottom: -5px; width: 24px; height: 24px; border: 3px solid var(--ink); border-radius: 6px 8px 7px 6px; background: #fff; opacity: 0; transition: opacity .2s; }
.rstep.done .tbox { opacity: 1; }
.rstep .tbox svg { width: 130%; height: 130%; overflow: visible; margin: -15%; }
.rstep.done .tick { stroke-dashoffset: 0; }
.rdash { flex: 1 1 2px; width: 3px; max-height: 16px; min-height: 2px; background: var(--ink); opacity: .3; border-radius: 2px; }
.rstage { position: relative; min-width: 0; min-height: 0; container-type: size; }
.rstage > .game { padding: 0; }
.rstage .strip .who { display: none; }
.r-night .rail { background: #eef0fa; }

/* "next up" card between steps */
.next-card { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(247,240,225,.8); animation: enter .3s ease-out both; }
.nc { display: flex; align-items: center; gap: 18px; padding: 16px 30px; font-size: clamp(30px, 4vw, 50px); transform: rotate(-1.5deg); }
.nc-arrow { width: 44px; height: 74px; }
.nc-ic { width: clamp(90px, 12vw, 140px); aspect-ratio: 1; }

/* ---------- scenes (1600 x 1000) ---------- */
.scene-wrap { position: absolute; inset: 0; container-type: size; display: grid; place-items: center; }
.scene { position: relative; width: min(100cqw, 160cqh); aspect-ratio: 16 / 10; border: var(--line); border-radius: var(--wob); overflow: hidden; box-shadow: 6px 7px 0 var(--shadow); background: #fbf3e3; }
.scene > svg.art { position: absolute; inset: 0; }
.e { position: absolute; }
.e > svg.art { position: absolute; inset: 0; }
.tap { cursor: pointer; touch-action: none; }
.glowy { animation: glowpulse2 1.4s ease-in-out infinite; border-radius: 30%; }
@keyframes glowpulse2 { 50% { box-shadow: 0 0 0 8px var(--glow), 0 0 40px 16px var(--glow); background: rgba(255,246,200,.35); } }
.dark { position: absolute; inset: 0; background: #1c2246; opacity: 0; pointer-events: none; transition: opacity 1.2s; }

/* choices row */
.choices { position: absolute; left: 2%; right: 2%; bottom: 3%; display: flex; justify-content: center; gap: 2%; z-index: 6; }
.choice { flex: 0 1 22%; max-width: 230px; display: grid; justify-items: center; gap: 2px; padding: 8px 6px 6px; background: var(--card); transition: transform .15s; }
.choice .ch-art { width: 72%; aspect-ratio: 1; }
.choice .ch-word { font-size: clamp(14px, 1.7cqw, 22px); line-height: 1.05; text-align: center; }
.choice.picked { background: #fff3c4; transform: translateY(-6px) rotate(-1deg); box-shadow: 6px 7px 0 var(--shadow), 0 0 0 4px var(--sun); }
.choices.side { left: auto; right: 2%; top: 4%; bottom: 4%; flex-direction: column; width: 24%; gap: 3%; }
.choices.side .choice { flex: 1 1 0; max-width: none; min-height: 0; }
.choices.side .choice .ch-art { width: auto; height: 100%; min-height: 0; }
.choices.side .choice { grid-template-rows: minmax(0, 1fr) auto; }

/* big tick to move on */
.done-btn { position: absolute; right: 14px; bottom: 14px; z-index: 15; width: clamp(88px, 11vmin, 116px); aspect-ratio: 1; border: var(--line); border-radius: 50%;
  background: #e9f6df; box-shadow: 6px 7px 0 var(--shadow); display: grid; place-items: center; transform: scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
.done-btn.show { transform: scale(1); }
.done-btn.show::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; animation: ring 1.8s ease-in-out .8s infinite; }
@keyframes ring { 50% { box-shadow: 0 0 0 8px var(--glow), 0 0 30px 12px var(--glow); } }
.done-btn svg { width: 64%; height: 64%; }

/* tools you drag (toothbrush, sponge, hairbrush) */

<script>
/* =====================================================================
   GAME CODE — you shouldn't need to change anything below for routine edits.

   Built so later features slot in:
   - Stickers/streak: every finish is logged in Store.data.history ({date, child, mode, day}).
   - Weather mode:  isActive() is the one place items are switched on/off.
   - Real photos:   itemArt() draws every item — return an <img> there for item.photo.
   - Decorate bag:  backpack deco lives in ART.backpackParts() (rainbow, unicorn…).
   - Hidden settings: openGrown() is the settings panel; attach a long-press.
   ===================================================================== */
(() => {
'use strict';

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const DAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const rand = (a, b) => a + Math.random() * (b - a);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rectC = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2, r]; };

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/* ---------------- storage ---------------- */
const Store = {
  KEY: 'packup.v2',
  data: { settings: {}, progress: {}, history: [], looks: {} },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) { const d = JSON.parse(raw); if (d && typeof d === 'object') this.data = { settings: d.settings || {}, progress: d.progress || {}, history: d.history || [], looks: d.looks || {} }; }
    } catch (e) {}
    const today = todayKey();
    for (const k of Object.keys(this.data.progress)) if (!k.startsWith(today)) delete this.data.progress[k];
    if (this.data.history.length > 600) this.data.history = this.data.history.slice(-600);
    this.save();
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} },
  get settings() { return this.data.settings; }
};

/* ---------------- routine helpers ---------------- */
function currentDay() {
  const o = Store.settings.dayOverride;
  if (o && o.date === todayKey() && o.day >= 0 && o.day <= 6) return o.day;
  return new Date().getDay();
}
function isActive(entry, ctx) {
  if (entry.days && !entry.days.map(d => String(d).toLowerCase().slice(0, 3)).includes(DAYS[ctx.day])) return false;
  return true;
}
function resolveItem(entry) {
  const e = typeof entry === 'string' ? { id: entry } : entry;
  return { ...(CONFIG.items[e.id] || { word: e.id, art: 'bottle' }), ...e, id: e.id };
}
function itemsFor(child, ctx) { return child.items.filter(e => isActive(e, ctx)).map(resolveItem); }
function sillyCount() { const s = Store.settings.silly; return Number.isFinite(s) ? s : CONFIG.sillyCount; }
function progKey(mode) { return `${todayKey()}|${S.child.id}|${mode}|${S.ctx.day}`; }
function getProg(mode, fresh) {
  const k = progKey(mode);
  if (fresh || !Store.data.progress[k]) Store.data.progress[k] = { done: [], step: null };
  return Store.data.progress[k];
}
function shade(hex, amt) {
  const n = parseInt(hex.replace('#', ''), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(c + (amt < 0 ? c * amt : (255 - c) * amt))));
  return '#' + ((1 << 24) | (f(n >> 16) << 16) | (f((n >> 8) & 255) << 8) | f(n & 255)).toString(16).slice(1);
}

/* =====================================================================
   ART — bikablo-style marker drawings with crayon colour (inline SVG)
   ===================================================================== */
const INK = '#2b2523';
let KS = 1;   // line thickness scale (thinner for close-ups)
const K = (w = 5) => `stroke="${INK}" stroke-width="${w * KS}" stroke-linecap="round" stroke-linejoin="round"`;
const SKIN = '#fff3e6';

function starPath(cx, cy, R, r, n = 5) {
  let d = '';
  for (let i = 0; i < n * 2; i++) { const rad = i % 2 ? r : R, a = -Math.PI / 2 + i * Math.PI / n; d += (i ? 'L' : 'M') + (cx + rad * Math.cos(a)).toFixed(1) + ' ' + (cy + rad * Math.sin(a)).toFixed(1) + ' '; }
  return d + 'Z';
}
function smallBag(color, flap, front) {
  return `<path d="M44 42 Q44 22 60 22 Q76 22 76 42" fill="none" ${K(5.5)}/>
    <rect x="14" y="38" width="92" height="70" rx="9" fill="${color}" ${K()}/>
    <path d="M14 47 Q14 38 23 38 H97 Q106 38 106 47 V58 Q60 72 14 58 Z" fill="${flap}" ${K(4)}/>
    <circle cx="60" cy="64" r="4" fill="${INK}"/>${front}`;
}
const tree = (x, y = 400, s = 1) => `<rect x="${x - 9 * s}" y="${y - 84 * s}" width="${18 * s}" height="${84 * s}" fill="#c49a6c" ${K(4)}/>
  <circle cx="${x - 30 * s}" cy="${y - 100 * s}" r="${30 * s}" fill="#86c27a" ${K(4)}/><circle cx="${x + 28 * s}" cy="${y - 104 * s}" r="${32 * s}" fill="#86c27a" ${K(4)}/>
  <circle cx="${x}" cy="${y - 136 * s}" r="${38 * s}" fill="#9bd08a" ${K(4)}/>`;
const nhouse = (x, col, roof) => `<rect x="${x}" y="300" width="170" height="100" fill="${col}" ${K(5)}/>
  <path d="M${x - 14} 304 L${x + 85} 236 L${x + 184} 304 Z" fill="${roof}" ${K(5)}/>
  <rect x="${x + 20}" y="326" width="42" height="34" fill="#dff0fb" ${K(4)}/><path d="M${x + 41} 326 V360" ${K(3)}/>
  <rect x="${x + 104}" y="336" width="36" height="64" fill="#c49a6c" ${K(4)}/>`;
const bush = (x, y = 400) => `<path d="M${x} ${y} q4 -30 28 -24 q12 -24 34 -2 q24 -8 26 26 Z" fill="#86c27a" ${K(4)}/>`;
const cloud = (x, y, s = 1) => `<path d="M${x} ${y} q-4 -26 22 -26 q8 -22 34 -12 q22 -14 34 10 q24 0 20 28 Z" transform="scale(${s})" fill="#fff" ${K(4)}/>`;
const books = (x, y, w) => {
  const cols = ['#e5675c', '#7aa9de', '#f4d36b', '#8cc47e', '#a98bd8', '#f0a65a'];
  let s = '', cx = x, i = 0;
  while (cx < x + w - 12) { const bw = 10 + (i * 7) % 8, bh = 30 + (i * 13) % 14; s += `<rect x="${cx}" y="${y - bh}" width="${bw}" height="${bh}" fill="${cols[i % 6]}" ${K(3)}/>`; cx += bw + 1; i++; }
  return s;
};

/* =====================================================================
   THE GIRLS — outfits, hair styles, poses and faces (drawn in 120 x 210)
   ===================================================================== */
const lerp = (a, b, t) => a + (b - a) * t;
function dbl(d, col, w = 12, iw = 6.5) {
  return `<path d="${d}" fill="none" ${K(w)}/><path d="${d}" fill="none" stroke="${col}" stroke-width="${iw * KS}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function heart(x, y, s, col) {
  return `<path d="M${x} ${y + s * .9} C${x - s * 1.6} ${y - s * .2} ${x - s * .6} ${y - s * 1.3} ${x} ${y - s * .3} C${x + s * .6} ${y - s * 1.3} ${x + s * 1.6} ${y - s * .2} ${x} ${y + s * .9} Z" fill="${col}"/>`;
}
/* decorate a trapezoid: top edge (xl0..xr0 at y0), bottom edge (xl1..xr1 at y1) */
function pattern(kind, [xl0, xr0, y0], [xl1, xr1, y1], col) {
  const at = (y, f) => { const t = (y - y0) / (y1 - y0); return lerp(lerp(xl0, xl1, t), lerp(xr0, xr1, t), f); };
  let s = '';
  if (kind === 'dots' || kind === 'stars' || kind === 'hearts') {
    const rows = Math.max(2, Math.round((y1 - y0) / 13));
    for (let r = 0; r < rows; r++) {
      const y = lerp(y0 + 6, y1 - 6, r / (rows - 1)), n = r % 2 ? 3 : 4;
      for (let i = 0; i < n; i++) {
        const x = at(y, (i + .5) / n);
        if (kind === 'dots') s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${col}"/>`;
        else if (kind === 'stars') s += `<path d="${starPath(x, y, 3.8, 1.6)}" fill="${col}"/>`;
        else s += heart(x, y, 2.4, col);
      }
    }
  } else if (kind === 'check') {
    for (let y = y0 + 7; y < y1 - 2; y += 9) s += `<path d="M${(at(y, 0) + 1).toFixed(1)} ${y} H${(at(y, 1) - 1).toFixed(1)}" stroke="${col}" stroke-width="2.2"/>`;
    [.2, .4, .6, .8].forEach(f => s += `<path d="M${at(y0 + 1, f).toFixed(1)} ${y0 + 1} L${at(y1 - 1, f).toFixed(1)} ${y1 - 1}" stroke="${col}" stroke-width="2.2"/>`);
  } else if (kind === 'stripes') {
    for (let y = y0 + 6; y < y1 - 2; y += 9) s += `<path d="M${(at(y, 0) + 1).toFixed(1)} ${y} H${(at(y, 1) - 1).toFixed(1)}" stroke="${col}" stroke-width="4"/>`;
  } else if (kind === 'rainbow') {
    const cols = ['#e5675c', '#f0a65a', '#f4d36b', '#8cc47e', '#7aa9de', '#a98bd8'], n = cols.length;
    cols.forEach((c, i) => {
      const ya = lerp(y0, y1, i / n), yb = lerp(y0, y1, (i + 1) / n);
      s += `<path d="M${at(ya, 0)} ${ya} L${at(ya, 1)} ${ya} L${at(yb, 1)} ${yb} L${at(yb, 0)} ${yb} Z" fill="${c}"/>`;
    });
  }
  return s;
}
function garb(d, fill, kind, a, b, pcol) {
  return `<path d="${d}" fill="${fill}"/>${kind ? pattern(kind, a, b, pcol) : ''}<path d="${d}" fill="none" ${K()}/>`;
}
const sleeves = col => `<path d="M48 97 L37 102 L41 113 L49 108 Z" fill="${col}" ${K(4)}/><path d="M72 97 L83 102 L79 113 L71 108 Z" fill="${col}" ${K(4)}/>`;
const TORSO = 'M47 96 L73 96 L76 131 L44 131 Z';
const SHORTS = 'M44 127 L76 127 L79 148 L63 148 L60 137 L57 148 L41 148 Z';
const PANTS = 'M43 129 L77 129 L77 184 L63 184 L60 146 L57 184 L43 184 Z';
const crest = (x, y) => `<path d="M${x - 5} ${y - 6} H${x + 5} V${y + 1} Q${x + 5} ${y + 6} ${x} ${y + 8} Q${x - 5} ${y + 6} ${x - 5} ${y + 1} Z" fill="#f4d36b" ${K(2)}/>`;

/* each outfit returns its drawing, where the legs start (hem) and whether sleeves are long */
function outfitParts(f) {
  const t = f.type || 'dress', c = f.color || '#f29bb8', top = f.top || c, bot = f.bottom || c;
  const pc = f.patColor || (f.pattern === 'check' ? shade(c, -.3) : '#fff');
  switch (t) {
    case 'bare': return { hem: 131, body: garb(TORSO, SKIN) };
    case 'polo': return { hem: 184, long: true, sleeve: top, feet: f.shoes || '#2b2523', body: garb(PANTS, bot) + garb('M47 96 L73 96 L77 134 L43 134 Z', top) +
      `<path d="M50 95 L60 103 L70 95 L67 91 L60 98 L53 91 Z" fill="#fff" ${K(3)}/><path d="M60 103 V114" ${K(2.5)}/><circle cx="60" cy="108" r="1.6" fill="#fff"/><circle cx="60" cy="113" r="1.6" fill="#fff"/>` + (f.crest ? crest(68, 112) : '') };
    case 'tee': return { hem: 146, body: sleeves(top) + garb(SHORTS, bot) + garb(TORSO, top, f.pattern, [47, 73, 96], [44, 76, 131], pc) };
    case 'overalls': return { hem: 146, body: sleeves(top) + garb(TORSO, top, 'stripes', [47, 73, 96], [44, 76, 131], shade(top, .45)) + garb(SHORTS, bot) +
      `<path d="M50 107 H70 V129 H50 Z" fill="${bot}" ${K(4)}/><path d="M50 108 L47 97 M70 108 L73 97" ${K(4)}/><path d="M55 116 H65" ${K(3)}/>
       <circle cx="53" cy="111" r="2.2" fill="#f4d36b" ${K(1.5)}/><circle cx="67" cy="111" r="2.2" fill="#f4d36b" ${K(1.5)}/>` };
    case 'tutu': return { hem: 138, body: garb('M42 124 Q60 119 78 124 L92 139 Q86 146 80 140 Q74 148 67 141 Q60 149 53 141 Q46 148 40 140 Q34 146 28 139 Z', bot) +
      `<path d="M40 130 Q60 125 80 130 M36 136 Q60 131 84 136" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>` +
      garb('M48 96 L72 96 L74 127 L46 127 Z', top, f.pattern, [48, 72, 96], [46, 74, 127], pc) };
    case 'pjs': return { hem: 184, long: true, sleeve: top, feet: f.slipper || '#f7b6c9', body:
      garb('M43 129 L77 129 L77 184 L63 184 L60 146 L57 184 L43 184 Z', bot, f.pattern, [43, 77, 129], [43, 77, 184], pc) +
      garb('M47 96 L73 96 L78 134 L42 134 Z', top, f.pattern, [47, 73, 96], [42, 78, 134], pc) };
    case 'nightie': return { hem: 180, long: true, sleeve: c, feet: f.slipper || '#fff3e6', body:
      garb('M47 96 L73 96 L88 181 L32 181 Z', c, f.pattern, [47, 73, 96], [32, 88, 181], pc) + `<path d="M36 172 Q60 178 84 172" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>` };
    default: return { hem: 154, body: sleeves(c) + garb('M47 96 L73 96 L88 158 L32 158 Z', c, f.pattern, [47, 73, 96], [32, 88, 158], pc) +
      `<path d="M36 148 Q60 154 84 148" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M50 96 L60 106 L70 96" fill="#fff" ${K(3.5)}/>` + (f.crest ? crest(68, 116) : '') };
  }
}

/* hair: back layer (behind body), side layer (in front of shoulders), top layer (over the head) */
const HAIR = {
  back: {
    long: (h, hd) => `<path d="M33 64 Q30 34 60 34 Q90 34 87 64 L92 118 Q76 126 60 122 Q44 126 28 118 Z" fill="${h}" ${K(4.5)}/>
      <path d="M40 84 L37 112 M80 84 L83 112 M50 96 L48 118" stroke="${hd}" stroke-width="3.5" stroke-linecap="round"/>`,
    ponytail: (h, hd) => `<path d="M76 40 Q104 36 106 68 Q107 94 94 108 Q97 86 90 72 Q84 60 74 54 Z" fill="${h}" ${K(4.5)}/>
      <path d="M93 54 Q101 72 98 94" stroke="${hd}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    messy: h => {
      let d = '';
      for (let k = 0, a = 150; a <= 390; a += 15, k++) { const r = k % 2 ? 31 : 39, x = 60 + r * Math.cos(a * Math.PI / 180), y = 62 + r * Math.sin(a * Math.PI / 180); d += (k ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' '; }

function art(name, opts = {}, cls = '') {
  const a = ART[name];
  if (!a) return '';
  const prev = KS; KS = a.ks || 1;
  let body; try { body = a.draw(opts); } finally { KS = prev; }
  return `<svg class="art ${cls}" viewBox="${a.vb}" aria-hidden="true" focusable="false"><g filter="url(#${a.filter || 'mk'})">${body}</g></svg>`;
}
/* every item drawing goes through here (LATER: real photos — return <img src=item.photo>) */
function itemArt(item) { return art(item.art, item); }
function backpackHTML(bp, state, extra = '') {
  const p = ART.backpackParts(bp);
  const L = (cls, inner) => `<svg class="art bp-layer ${cls}" viewBox="0 0 300 340" aria-hidden="true"><g filter="url(#mk)">${inner}</g></svg>`;
  return `<div class="backpack ${state} ${extra}"><div class="bp-inner">${L('bp-closed', p.closed)}${L('bp-back', p.back)}<div class="bp-peek"></div>${L('bp-front', p.front)}</div></div>`;
}
function schoolDay(c) { return !!(c.uniforms && c.uniforms.length && (c.schoolDays || []).includes(DAYS[currentDay()])); }
function lookOf(c) {
  const l = Store.data.looks[c.id] || {};
  const outfit = schoolDay(c) ? (c.uniforms.includes(l.uniform) ? l.uniform : c.uniforms[0]) : (l.outfit && !(CONFIG.outfits[l.outfit] || {}).uniform ? l.outfit : c.outfit);
  const sd = schoolDay(c), okShoe = sd ? ['school', 'sneakers'] : null;
  const shoes = l.shoes && (!okShoe || okShoe.includes(l.shoes)) ? l.shoes : (sd ? 'school' : 'sneakers');
  return { outfit, pyjamas: l.pyjamas || c.pyjamas, hair: l.hair || c.look.style, shoes, socks: l.socks || '#fff', acc: l.acc || null };
}
function setLook(c, k, v) { (Store.data.looks[c.id] ||= {})[k] = v; Store.save(); }
function outfitDef(id) { return CONFIG.outfits[id] || CONFIG.pyjamas[id] || Object.values(CONFIG.outfits)[0]; }
/* what she's wearing right now: pyjamas before getting dressed / after pyjama time, messy hair until it's done */
function wearNow(c) {
  const l = lookOf(c); let outfit = l.outfit, hair = l.hair;
  const r = S.routine && CONFIG.routines[S.routine];
  if (r && S.child === c) {
    const i = S.stepIndex || 0, find = f => r.steps.findIndex(id => { const st = CONFIG.steps[id] || {}; return f(st); });
    const dI = find(st => st.kind === 'dress' && st.set === 'outfits'), pI = find(st => st.kind === 'dress' && st.set === 'pyjamas'), hI = find(st => st.kind === 'hair');
    if (dI >= 0 && i <= dI) outfit = l.pyjamas;
    if (pI >= 0 && i > pI) outfit = l.pyjamas;
    if (hI >= 0 && i <= hI) hair = 'messy';
  }
  let def = outfitDef(outfit);
  const raw = Store.data.looks[c.id] || {};
  if (raw.slipper && (def.type === 'pjs' || def.type === 'nightie')) def = { ...def, slipper: raw.slipper };
  return { outfit: def, hair, shoes: l.shoes, socks: l.socks, acc: hair === 'messy' ? null : l.acc };
}
const figure = (child, o = {}) => art('figure', { look: child.look, ...wearNow(child), ...o });
const badge = child => art(child.badge === 'star' ? 'star' : 'moon', {}, 'badge');
const ribbon = child => `<span class="ribbon" style="--accent:${child.accent}"><span class="rb">${child.name}${badge(child)}</span></span>`;

/* =====================================================================
   SOUND — soft effects made with Web Audio (no audio files, no voice)
   ===================================================================== */
const Sfx = {
  ctx: null, out: null, nb: null,
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC();
        const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4500;
        const comp = this.ctx.createDynamicsCompressor();
        this.out = this.ctx.createGain(); this.out.gain.value = .55;
        this.out.connect(lp); lp.connect(comp); comp.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  tone(f, t0, dur, o = {}) {
    const c = this.ctx, t = c.currentTime + t0, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur * .8);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(o.vol ?? .2, t + (o.attack ?? .012)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(g); g.connect(this.out); osc.start(t); osc.stop(t + dur + .05);
    return osc;
  },

/* =====================================================================
   DRAG — pointer events, forgiving snap, one finger at a time
   ===================================================================== */
const Drag = {
  active: null, layer: null,
  attach(el, opts) { el.addEventListener('pointerdown', e => this.down(e, el, opts)); },
  down(e, el, opts) {
    if (this.active || (e.button && e.button !== 0) || el.classList.contains('gone') || el.classList.contains('in-bag') || el.classList.contains('locked')) return;

    this.active = st;

  move(e, st) {

    const [cx, cy] = this.centre(st, e);

  },
  begin(st) {

    const c = st.clone = st.el.cloneNode(true);
    c.classList.remove('wiggle', 'pulse', 'sparkle', 'fun-hop', 'fun-spin', 'fun-shake', 'fun-squash', 'fun-wobble');
    c.classList.add('drag-clone');
    Object.assign(c.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', transform: '' });
    this.layer.appendChild(c);
    st.el.classList.add('lifted');
    Sfx.play('pick');

  },
  find(st, cx, cy, hover) {
    const hit = (t, m) => { const r = t.el.getBoundingClientRect(); return cx > r.left - m && cx < r.right + m && cy > r.top - m && cy < r.bottom + m ? Math.hypot(cx - (r.left + r.width / 2), cy - (r.top + r.height / 2)) : Infinity; };

    if (best || hover) return best;

          { offset: .65, transform: `translate(${tx * .5}px, ${ty * .5 - 170}px) scale(1.05) rotate(220deg)` },
          { transform: 'translate(0px, 0px) scale(1) rotate(360deg)' }], { duration: 950, easing: 'ease-in-out', fill: 'forwards' });

/* =====================================================================

const Hint = {

  stop() { this.anims.forEach(a => { try { a.cancel(); } catch (e) {} }); this.anims = []; this.ghost?.remove(); this.ghost = null; this.hand().style.opacity = 0; },
  // fingertip sits at about (22%, 6%) of the hand picture

  drag(a, b) {

      { offset: .72, transform: `translate(${x2 - gw}px, ${y2 - gh}px) scale(.8)`, opacity: .6 }, { offset: .84, opacity: 0, transform: `translate(${x2 - gw}px, ${y2 - gh}px) scale(.5)` },
      { opacity: 0, transform: `translate(${x2 - gw}px, ${y2 - gh}px) scale(.5)` }], opts));

      { transform: this.at(x + 40, y + 60), opacity: 0 }, { offset: .2, transform: this.at(x, y), opacity: 1 },
      { offset: .32, transform: this.at(x, y, 'scale(.82)') }, { offset: .44, transform: this.at(x, y) },
      { offset: .56, transform: this.at(x, y, 'scale(.82)') }, { offset: .7, transform: this.at(x, y), opacity: 1 },
      { transform: this.at(x + 40, y + 60), opacity: 0 }], { duration: 1700, iterations: 2, easing: 'ease-in-out' });

/* =====================================================================
   BAG SURPRISES — something silly pops out when the bag is opened.
   Each one: pops out of the bag, does its thing, then leaves.

   ===================================================================== */
function critter(name, size, opts = {}) {

  d.className = 'fx critter';
  Object.assign(d.style, { width: size + 'px', height: size + 'px', transformOrigin: '50% 100%', opacity: 0 });
  d.innerHTML = art(name, opts);
  $('#fx-layer').appendChild(d);
  return d;
}
/* move a critter through points {t ms, x, y (bottom-centre), s|sx|sy scale, r rotate, o opacity, f facing 1=left -1=right} */
function path(el, size, pts) {
  const total = pts[pts.length - 1].t || 1;
  const kf = pts.map(p => ({
    offset: Math.min(1, p.t / total), opacity: p.o ?? 1,
    transform: `translate(${p.x - size / 2}px, ${p.y - size}px) rotate(${p.r || 0}deg) scale(${(p.sx ?? p.s ?? 1) * (p.f ?? 1)}, ${p.sy ?? p.s ?? 1})`
  }));
  for (let i = 1; i < kf.length; i++) if (kf[i].offset < kf[i - 1].offset) kf[i].offset = kf[i - 1].offset;
  return finished(el.animate(kf, { duration: total, fill: 'forwards' }));
}
const popPts = (c, f = 1) => [{ t: 0, x: c.bx, y: c.by + 40, s: .25, o: 0, f }, { t: 260, x: c.bx, y: c.by - 50, s: 1.08, f }, { t: 460, x: c.bx, y: c.by, s: 1, f }];

  }

}

  for (let k = 1; k <= n; k++) pts.push({ t: t0 + dur * k / n, x: a.x + (b.x - a.x) * k / n, y: b.y - (k % 2 ? bob : 0), f, r: k % 2 ? -5 : 4 });

}

    [{ opacity: 0, t: 'scale(.5)' }, { opacity: 1, dx: 14 + i * 6, dy: -40 }, { opacity: 0, dx: 30 + i * 10, dy: -110, t: 'scale(1.4) rotate(12deg)' }], 1300);

const named = (el, word) => setTimeout(() => el.isConnected && bubble(el, word), 520);
const offLeft = (c, s) => c.hr.left - s * 1.4;

const SURPRISE = {

  async kangaroo(c) {
    const s = c.size, el = critter('kangaroo', s); named(el, c.word); Sfx.play('pop');
    const pts = [...popPts(c), hold(900, { x: c.bx, y: c.by })];

/* the zip pull runs along the zip and the gap opens / closes behind it */
function zipAnim(bag, opening, dur = 750) {
  return new Promise(res => {
    const svg = $('.bp-closed', bag), gap = $('.zip-gap', svg), pull = $('.zip-pull', svg);
    const P = [[62, 134], [150, 74], [238, 134]];
    const at = t => { const u = 1 - t; return [u * u * P[0][0] + 2 * u * t * P[1][0] + t * t * P[2][0], u * u * P[0][1] + 2 * u * t * P[1][1] + t * t * P[2][1]]; };
    const t0 = performance.now();
    Sfx.play('zip', 0, dur / 1000);
    const step = now => {
      let p = Math.min(1, (now - t0) / dur); const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const [x, y] = at(opening ? 1 - e : e);
      pull.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
      gap.setAttribute('stroke-dashoffset', (opening ? -100 + 100 * e : -100 * e).toFixed(2));
      if (p < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}
function setZip(bag, open) {
  const svg = $('.bp-closed', bag);
  $('.zip-gap', svg).setAttribute('stroke-dashoffset', open ? 0 : -100);
  $('.zip-pull', svg).setAttribute('transform', open ? 'translate(62 134)' : 'translate(238 134)');
}

/* hide-and-seek: put the real things and the silly things into hiding spots */
function makeLayout(items, decoyIds) {
  const slots = [];
  for (const [room, list] of Object.entries(HOUSE.slots)) list.forEach((p, i) => slots.push({ key: `${room}:${i}`, room }));
  shuffle(slots);
  const used = new Set(), count = {}, layout = {};
  const place = (id, prefs, chance) => {
    let cand = slots.filter(s => !used.has(s.key) && (prefs || []).includes(s.room));
    if (!cand.length || Math.random() > chance) cand = slots.filter(s => !used.has(s.key));
    if (!cand.length) return;
    cand.sort((a, b) => (count[a.room] || 0) - (count[b.room] || 0));
    const s = cand[0]; used.add(s.key); count[s.room] = (count[s.room] || 0) + 1; layout[id] = s.key;
  };
  items.forEach(i => place(i.id, i.hide, .85));
  decoyIds.forEach(id => place(id, CONFIG.decoys[id]?.hide, .55));
  return layout;
}
function slotStyle(key) {
  const [room, i] = key.split(':'), [x, y] = HOUSE.slots[room][+i], s = HOUSE.size;
  return `left:${(x - s / 2) / 10}%;top:${(y - s) / 6}%`;
}

          await wait(600); if (!alive()) return;

      function startBringIn() {

        carBag.classList.add('pulse');
        S.help = () => Hint.drag(carBag, home);

          onMiss: () => Sfx.play('nudge')
        });
        home.addEventListener('click', () => { wiggle(home); S.help(); });

      async function carryIn() {
        S.help = () => {};
        carBag.classList.add('gone'); carBag.classList.remove('pulse', 'lifted');
        girlOut.innerHTML = figure(c, { carry: c.backpack }); Sfx.play('pop');
        await wait(350); if (!alive()) return;
        const [gx, , gr] = rectC(girlOut), hr = home.getBoundingClientRect();
        const doorX = hr.left + hr.width * (214 / 320);

        if (!alive()) return;
        await finished(girlOut.animate([{ transform: `translateX(${walk}px)`, opacity: 1 }, { transform: `translateX(${walk}px) translateY(-2%) scale(.88)`, opacity: 0 }], { duration: 450, fill: 'forwards' }));

    /* 4b. inside the house: open the bag (surprise!), then put each thing where it lives */
    function inside() {

      $('.game', screen).classList.add('indoors');
      play.innerHTML = `<div class="pack-main enter">
        <div class="house-wrap"><div class="house">${art('house')}${roomLabels()}
          ${spotIds.map(id => { const g = HOUSE.spots[id], [x, y, w, hh] = g.rect; return `
            <div class="zone" data-spot="${id}" style="left:${x / 10}%;top:${y / 6}%;width:${w / 10}%;height:${hh / 6}%"><span class="zone-label">${CONFIG.spots[id]?.word || id}</span></div>
            <div class="zone-items" data-spot="${id}" style="left:${x / 10}%;width:${w / 10}%;top:${(g.sy - 64) / 6}%;height:${64 / 6}%"></div>`; }).join('')}
        </div></div>
        <div class="bag-zone unpack-zone">

        </div></div>`;
      const bag = $('.unpack-zone .backpack', play);
      const zone = id => $(`.zone[data-spot="${spotOf(id)}"]`, play);
      const placeIn = item => { const d = document.createElement('div'); d.className = 'placed'; d.innerHTML = itemArt(item); $(`.zone-items[data-spot="${spotOf(item.spot)}"]`, play).appendChild(d); };
      items.filter(i => isDone(i.id)).forEach(placeIn);
      $$('.zone', play).forEach(z => z.addEventListener('click', () => { flash(z, 'glow-once'); Sfx.play('pop'); bubble(z, CONFIG.spots[z.dataset.spot]?.word || ''); }));

      if (!open) {
        setBanner([art('tapHand'), art('backpackClosed', c.backpack)], L.openBag);
        S.help = () => Hint.tap(bag);
        later(() => S.help(), 800);
        bag.addEventListener('click', async function opener() {
          bag.removeEventListener('click', opener);
          Hint.stop(); S.help = () => {};

          await zipAnim(bag, true, 750); if (!alive()) return;
          bag.classList.replace('closed', 'open');
          $('.bp-back', bag).animate([{ transform: 'scaleY(.2)' }, { transform: 'scaleY(1.1)' }, { transform: 'scaleY(1)' }], { duration: 450, easing: 'ease-out' });
          flash(bag, 'bump'); tickCell('_open'); nextStep();
          await surprise(bag); if (!alive()) return;
          // then her things fly out of the bag
          const [ox, , br] = rectC(bag), oy = br.top + br.height * .3;
          const pile = $$('.pile-item.in-bag', play);

      function startPutAway() {
        if (!alive()) return;
        setBanner([art('backpackClosed', c.backpack), 'ARROW', art('houseIcon')], L.putAway);
        S.help = () => {
          const n = remaining()[0]; if (!n) return;
          const el = $(`.pile-item[data-id="${n.id}"]`, play), z = zone(n.spot);

      $$('.pile-item', play).forEach(el => {
        const item = items.find(i => i.id === el.dataset.id);
        Drag.attach(el, {
          targets: () => $$('.zone', play).map(z => ({ el: z, accept: z.dataset.spot === spotOf(item.spot), margin: 50, shrink: .6,

        Sfx.play('drop'); Sfx.play('tick', .12);
        if (remaining().length) return;
        nextStep();
        setBanner([art('tick')], L.unpacked);
        await wait(700); if (!alive()) return;
        bag.classList.replace('open', 'closed'); setZip(bag, true);
        await zipAnim(bag, false, 700); if (!alive()) return;
        await wait(500); if (!alive()) return;

      /* something silly pops out of the bag */
      async function surprise(bag) {
        const list = Object.keys(CONFIG.surprises || {}).filter(k => SURPRISE[k]);
        if (!list.length) return;
        let pickName = list[Math.floor(Math.random() * list.length)];
        for (let i = 0; i < 10 && list.length > 1 && pickName === Store.settings.lastSurprise; i++) pickName = list[Math.floor(Math.random() * list.length)];
        Store.settings.lastSurprise = pickName; Store.save();

        const ctx = { bag, bx: br.left + br.width / 2, by: br.top + br.height * .3, hr, size: Math.max(120, Math.min(240, hr.height * .36)),
          floorDown: hr.top + hr.height * 592 / 600, floorUp: hr.top + hr.height * 320 / 600, word: CONFIG.surprises[pickName] };
        await SURPRISE[pickName](ctx);
      }
    }

    if (prog.step === 'driveHome' || prog.step === 'bringIn') outside();
    else inside();
  }
};

function closeCele() { $('#celebrate').hidden = true; Confetti.stop(); }

const Confetti = {
  raf: 0, parts: [],
  start(night) {
    const cv = $('#confetti'), dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ['#e5675c', '#f0a65a', '#f4d36b', '#8cc47e', '#7aa9de', '#a98bd8', '#ef9ab8'];
    this.parts = Array.from({ length: reduceMotion ? 18 : 70 }, (_, i) => ({
      x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .9, vy: night ? .5 + Math.random() * .7 : 1.2 + Math.random() * 1.6,
      sway: Math.random() * 6.3, sw: .6 + Math.random(), r: 7 + Math.random() * 9, rot: Math.random() * 6, vr: (Math.random() - .5) * .06, c: night ? ['#f4d36b', '#fff6c8', '#cfe3ff'][i % 3] : cols[i % 7], k: night ? 0 : i % 3 }));
    const t0 = performance.now();
    const step = t => {
      const age = (t - t0) / 1000;
      g.clearRect(0, 0, innerWidth, innerHeight); g.lineWidth = 2.5; g.strokeStyle = 'rgba(43,37,35,.7)';
      for (const p of this.parts) {
        p.y += p.vy; p.sway += .02; p.x += Math.sin(p.sway) * p.sw; p.rot += p.vr;
        if (p.y > innerHeight + 30 && age < 4) { p.y = -20; p.x = Math.random() * innerWidth; }
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.c; g.beginPath();
        if (p.k === 0) { for (let i = 0; i < 10; i++) { const rr = i % 2 ? p.r * .45 : p.r, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(rr * Math.cos(a), rr * Math.sin(a)); } g.closePath(); }
        else if (p.k === 1) g.arc(0, 0, p.r * .6, 0, Math.PI * 2);
        else g.ellipse(0, 0, p.r * .9, p.r * .4, 0, 0, Math.PI * 2);
        g.fill(); g.stroke(); g.restore();
      }
      if (age < 9) this.raf = requestAnimationFrame(step); else g.clearRect(0, 0, innerWidth, innerHeight);
    };
    cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(step);
  },
  stop() { cancelAnimationFrame(this.raf); const cv = $('#confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
};

const STEPS = {
  pack:   (root, def, done) => SCREENS.pack(root, def, done),
  unpack: (root, def, done) => SCREENS.unpack(root, def, done)
};
const STEP_ICON = { wakeUp: 'alarm', dress: 'hanger', play: 'playIcon', bubbles: 'bubbleWand', teeth: 'toothbrush', hair: 'hairbrush',
  goOut: 'school', unpack: 'houseIcon', bath: 'bathIcon', shows: 'tv', books: 'bookIcon', bed: 'bedIcon' };
function stepDef(id) { return CONFIG.steps[id] || { word: id, kind: id }; }
function stepWord(id) { return String(stepDef(id).word || id).replace('{place}', S.child?.fromWord || 'school'); }
function stepIcon(id, child = S.child) {
  const d = stepDef(id);
  if (d.icon) return art(d.icon);
  if (d.kind === 'pack') return art('backpackClosed', child.backpack);
  if (d.kind === 'dress' && d.set === 'pyjamas') return art('pjIcon');
  if (d.kind === 'eat') return art((CONFIG.foods[d.menu?.[0]] || {}).art || 'cereal');
  return art(STEP_ICON[d.kind] || 'star');
}
const place = s => String(s).replace('{place}', S.child?.fromWord || 'school');
function rKey() { return `${todayKey()}|${S.child.id}|routine:${S.routine}`; }
function rProg(fresh) { const k = rKey(); if (fresh || !Store.data.progress[k]) Store.data.progress[k] = { done: [] }; return Store.data.progress[k]; }
function clearFx() { $$('#fx-layer .fx, #fx-layer .bubble').forEach(e => e.remove()); }

/* ---------- shared bits for the steps ---------- */
const P16 = (x, y, w, h) => `left:${x / 16}%;top:${y / 10}%;width:${w / 16}%;height:${h / 10}%`;   // place in a 1600 x 1000 scene
function sceneBox(root, bg, cls = '') {

function el(parent, cls, style, html = '') {

/* scrub helper: drag a tool over spots until they're gone (teeth, bath) */
function scrubber(tool, spots, opts) {
  let last = null, active = false, dx = 0, dy = 0;
  const left = () => spots.filter(s => !s.gone);
  tool.addEventListener('pointerdown', e => {
    e.preventDefault(); Hint.stop(); active = true; last = [e.clientX, e.clientY];
    const r = tool.getBoundingClientRect(); dx = e.clientX - r.left; dy = e.clientY - r.top;
    tool.classList.add('held'); opts.onStart?.();
    const move = ev => {
      if (!active || !tool.offsetParent) return; ev.preventDefault();
      const host = tool.offsetParent.getBoundingClientRect();
      tool.style.left = ((ev.clientX - dx - host.left) / host.width * 100) + '%';
      tool.style.top = ((ev.clientY - dy - host.top) / host.height * 100) + '%';
      const dist = Math.hypot(ev.clientX - last[0], ev.clientY - last[1]); last = [ev.clientX, ev.clientY];
      const tr = tool.getBoundingClientRect(), hx = tr.left + tr.width * (opts.headX ?? .2), hy = tr.top + tr.height * (opts.headY ?? .2);
      for (const sp of left()) {
        const r = sp.el.getBoundingClientRect(), pad = r.width * .35;
        if (hx > r.left - pad && hx < r.right + pad && hy > r.top - pad && hy < r.bottom + pad) {
          sp.work = (sp.work || 0) + dist;
          sp.el.style.opacity = Math.max(.15, 1 - sp.work / (opts.need || 300));
          if (Math.random() < .25) opts.onScrub?.(hx, hy);
          if (sp.work > (opts.need || 300)) { sp.gone = true; opts.onClean(sp); if (!left().length) { opts.onAll(); } }
        }
      }
    };
    const up = () => { active = false; tool.classList.remove('held'); removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
    addEventListener('pointermove', move, { passive: false }); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
}
function foam(x, y, n = 2, col) {
  for (let i = 0; i < n; i++) {
    const s = rand(14, 30);
    fxSpawn('', 'bub', x + rand(-25, 25), y + rand(-15, 15), s, s, [{ opacity: 0, t: 'scale(.3)' }, { opacity: .95, dy: -10, t: 'scale(1)' }, { opacity: 0, dx: rand(-30, 30), dy: -60, t: 'scale(1.3)' }], 900);
  }
}
function sparkleAt(x, y, n = 6) {
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, d = rand(40, 90);
    fxSpawn(art('sparkleStar'), '', x, y, 30, 30, [{ opacity: 0, t: 'scale(.2)' }, { opacity: 1, dx: Math.cos(a) * d * .6, dy: Math.sin(a) * d * .6, t: 'scale(1) rotate(40deg)' }, { opacity: 0, dx: Math.cos(a) * d, dy: Math.sin(a) * d, t: 'scale(.4) rotate(90deg)' }], 900);
  }
}

/* ---------- morning or night ---------- */

/* ---------- a routine ---------- */
SCREENS.routine = function () {
  const r = CONFIG.routines[S.routine];
  let prog = rProg();
  if (r.steps.every(id => prog.done.includes(id))) prog = rProg(true);
  Store.save();
  screen.innerHTML = `<div class="routine r-${S.routine}">
    <nav class="rail box-b">${r.steps.map((id, i) => `<button class="rstep ${prog.done.includes(id) ? 'done' : ''}" data-i="${i}">
      <span class="ic">${stepIcon(id)}</span><span class="tbox"><svg viewBox="0 0 40 40"><path class="tick" d="M7 21 L16 31 L35 6"/></svg></span></button>`).join('<span class="rdash"></span>')}</nav>
    <section class="rstage"></section></div>`;
  $$('.rstep', screen).forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i; Sfx.play('pop'); bubble(b, stepWord(r.steps[i]));
    if (i !== S.stepIndex) runStep(i);
  }));
  const first = r.steps.findIndex(id => !prog.done.includes(id));
  runStep(first < 0 ? 0 : first);
};

function runStep(i) {
  const r = CONFIG.routines[S.routine], id = r.steps[i], d = stepDef(id);
  S.timers.forEach(clearTimeout); S.timers = []; S.token++;
  Hint.stop(); clearFx();
  S.stepIndex = i; S.help = () => {};
  $$('.rstep', screen).forEach((b, j) => b.classList.toggle('now', j === i));
  const stage = $('.rstage', screen); stage.innerHTML = '';
  const tk = S.token;
  setBanner([stepIcon(id)], stepWord(id));
  const fn = STEPS[d.kind];
  if (fn) fn(stage, d, () => { if (tk === S.token) stepDone(i); }, id);
  stage.firstElementChild?.classList.add('enter');
}

function stepDone(i) {
  const r = CONFIG.routines[S.routine], id = r.steps[i], prog = rProg();
  if (!prog.done.includes(id)) prog.done.push(id);
  Store.save();
  const cell = $$('.rstep', screen)[i]; if (cell) { cell.classList.add('done'); flash(cell, 'pop'); }
  Sfx.play('tick'); Sfx.play('sparkle', .15);
  S.timers.forEach(clearTimeout); S.timers = []; const tk = ++S.token; Hint.stop();
  if (r.steps.every(sid => prog.done.includes(sid))) { later(() => tk === S.token && celebrate(S.routine), 700); return; }
  let next = r.steps.findIndex((sid, j) => j > i && !prog.done.includes(sid));
  if (next < 0) next = r.steps.findIndex(sid => !prog.done.includes(sid));
  const stage = $('.rstage', screen);
  const card = el(stage, 'next-card', '', `<div class="nc box-b"><span class="nc-arrow">${art('arrow')}</span><span class="nc-ic">${stepIcon(r.steps[next])}</span><span class="nc-word">${stepWord(r.steps[next])}</span></div>`);
  let gone = false;
  const go2 = () => { if (gone || tk !== S.token) return; gone = true; runStep(next); };
  card.addEventListener('click', go2);
  later(go2, 1700);
}

/* ---------- celebration at the end of a routine ---------- */
function celebrate(kind) {
  const c = S.child, L = CONFIG.labels, night = kind === 'night';

  Store.data.history.push({ date: todayKey(), child: c.id, mode: kind, day: DAYS[S.ctx.day], t: Date.now() });

  $('.cele-title', ov).textContent = `${night ? L.goodNight : L.hooray}, ${c.name}!`;
  $('.cele-sub', ov).innerHTML = `<span class="ic">${badge(c)}</span>${night ? L.nightDone : L.morningDone}`;

}

/* a girl standing in a scene: x = middle, footY = floor, h = height for the tallest girl */
function girlEl(scene, c, x, footY, h, o = {}, cls = '') {
  h *= (c.look.height || 1);
  const w = h * 120 / 210;
  const d = el(scene, 'e who-fig ' + cls, P16(x - w / 2, footY - h, w, h), figure(c, o));
  d.draw = (o2 = {}) => { d.innerHTML = figure(c, { ...o, ...o2 }); };
  return d;
}
/* scene units -> screen pixels */
function scenePt(sc, x, y) { const r = sc.getBoundingClientRect(); return [r.left + x / 1600 * r.width, r.top + y / 1000 * r.height]; }
const tkGuard = () => { const tk = S.token; return () => tk === S.token; };

STEPS.wakeUp = (root, def, done) => {
  const c = S.child, L = CONFIG.labels, R = ROOM.bedroom, alive = tkGuard();
  const sc = sceneBox(root, 'bedroom');
  el(sc, 'e', P16(...R.win), art('windowDay'));
