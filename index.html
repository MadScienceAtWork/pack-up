<title>Pack Up!</title>
<meta name="theme-color" content="#f7f0e1">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<script>
/* =====================================================================
   ROUTINE CONFIG — edit this part to change the game.
   ---------------------------------------------------------------------
   children   : who plays, their badge, backpack and the things they pack
                (order = order on the start screen and checklist)
     items    : { id }               -> uses the item from CONFIG.items
                { id, days:["mon"] } -> only on those days (sun mon tue wed thu fri sat)
                { id, color:"#hex" } -> colour just for this child
                { id, spot:"shelf" } -> where it goes when unpacking (overrides item)
   items      : every thing that can go in a bag (word = shown + spoken)
                art: bottle lunchbox clothes sunscreen hat doll
                     readingBag libraryBag mathsBag
   spots      : places things go when unpacking (art: bench basket shelf hook toybox)
   modes      : the two games and the steps in each
   say        : everything the game says out loud ({name} {item} {spot} {day} {after})
   After editing, bump CACHE in sw.js so the installed app picks up the change.
   ===================================================================== */
const CONFIG = {
  title: "Pack Up!",

  voice: { lang: "en-AU", rate: 0.92, slowRate: 0.78, pitch: 1.08 },

  children: [
    {
      id: "luna",
      name: "Luna",
      badge: "moon",                 // moon | star
      accent: "#a98bd8",
      figure: "pigtails",            // pigtails | long
      afterWord: "After school",     // label on the Unpack button
      afterSay: "after school",      // how it's spoken
      backpack: { style: "rainbow", color: "#b9a6e6", pocket: "#f3ecff" },
      items: [
        { id: "bottle", color: "#9b82d9" },
        { id: "lunch" },
        { id: "clothes" },
        { id: "sunscreen" },
        { id: "readingBag", days: ["mon"] },
        { id: "libraryBag", days: ["wed"] },
        { id: "mathsBag",   days: ["fri"] }
      ]
    },
    {
      id: "stella",
      name: "Stella",
      badge: "star",
      accent: "#f0a65a",
      figure: "long",
      afterWord: "After childcare",
      afterSay: "after childcare",
      backpack: { style: "plain", color: "#7cc4b9", pocket: "#b3e0d8" },
      items: [
        { id: "bottle", color: "#ef9ab8" },
        { id: "toy" },
        { id: "hat" },
        { id: "clothes" }
      ]
    }
  ],

  items: {
    bottle:     { word: "water bottle",      art: "bottle",     spot: "bench",  color: "#7aa9de" },
    lunch:      { word: "lunch box",         art: "lunchbox",   spot: "bench",  color: "#e57a6e" },
    clothes:    { word: "change of clothes", art: "clothes",    spot: "basket" },
    sunscreen:  { word: "sunscreen",         art: "sunscreen",  spot: "shelf" },
    hat:        { word: "hat",               art: "hat",        spot: "hook",   color: "#f4d36b" },
    toy:        { word: "toy",               art: "doll",       spot: "toybox", say: "dolly" },
    readingBag: { word: "reading bag",       art: "readingBag", spot: "shelf",  color: "#7aa9de" },
    libraryBag: { word: "library bag",       art: "libraryBag", spot: "shelf",  color: "#8cc47e" },
    mathsBag:   { word: "maths bag",         art: "mathsBag",   spot: "shelf",  color: "#f4d36b" }
  },

  spots: {
    bench:  { word: "kitchen bench",  say: "on the kitchen bench",  art: "bench" },
    basket: { word: "washing basket", say: "in the washing basket", art: "basket" },
    shelf:  { word: "shelf",          say: "on the shelf",          art: "shelf" },
    hook:   { word: "hook",           say: "on the hook",           art: "hook" },
    toybox: { word: "toy box",        say: "in the toy box",        art: "toybox" }
  },

  modes: {
    pack:   { word: "Pack",   time: "Morning", icon: "sun",   steps: ["packItems", "zipUp"] },
    unpack: { word: "Unpack",                  icon: "house", steps: ["bringIn", "openBag", "putAway"] }
  },

  // Short words shown on screen (always next to a picture)
  labels: {
    home: "Who's playing?",
    choose: "Pack or unpack?",
    pack: "Pack your bag",
    bringIn: "Bring in",
    bringInBanner: "Bring your bag inside",
    openBag: "Open bag",
    openBanner: "Open your bag",
    putAway: "Put things away",
    packed: "All packed!",
    unpacked: "All unpacked!",
    again: "again",
    play: "Again",
    done: "Done",
    hooray: "Hooray"
  },

  // Everything spoken out loud. Arrays = pick one at random.
  say: {
    home: "Who's playing? Tap Luna, or Stella.",
    chooseMode: "Hi {name}! Is it morning, time to pack? Or {after}, time to unpack?",
    packStart: "Let's pack your bag! Drag each thing into your backpack.",
    packResume: "Let's keep packing!",
    todayExtra: "It's {day}! Don't forget your {item}.",
    packHint: "Put your {item} in your backpack.",
    packed: ["{item}. In it goes!", "{item}. Got it!", "{item}. Nice one!", "{item}. Great!"],
    notQuite: "Bring it right over to your backpack.",
    allPacked: "All packed! Zip it up!",
    bringIn: "Your bag is in the car. Drag it into the house.",
    openBag: "Tap your bag to open it.",
    putAway: "Now put each thing in its spot.",
    putHint: "Your {item} goes {spot}.",
    tapItem: "{item}. It goes {spot}.",
    placed: ["{item}, {spot}. Great!", "{item}, {spot}. Well done!", "{item}, {spot}. Nice!"],
    wrongSpot: "Hmm. Your {item} goes {spot}.",
    allUnpacked: "All unpacked!",
    cheerPack: "Hooray! You packed your bag, {name}! Great job!",
    cheerUnpack: "Hooray! You unpacked your bag, {name}! Great job!"
  }
};
</script>

:root {
  --paper: #f7f0e1;
  --card: #fffbf2;
  --ink: #3b3431;
  --soft: #8a7f76;
  --sun: #f4d36b;
  --glow: rgba(244, 211, 107, .75);
  --accent: #a98bd8;
  --font: "Andika", "Comic Neue", "Chalkboard SE", system-ui, sans-serif;
  --wob: 22px 30px 24px 28px / 28px 22px 30px 24px;   /* wobbly hand-drawn corners */
  --wob2: 30px 20px 28px 22px / 22px 28px 20px 30px;
  --line: 3.5px solid var(--ink);
  --tile: clamp(100px, min(11vw, 19vh), 142px);
  --btn: clamp(76px, 11vmin, 96px);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--font); font-weight: 700;
  touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
body::before {           /* paper grain */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.5), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(214,196,160,.25), transparent 50%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: none; }
svg.art { display: block; width: 100%; height: 100%; overflow: visible; }

#app { position: fixed; inset: 0; z-index: 1; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

/* ---------- top bar ---------- */
.topbar { display: grid; grid-template-columns: auto 1fr auto auto auto; align-items: center; gap: 14px; padding: 12px 18px 8px; }
.btn {
  width: var(--btn); height: var(--btn); border: var(--line); border-radius: var(--wob);

.banner { display: flex; align-items: center; gap: 14px; min-width: 0; padding: 6px 20px; min-height: 76px;

.banner-icon > svg { width: 58px; }

#screen { position: relative; min-height: 0; }
.enter { animation: enter .35s ease-out both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }

/* ---------- shared bits ---------- */
.name-box { display: inline-flex; align-items: center; gap: 8px; padding: 4px 16px; border: var(--line); border-radius: var(--wob2);
  background: #fff; font-size: clamp(28px, 3.6vw, 42px); }

/* ---------- home ---------- */
.home { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3vw; padding: 1vh 3vw 4vh; }

/* ---------- mode choice ---------- */
.modes { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3vw; padding: 1vh 4vw 4vh; }
.mode-card { border: var(--line); border-radius: var(--wob2); background: var(--card); box-shadow: 0 8px 0 rgba(59,52,49,.12);
  display: grid; grid-template-rows: 1fr auto auto; justify-items: center; align-items: center; padding: 3vh 2vw; gap: 1vh; transition: transform .15s; }
.mode-card:active { transform: scale(.97); }
.mode-card .mode-art { height: 100%; max-height: 40vh; aspect-ratio: 1; display: grid; place-items: center; }
.mode-card .mode-time { font-size: clamp(24px, 3.2vw, 36px); color: var(--soft); }
.mode-card .mode-word { font-size: clamp(42px, 6vw, 70px); display: flex; align-items: center; gap: .3em; }

.mode-card .today-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; padding: 2px 12px; border: 2.5px dashed var(--ink); border-radius: 14px; }

/* ---------- game layout ---------- */
.game { height: 100%; display: grid; grid-template-columns: minmax(250px, 28%) minmax(0, 1fr); gap: 18px; padding: 4px 18px 16px; }
.chart { position: relative; border: var(--line); border-radius: var(--wob); background: #fffdf6; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 0;
  box-shadow: 0 6px 0 rgba(59,52,49,.1); --row: clamp(46px, 8vh, 72px); }

.row { display: grid; grid-template-columns: calc(var(--row) * 1.15) 1fr auto; align-items: center; gap: 10px; min-height: var(--row); padding: 2px 4px; border-radius: 16px; }

.bp-peek { position: absolute; left: 20%; width: 60%; top: 6%; height: 40%; display: flex; justify-content: center; align-items: flex-end; }

.backpack.pulse { animation: pulse 1.8s ease-in-out infinite; }

/* ---------- pack scene ---------- */
.pack-play { display: grid; grid-template-rows: 1fr auto; }

.table-zone { position: relative; padding: 0 1%; }

.table { height: clamp(48px, 9vh, 76px); }
.table svg { width: 100%; height: 100%; }

.item { position: relative; width: var(--tile); display: grid; grid-template-rows: calc(var(--tile) * .82) auto; justify-items: center; align-items: end; padding: 4px; border-radius: 22px; touch-action: none; }
.item .item-art { width: 92%; height: 100%; }

.item.lifted, .item.gone { visibility: hidden; }
.item.in-bag { opacity: 0; transform: translateX(-40%) scale(.2); pointer-events: none; }
.item.pop-out { transition: opacity .35s ease-out, transform .45s cubic-bezier(.3,1.5,.5,1); }

#drag-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

/* ---------- unpack: outside ---------- */
.outside { position: absolute; inset: 0; border: var(--line); border-radius: var(--wob); overflow: hidden;
  background: linear-gradient(to bottom, #eaf3f7 0%, #f7f0e1 62%, #d7e8b8 62%, #c5dea0 100%); }

.outside .scene { position: absolute; left: 4%; right: 4%; bottom: 14%; display: flex; align-items: flex-end; justify-content: space-between; }

.car-wrap .car { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.car-wrap .bag-item { position: absolute; z-index: 1; left: 28.5%; top: 23%; width: 27%; touch-action: none; }

.car-wrap .bag-item.lifted { visibility: hidden; }
.car-wrap .bag-item .backpack { animation: pulse 1.8s ease-in-out infinite; }
.drag-clone .backpack { animation: none; }
.house { position: relative; width: 36%; aspect-ratio: 320/340; transition: transform .25s; }
.house.near { transform: scale(1.05); }
.house .door-open { opacity: 0; transition: opacity .2s; }

.hint-arrow { position: absolute; left: 46%; width: 22%; bottom: 52%; opacity: .7; pointer-events: none; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(14px); } }
.drag-clone.bag-item { width: auto; }
.bag-item .backpack { width: 100%; }

/* ---------- unpack: inside ---------- */
.room { position: absolute; inset: 0; border: var(--line); border-radius: var(--wob); overflow: hidden; display: grid; grid-template-rows: 1.15fr 1fr;
  background: linear-gradient(to bottom, #fbf3e3 0%, #f6ead2 58%, #e3c79c 58%, #d9bb8c 100%); }
.room .floor-line { position: absolute; left: 0; right: 0; top: 57%; height: 14px; pointer-events: none; }
.spots { position: relative; display: flex; justify-content: space-around; align-items: flex-end; gap: 10px; padding: 12px 14px 0; }
.spot { position: relative; width: clamp(128px, 15vw, 190px); display: grid; grid-template-rows: auto auto; justify-items: center; padding: 6px; border-radius: 24px; transition: transform .2s, background .2s; }
.spot .spot-art { width: 100%; aspect-ratio: 200/170; position: relative; }

.spot.glow { background: rgba(255,246,214,.85); box-shadow: 0 0 0 5px var(--glow), 0 0 30px 10px var(--glow); animation: glowpulse 1.2s ease-in-out infinite; }
@keyframes glowpulse { 50% { box-shadow: 0 0 0 8px var(--glow), 0 0 40px 16px var(--glow); } }
.spot.near { transform: scale(1.08); }
.floor-row { position: relative; display: flex; align-items: center; gap: 2%; padding: 6px 3% 10px; min-height: 0; }
.floor-row .backpack { height: 92%; max-height: 260px; flex: 0 0 auto; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; }

#celebrate { background: rgba(247,240,225,.97); }

.cele-badge { width: min(30vmin, 240px); aspect-ratio: 1; animation: float 2.6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-12px) rotate(4deg); } }
.cele-title { font-size: clamp(56px, 10vmin, 104px); line-height: 1; }
.cele-sub { display: flex; align-items: center; gap: 14px; font-size: clamp(28px, 5vmin, 44px); }

  display: inline-flex; align-items: center; justify-content: center; gap: 14px; font-size: 34px; }
.big-btn:active { transform: translateY(3px); }
.big-btn svg { width: 60px; height: 60px; }

#grownup { background: rgba(59,52,49,.35); font-family: system-ui, sans-serif; font-weight: 400; }
#grownup .panel { width: min(640px, 92vw); max-height: 90vh; overflow: auto; touch-action: pan-y; background: #fffdf8; border: var(--line); border-radius: 22px; padding: 18px 22px; }
#grownup h2 { margin: 0 0 6px; font-size: 24px; }

.chip.on { background: var(--sun); }

/* ---------- portrait ---------- */
@media (orientation: portrait) {
  .home, .modes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; padding: 1vh 5vw 3vh; }
  .kid-card { padding: 2vh 4vw 1.5vh; }
  .kid-pics .fig { height: 96%; }
  .spot { width: clamp(128px, 21vw, 190px); }
  .floor-items .item { --tile: clamp(100px, 15vw, 136px); }

  .mode-card .mode-art { max-height: 22vh; }

}

  .topbar { padding: 6px 12px 4px; }

}
@media (prefers-reduced-motion: reduce) {
  .btn.invite, .backpack.pulse, .spot.glow, .cele-badge, .hint-arrow { animation: none; }
}

<script>
/* =====================================================================
   GAME CODE — you shouldn't need to change anything below for routine edits.

   Built so later features slot in:
   - Decoy items:   add items with decoy:true in CONFIG; screenPack() puts every
                    item on the table — add a "leave out" tray target there.
   - Stickers/streak: every finish is logged in Store.data.history
                    ({date, child, mode, day}) — a sticker screen can read it.
   - Weather mode:  isActive() is the one place items are switched on/off
                    (it already handles `days`; add `weather` the same way).
   - Real photos:   itemArt() draws every item; give an item photo:"data:..."
                    and return an <img> there instead of the SVG.
   - Decorate bag:  backpack art takes {style, color, pocket}; stickers can be
                    added in ART.backpackParts().
   - Hidden settings: openGrown() is the settings panel; attach a long-press.
   ===================================================================== */
(() => {
'use strict';

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const pick = a => Array.isArray(a) ? a[Math.floor(Math.random() * a.length)] : a;
const fill = (str, v = {}) => String(pick(str) || '').replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/* ---------------- storage (wrapped so private mode / blocked storage never breaks the game) ---------------- */
const Store = {
  KEY: 'packup.v1',
  data: { settings: {}, progress: {}, history: [] },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && typeof d === 'object') this.data = { settings: d.settings || {}, progress: d.progress || {}, history: d.history || [] };
      }
    } catch (e) { /* storage unavailable — play without saving */ }
    const today = todayKey();
    for (const k of Object.keys(this.data.progress)) if (!k.startsWith(today)) delete this.data.progress[k];
    if (this.data.history.length > 600) this.data.history = this.data.history.slice(-600);
    this.save();
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} },

/* ---------------- routine helpers ---------------- */
function currentDay() {
  const o = Store.settings.dayOverride;
  if (o && o.date === todayKey() && o.day >= 0 && o.day <= 6) return o.day;
  return new Date().getDay();
}
function isActive(entry, ctx) {
  if (entry.days && !entry.days.map(d => String(d).toLowerCase().slice(0, 3)).includes(DAYS[ctx.day])) return false;
  // LATER (weather mode): if (entry.weather && !entry.weather.includes(ctx.weather)) return false;
  return true;
}
function resolveItem(entry) {
  const e = typeof entry === 'string' ? { id: entry } : entry;
  const base = CONFIG.items[e.id] || { word: e.id, art: 'bottle' };
  return { ...base, ...e, id: e.id };
}
function itemsFor(child, ctx) { return child.items.filter(e => isActive(e, ctx)).map(resolveItem); }
function itemSay(item) { return item.say || item.word; }
function spotOf(item) { return CONFIG.spots[item.spot] || CONFIG.spots.shelf || Object.values(CONFIG.spots)[0]; }
function progKey(mode) { return `${todayKey()}|${S.child.id}|${mode}|${S.ctx.day}`; }
function getProg(mode, fresh) {
  const k = progKey(mode);
  if (fresh || !Store.data.progress[k]) Store.data.progress[k] = { done: [], step: null };
  return Store.data.progress[k];
}
function shade(hex, amt) {
  const n = parseInt(hex.replace('#', ''), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(c + (amt < 0 ? c * amt : (255 - c) * amt))));
  const r = f(n >> 16), g = f((n >> 8) & 255), b = f(n & 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

/* =====================================================================
   VOICE — Web Speech, prefers an Australian voice
   ===================================================================== */
const Voice = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  voices: [], voice: null, _t: 0,
  init() {
    if (!this.ok) return;
    const load = () => { try { this.voices = speechSynthesis.getVoices() || []; this.choose(); fillVoiceSelect(); } catch (e) {} };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.stop(); });
  },
  norm: l => String(l || '').replace('_', '-').toLowerCase(),
  choose() {
    const want = this.norm(CONFIG.voice.lang), v = this.voices, n = this.norm, saved = Store.settings.voiceURI;
    this.voice = (saved && v.find(x => x.voiceURI === saved)) ||
      v.find(x => n(x.lang) === want && x.localService) || v.find(x => n(x.lang) === want) ||
      v.find(x => n(x.lang) === 'en-gb') || v.find(x => n(x.lang).startsWith('en')) || null;
  },
  say(text) {
    if (!this.ok || !text || Store.settings.speech === false) return;
    try {
      clearTimeout(this._t);
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (this.voice) { u.voice = this.voice; u.lang = this.voice.lang; } else u.lang = CONFIG.voice.lang;
      u.rate = Store.settings.slow ? CONFIG.voice.slowRate : CONFIG.voice.rate;
      u.pitch = CONFIG.voice.pitch;
      // small gap after cancel() — Android Chrome can drop an utterance spoken straight after it
      this._t = setTimeout(() => { try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch (e) {} }, 80);
    } catch (e) {}
  },
  stop() { try { clearTimeout(this._t); speechSynthesis.cancel(); } catch (e) {} }
};
const say = t => Voice.say(t);

/* =====================================================================
   SOUND — soft effects made with Web Audio (no audio files)
   ===================================================================== */
const Sfx = {
  ctx: null, out: null, nb: null,
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4500;
        const comp = this.ctx.createDynamicsCompressor();
        this.out = this.ctx.createGain(); this.out.gain.value = 0.55;
        this.out.connect(lp); lp.connect(comp); comp.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  tone(f, t0, dur, o = {}) {
    const c = this.ctx, t = c.currentTime + t0, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur * .8);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol ?? .2, t + (o.attack ?? .012));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.out); osc.start(t); osc.stop(t + dur + .05);
  },
  noise(t0, dur, o = {}) {
    const c = this.ctx, t = c.currentTime + t0;
    if (!this.nb) { const n = c.sampleRate; this.nb = c.createBuffer(1, n, n); const d = this.nb.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
    const s = c.createBufferSource(); s.buffer = this.nb;
    const f = c.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.f || 1200, t);
    if (o.fTo) f.frequency.exponentialRampToValueAtTime(o.fTo, t + dur);
    f.Q.value = o.q ?? 1;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol ?? .12, t + (o.attack ?? .01)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  },
  play(name, delay = 0) {
    if (!this.ctx || Store.settings.sound === false) return;
    try { (this.sounds[name] || (() => {})).call(this, delay); } catch (e) {}
  },
  sounds: {
    pop(d)   { this.tone(520, d, .14, { to: 760, vol: .14 }); },
    pick(d)  { this.tone(440, d, .12, { to: 640, vol: .1, type: 'triangle' }); },
    drop(d)  { this.tone(190, d, .2, { to: 110, vol: .22 }); this.noise(d, .08, { f: 500, vol: .06 }); },
    tick(d)  { this.tone(880, d, .2, { type: 'triangle', vol: .13 }); this.tone(1318.5, d + .1, .32, { type: 'triangle', vol: .12 }); },
    nudge(d) { this.tone(392, d, .18, { to: 349, vol: .09, type: 'triangle' }); },
    zip(d)   { for (let i = 0; i < 11; i++) this.noise(d + i * .032, .028, { f: 2200 + i * 160, q: 5, vol: .12 }); },
    whoosh(d){ this.noise(d, .45, { type: 'bandpass', f: 300, fTo: 1600, q: .8, vol: .1, attack: .15 }); },
    bell(d)  { this.tone(659.3, d, .7, { vol: .13 }); this.tone(523.3, d + .32, .9, { vol: .13 }); },
    cheer(d) {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, d + i * .12, .55, { type: 'triangle', vol: .13 }));
      [523.25, 659.25, 783.99].forEach(f => this.tone(f, d + .5, 1.1, { type: 'sine', vol: .07, attack: .05 }));
      for (let i = 0; i < 9; i++) this.tone(1400 + Math.random() * 1200, d + .55 + Math.random() * 1.2, .25, { vol: .035 });
      for (let i = 0; i < 70; i++) { const t = .3 + Math.pow(Math.random(), 1.4) * 1.9; this.noise(d + t, .03, { f: 900 + Math.random() * 1800, q: 1.4, vol: .05 * (1 - t / 2.4) + .01 }); }
    }
  }
};

/* =====================================================================
   DRAG — pointer events, forgiving snap, one finger at a time
   ===================================================================== */
const Drag = {
  active: null,
  layer: null,
  attach(el, opts) { el.addEventListener('pointerdown', e => this.down(e, el, opts)); },
  down(e, el, opts) {
    if (this.active || (e.button && e.button !== 0) || el.classList.contains('gone') || el.classList.contains('in-bag')) return;
    e.preventDefault();
    const st = { el, opts, id: e.pointerId, x0: e.clientX, y0: e.clientY, dragging: false, clone: null, rect: null, near: null };
    this.active = st;
    const move = ev => { if (ev.pointerId === st.id) { ev.preventDefault(); this.move(ev, st); } };
    const up = ev => {
      if (ev.pointerId !== st.id) return;
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      this.up(ev, st, ev.type === 'pointercancel');
    };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  },
  centre(st, e) { return [st.rect.left + st.rect.width / 2 + (e.clientX - st.x0), st.rect.top + st.rect.height / 2 + (e.clientY - st.y0)]; },
  move(e, st) {
    const dx = e.clientX - st.x0, dy = e.clientY - st.y0;
    if (!st.dragging) { if (Math.hypot(dx, dy) < 12) return; this.begin(st); }
    const rot = Math.max(-7, Math.min(7, dx * .02));
    st.clone.style.transform = `translate(${dx}px, ${dy}px) scale(1.12) rotate(${rot}deg)`;
    const [cx, cy] = this.centre(st, e);
    const near = this.find(st, cx, cy, true);
    if (near !== st.near) { st.near?.el.classList.remove('near'); near?.el.classList.add('near'); st.near = near; }
  },
  begin(st) {
    st.dragging = true;
    const r = st.rect = st.el.getBoundingClientRect();
    const c = st.clone = st.el.cloneNode(true);
    c.classList.remove('wiggle', 'pulse');
    c.classList.add('drag-clone');
    Object.assign(c.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    this.layer.appendChild(c);
    st.el.classList.add('lifted');
    Sfx.play('pick');
    st.opts.onStart?.(st);
  },
  /* the right target wins if it's anywhere near; otherwise report a wrong one we're on top of */
  find(st, cx, cy, acceptOnly) {
    const hit = (t, m) => { const r = t.el.getBoundingClientRect(); return cx > r.left - m && cx < r.right + m && cy > r.top - m && cy < r.bottom + m ? Math.hypot(cx - (r.left + r.width / 2), cy - (r.top + r.height / 2)) : Infinity; };
    let best = null, bd = Infinity;
    const ts = st.opts.targets();
    for (const t of ts) if (t.accept) { const d = hit(t, t.margin ?? 110); if (d < bd) { bd = d; best = t; } }
    if (best || acceptOnly) return best;
    for (const t of ts) if (!t.accept) { const d = hit(t, 0); if (d < bd) { bd = d; best = t; } }
    return best;
  },
  up(e, st, cancelled) {
    this.active = null;
    st.near?.el.classList.remove('near');
    if (!st.dragging) { if (!cancelled) st.opts.onTap?.(st); return; }
    st.opts.onEnd?.(st);
    const [cx, cy] = this.centre(st, e);
    const t = cancelled ? null : this.find(st, cx, cy, false);
    const from = st.clone.style.transform;
    if (t && t.accept) {
      const tr = (t.flyTo ? t.flyTo() : t.el).getBoundingClientRect();
      const tx = tr.left + tr.width / 2 - (st.rect.left + st.rect.width / 2);
      const ty = tr.top + tr.height / 2 - (st.rect.top + st.rect.height / 2);
      const a = st.clone.animate([{ transform: from, opacity: 1 }, { transform: `translate(${tx}px, ${ty}px) scale(${t.shrink ?? .35})`, opacity: t.fade ? 0 : 1 }],
        { duration: 360, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards' });
      a.onfinish = () => { st.clone.remove(); t.onDrop(st); };
    } else {
      const a = st.clone.animate([{ transform: from }, { transform: 'translate(0px, 0px) scale(1)' }], { duration: 420, easing: 'cubic-bezier(.3,1.3,.5,1)', fill: 'forwards' });
      a.onfinish = () => { st.clone.remove(); st.el.classList.remove('lifted'); };
      st.opts.onMiss?.(st, t);
    }
  }
};

/* =====================================================================
   APP + SCREENS
   ===================================================================== */
const S = { screen: null, child: null, mode: null, ctx: { day: 0 }, prompt: () => '', timers: [] };
const screen = $('#screen');
const later = (fn, ms) => { const t = setTimeout(fn, ms); S.timers.push(t); return t; };

function setBanner(iconHTML, text) {
  $('#banner .banner-icon').innerHTML = iconHTML || '';
  $('#banner .banner-text').textContent = text || '';
}
function wiggle(el) { el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); el.addEventListener('animationend', () => el.classList.remove('wiggle'), { once: true }); }
function flash(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); el.addEventListener('animationend', () => el.classList.remove(cls), { once: true }); }

function go(name, params = {}) {
  S.timers.forEach(clearTimeout); S.timers = [];
  Object.assign(S, params);
  S.screen = name;
  S.ctx = { day: currentDay() };
  $('#btnBack').classList.toggle('invisible', name === 'home');
  screen.innerHTML = '';
  if (S.child) document.documentElement.style.setProperty('--accent', S.child.accent || '#a98bd8');
  SCREENS[name]();
  const first = screen.firstElementChild; if (first) first.classList.add('enter');
}
function back() {
  Voice.stop();
  if (S.screen === 'pack' || S.screen === 'unpack') go('mode');
  else go('home', { child: null });
}

/* checklist panel styled like the paper chart */
function chartPanel(child, rows, withDays) {
  let days = '';
  if (withDays) {
    const dayItems = child.items.filter(e => e.days).map(resolveItem);
    if (dayItems.length) {
      const list = [];
      dayItems.forEach(it => it.days.forEach(d => { const i = DAYS.indexOf(String(d).toLowerCase().slice(0, 3)); if (i >= 0) list.push({ i, it }); }));
      list.sort((a, b) => ((a.i + 6) % 7) - ((b.i + 6) % 7));
      days = `<div class="days">${list.map((x, n) => `${n ? '<span class="dash"></span>' : ''}<button class="day ${x.i === S.ctx.day ? 'today' : ''}" data-say="${DAY_NAMES[x.i]}: ${x.it.word}"><span class="d">${DAY_SHORT[x.i]}</span><span class="ic">${itemArt(x.it)}</span></button>`).join('')}</div>`;
    }
  }
  return `<aside class="chart">
    <div class="chart-head"><button class="name-box" data-say="${child.name}">${child.name}${badge(child)}</button><div class="mini-bag">${art('backpackClosed', child.backpack)}</div></div>
    <ul class="checklist">${rows.map(r => `<li class="row ${r.done ? 'done' : ''}" data-row="${r.id}" data-say="${r.say || r.word}">
      <span class="ic">${r.icon}</span><span class="word">${r.word}</span>
      <span class="box"><svg viewBox="0 0 40 40"><path class="tick" d="M7 21 L16 31 L35 6"/></svg></span></li>`).join('')}</ul>${days}
  </aside>`;
}
function tickRow(id) { const r = $(`.row[data-row="${id}"]`, screen); if (r) { r.classList.add('done'); flash(r, 'pop'); } }
function itemTile(item, cls = '') {
  return `<div class="item ${cls}" data-id="${item.id}"><div class="item-art">${itemArt(item)}</div><div class="item-word">${item.word}</div></div>`;
}

const SCREENS = {
  /* ---------- 1. who's playing ---------- */
  home() {
    S.prompt = () => CONFIG.say.home;
    setBanner(CONFIG.children.map(badge).map(b => `<span style="width:28px;height:28px;display:inline-block">${b}</span>`).join(''), CONFIG.labels.home);
    screen.innerHTML = `<div class="home">${CONFIG.children.map(c => `
      <button class="kid-card" data-child="${c.id}" style="--accent:${c.accent}">
        <span class="name-box">${c.name}${badge(c)}</span>
        <span class="kid-pics"><span class="fig">${art('figure', { kind: c.figure })}</span><span class="mini-bag">${art('backpackClosed', c.backpack)}</span></span>
      </button>`).join('')}</div>`;
    $$('.kid-card', screen).forEach(b => b.addEventListener('click', () => {
      Sfx.play('pop');
      go('mode', { child: CONFIG.children.find(c => c.id === b.dataset.child) });
      say(S.prompt());
    }));
  },

  /* ---------- 2. morning or after school ---------- */
  mode() {
    const c = S.child, ctx = S.ctx;
    const extra = itemsFor(c, ctx).filter(i => i.days);
    S.prompt = () => fill(CONFIG.say.chooseMode, { name: c.name, after: c.afterSay || 'after school' });
    setBanner(badge(c), `${c.name} · ${CONFIG.labels.choose}`);
    const P = CONFIG.modes.pack, U = CONFIG.modes.unpack;
    screen.innerHTML = `<div class="modes">
      <button class="mode-card" data-mode="pack">
        <span class="mode-art">${art(P.icon)}</span>
        <span class="mode-time">${P.time}</span>
        <span class="mode-word"><span class="ic">${art('backpackClosed', c.backpack)}</span>${P.word}</span>
        ${extra.length ? `<span class="today-chip">${DAY_SHORT[ctx.day]} ${extra.map(i => `<span class="ic">${itemArt(i)}</span>`).join('')}</span>` : ''}
      </button>
      <button class="mode-card" data-mode="unpack">
        <span class="mode-art">${art('houseIcon')}</span>
        <span class="mode-time">${c.afterWord || 'After school'}</span>
        <span class="mode-word"><span class="ic">${art('car')}</span>${U.word}</span>
      </button></div>`;
    $$('.mode-card', screen).forEach(b => b.addEventListener('click', () => { Sfx.play('pop'); go(b.dataset.mode); }));
  },

  /* ---------- 3. morning: pack ---------- */
  pack() {
    const c = S.child, ctx = S.ctx, L = CONFIG.labels, Y = CONFIG.say;
    const items = itemsFor(c, ctx);
    let prog = getProg('pack');
    prog.done = prog.done.filter(id => items.some(i => i.id === id));
    if (prog.done.length >= items.length) prog = getProg('pack', true);
    Store.save();
    const resumed = prog.done.length > 0;
    const isDone = id => prog.done.includes(id);
    const remaining = () => items.filter(i => !isDone(i.id));

    setBanner(art('backpackClosed', c.backpack), L.pack);
    S.prompt = () => { const n = remaining()[0]; return n ? fill(Y.packHint, { item: itemSay(n) }) : Y.allPacked; };

    screen.innerHTML = `<div class="game">
      ${chartPanel(c, items.map(i => ({ id: i.id, icon: itemArt(i), word: i.word, say: itemSay(i), done: isDone(i.id) })), true)}
      <section class="play pack-play">
        <div class="bag-zone">${backpackHTML(c.backpack, 'open')}</div>
        <div class="table-zone"><div class="table-items">${items.map(i => itemTile(i, isDone(i.id) ? 'gone' : '')).join('')}</div><div class="table">${art('table')}</div></div>
      </section></div>`;
    $('.table svg', screen).setAttribute('preserveAspectRatio', 'none');

    const bag = $('.backpack', screen), peek = $('.bp-peek', bag);
    const addPeek = item => {
      const d = document.createElement('div'); d.className = 'peek';
      d.style.rotate = `${(peek.children.length % 2 ? 1 : -1) * (6 + peek.children.length * 3)}deg`;
      d.innerHTML = itemArt(item); peek.appendChild(d);
      bag.style.setProperty('--fill', peek.children.length);
    };
    items.filter(i => isDone(i.id)).forEach(addPeek);
    bag.addEventListener('click', () => { wiggle(bag); say(S.prompt()); });

    $$('.item', screen).forEach(el => {
      const item = items.find(i => i.id === el.dataset.id);
      Drag.attach(el, {
        targets: () => [{ el: bag, accept: true, margin: 130, flyTo: () => peek, shrink: .4, onDrop: () => packed(item, el) }],
        onTap: () => { Sfx.play('pop'); wiggle(el); say(cap(itemSay(item))); },
        onMiss: () => { Sfx.play('nudge'); say(Y.notQuite); }
      });
    });

    function packed(item, el) {
      el.classList.add('gone'); el.classList.remove('lifted');
      prog.done.push(item.id); Store.save();
      addPeek(item); flash(bag, 'bump'); tickRow(item.id);
      Sfx.play('drop'); Sfx.play('tick', .12);
      if (remaining().length) say(fill(Y.packed, { item: cap(itemSay(item)) }));
      else finish();
    }
    function finish() {
      setBanner(art('tick'), L.packed);
      say(Y.allPacked);
      later(() => { bag.classList.replace('open', 'closed'); flash(bag, 'bump'); Sfx.play('zip'); }, 1100);
      later(() => celebrate('pack'), 2500);
    }

    // first words
    const extra = items.filter(i => i.days && !isDone(i.id));
    let intro = resumed ? Y.packResume : Y.packStart;
    if (extra.length) intro += ' ' + fill(Y.todayExtra, { day: DAY_NAMES[ctx.day], item: extra.map(itemSay).join(' and your ') });
    say(intro);
  },

  /* ---------- 4. after school: unpack ---------- */
  unpack() {
    const c = S.child, ctx = S.ctx, L = CONFIG.labels, Y = CONFIG.say;
    const items = itemsFor(c, ctx);
    let prog = getProg('unpack');
    if (!prog.step) prog.step = 'bringIn';
    prog.done = prog.done.filter(id => items.some(i => i.id === id));
    if (prog.step === 'done' || (prog.step === 'putAway' && prog.done.length >= items.length)) { prog = getProg('unpack', true); prog.step = 'bringIn'; }
    Store.save();
    const isDone = id => prog.done.includes(id);
    const remaining = () => items.filter(i => !isDone(i.id));
    const steps = CONFIG.modes.unpack.steps;
    const after = s => steps.indexOf(prog.step) > steps.indexOf(s);

    const rows = [];
    if (steps.includes('bringIn')) rows.push({ id: '_bringIn', icon: art('car'), word: L.bringIn, done: after('bringIn') });
    if (steps.includes('openBag')) rows.push({ id: '_open', icon: art('backpackClosed', c.backpack), word: L.openBag, done: after('openBag') });
    items.forEach(i => rows.push({ id: i.id, icon: itemArt(i), word: i.word, say: itemSay(i), done: isDone(i.id) }));

    screen.innerHTML = `<div class="game">${chartPanel(c, rows, false)}<section class="play unpack-play"></section></div>`;
    const play = $('.unpack-play', screen);

    const nextStep = () => { const i = steps.indexOf(prog.step); prog.step = steps[i + 1] || 'done'; Store.save(); };

    /* 4a. bag in the car → drag into the house */
    function outside() {
      setBanner(art('car'), L.bringInBanner);
      S.prompt = () => Y.bringIn;
      play.innerHTML = `<div class="outside enter">
        <div class="ground-line">${art('groundLine')}</div>
        <div class="sky-sun">${art('sun')}</div>
        <div class="hint-arrow">${art('arrow')}</div>
        <div class="scene">
          <div class="car-wrap"><div class="bag-item" data-say="bag">${backpackHTML(c.backpack, 'closed')}</div><div class="car">${art('car')}</div></div>
          <div class="house" data-say="house">${art('house')}<svg class="art door-open" viewBox="0 0 320 340" aria-hidden="true"><g filter="url(#crayon)">${ART.houseDoorOpen.draw()}</g></svg></div>
        </div></div>`;
      $('.ground-line svg', play).setAttribute('preserveAspectRatio', 'none');
      const bagEl = $('.bag-item', play), house = $('.house', play);
      house.addEventListener('click', () => { wiggle(house); say(Y.bringIn); });
      Drag.attach(bagEl, {
        targets: () => [{ el: house, accept: true, margin: 120, flyTo: () => $('.door-open', house), shrink: .3, fade: true, onDrop: () => {
          house.classList.add('opened'); bagEl.classList.add('gone');
          Sfx.play('bell'); tickRow('_bringIn'); nextStep();
          later(() => { Sfx.play('whoosh'); inside(true); }, 1100);
        } }],
        onStart: () => { const a = $('.hint-arrow', play); if (a) a.style.opacity = '.25'; },
        onTap: () => { Sfx.play('pop'); say(Y.bringIn); },
        onMiss: () => { Sfx.play('nudge'); say(Y.bringIn); }
      });
      say(Y.bringIn);
    }

    /* 4b. inside: open the bag, then put each thing in its spot */
    function inside(speak) {
      const spotIds = [...new Set(items.map(i => CONFIG.spots[i.spot] ? i.spot : Object.keys(CONFIG.spots)[0]))];
      const open = prog.step !== 'openBag';
      play.innerHTML = `<div class="room enter">
        <div class="floor-line">${art('groundLine')}</div>
        <div class="spots">${spotIds.map(id => { const sp = CONFIG.spots[id], a = ART[sp.art] || ART.shelf; return `
          <button class="spot" data-spot="${id}" data-say="${sp.word}"><span class="spot-art">${art(sp.art)}<span class="spot-items" style="top:${a.area[0]}%;height:${a.area[1] - a.area[0]}%"></span></span><span class="spot-word">${sp.word}</span></button>`; }).join('')}</div>
        <div class="floor-row">${backpackHTML(c.backpack, open ? 'open' : 'closed pulse')}<div class="floor-items">${items.map(i => itemTile(i, isDone(i.id) ? 'gone' : (open ? '' : 'in-bag'))).join('')}</div></div>
      </div>`;
      $('.floor-line svg', play).setAttribute('preserveAspectRatio', 'none');
      const bag = $('.backpack', play);
      const spotEl = id => $(`.spot[data-spot="${id}"]`, play);
      const placeIn = item => { const box = $('.spot-items', spotEl(item.spot) || $('.spot', play)); const d = document.createElement('div'); d.className = 'placed'; d.innerHTML = itemArt(item); box.appendChild(d); };
      items.filter(i => isDone(i.id)).forEach(placeIn);
      $$('.spot', play).forEach(s => s.addEventListener('click', () => { wiggle(s); say(CONFIG.spots[s.dataset.spot].word); }));

      const hint = () => { const n = remaining()[0]; return n ? fill(Y.putHint, { item: itemSay(n), spot: spotOf(n).say }) : Y.allUnpacked; };

      if (!open) {
        setBanner(art('backpackClosed', c.backpack), L.openBanner);
        S.prompt = () => Y.openBag;
        bag.addEventListener('click', function opener() {
          bag.removeEventListener('click', opener);
          bag.classList.remove('pulse'); bag.classList.replace('closed', 'open'); flash(bag, 'bump');
          Sfx.play('zip'); tickRow('_open'); nextStep();
          $$('.floor-items .item.in-bag', play).forEach((el, n) => later(() => { el.classList.add('pop-out'); el.classList.remove('in-bag'); Sfx.play('pop'); }, 300 + n * 180));
          later(startPutAway, 400 + items.length * 180);
        });
        if (speak) say(Y.openBag);
      } else startPutAway(speak);

      function startPutAway(speak = true) {
        setBanner(art('houseIcon'), L.putAway);
        S.prompt = hint;
        if (speak) say(Y.putAway + ' ' + hint());
        bag.addEventListener('click', () => { wiggle(bag); say(hint()); });
      }

      $$('.floor-items .item', play).forEach(el => {
        const item = items.find(i => i.id === el.dataset.id);
        const sp = spotOf(item);
        Drag.attach(el, {
          targets: () => $$('.spot', play).map(s => ({
            el: s, accept: s.dataset.spot === item.spot, margin: 70, shrink: .45,
            flyTo: () => $('.spot-items', s),
            onDrop: () => placed(item, el)
          })),
          onStart: () => spotEl(item.spot)?.classList.add('glow'),
          onEnd: () => spotEl(item.spot)?.classList.remove('glow'),
          onTap: () => { Sfx.play('pop'); wiggle(el); spotEl(item.spot) && flash(spotEl(item.spot), 'wiggle'); say(fill(Y.tapItem, { item: cap(itemSay(item)), spot: sp.say })); },
          onMiss: (st, wrong) => {
            Sfx.play('nudge');
            say(fill(Y.wrongSpot, { item: itemSay(item), spot: sp.say }));
            const right = spotEl(item.spot);
            if (right) { right.classList.add('glow'); later(() => right.classList.remove('glow'), 1800); }
          }
        });
      });

      function placed(item, el) {
        el.classList.add('gone'); el.classList.remove('lifted');
        prog.done.push(item.id); Store.save();
        placeIn(item); tickRow(item.id);
        Sfx.play('drop'); Sfx.play('tick', .12);
        if (remaining().length) say(fill(Y.placed, { item: cap(itemSay(item)), spot: spotOf(item).say }));
        else {
          nextStep();
          setBanner(art('tick'), L.unpacked);
          say(Y.allUnpacked);
          later(() => { bag.classList.replace('open', 'closed'); Sfx.play('zip'); }, 900);
          later(() => celebrate('unpack'), 2200);
        }
      }
    }

    if (prog.step === 'bringIn' && steps.includes('bringIn')) outside();
    else { if (prog.step === 'bringIn') nextStep(); inside(true); }
  }
};

/* ---------- 5. celebration ---------- */
function celebrate(mode) {
  const c = S.child, L = CONFIG.labels;
  Store.data.history.push({ date: todayKey(), child: c.id, mode, day: DAYS[S.ctx.day], t: Date.now() });
  delete Store.data.progress[progKey(mode)];
  Store.save();
  const ov = $('#celebrate');
  $('.cele-badge', ov).innerHTML = badge(c);
  $('.cele-title', ov).textContent = `${L.hooray}, ${c.name}!`;
  $('.cele-sub', ov).innerHTML = `<span class="ic">${art('backpackClosed', c.backpack)}</span>${mode === 'pack' ? L.packed : L.unpacked}`;
  $('#celeAgain').innerHTML = `${art('replay')}${L.play}`;
  $('#celeDone').innerHTML = `${art('tick')}${L.done}`;
  ov.hidden = false;
  Sfx.play('cheer');
  setTimeout(() => say(fill(mode === 'pack' ? CONFIG.say.cheerPack : CONFIG.say.cheerUnpack, { name: c.name })), 700);
  Confetti.start();
  S.prompt = () => fill(mode === 'pack' ? CONFIG.say.cheerPack : CONFIG.say.cheerUnpack, { name: c.name });
  $('#celeAgain').onclick = () => { closeCele(); Sfx.play('pop'); go(mode); };
  $('#celeDone').onclick = () => { closeCele(); Sfx.play('pop'); go('home', { child: null }); say(CONFIG.say.home); };
}
function closeCele() { $('#celebrate').hidden = true; Confetti.stop(); }

const Confetti = {
  raf: 0, parts: [],
  start() {
    const cv = $('#confetti'), dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ['#e57a6e', '#f0a65a', '#f4d36b', '#8cc47e', '#7aa9de', '#a98bd8', '#ef9ab8'];
    const n = reduceMotion ? 18 : 70;
    this.parts = Array.from({ length: n }, (_, i) => ({
      x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .9,
      vy: 1.2 + Math.random() * 1.6, sway: Math.random() * Math.PI * 2, sw: .6 + Math.random(),
      r: 7 + Math.random() * 9, rot: Math.random() * 6, vr: (Math.random() - .5) * .06,
      c: cols[i % cols.length], k: i % 3
    }));
    const t0 = performance.now();
    const step = t => {
      const age = (t - t0) / 1000;
      g.clearRect(0, 0, innerWidth, innerHeight);
      g.lineWidth = 2; g.strokeStyle = 'rgba(59,52,49,.55)';
      for (const p of this.parts) {
        p.y += p.vy; p.sway += .02; p.x += Math.sin(p.sway) * p.sw; p.rot += p.vr;
        if (p.y > innerHeight + 30 && age < 4) { p.y = -20; p.x = Math.random() * innerWidth; }
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.c; g.beginPath();
        if (p.k === 0) { for (let i = 0; i < 10; i++) { const rr = i % 2 ? p.r * .45 : p.r, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(rr * Math.cos(a), rr * Math.sin(a)); } g.closePath(); }
        else if (p.k === 1) g.arc(0, 0, p.r * .6, 0, Math.PI * 2);
        else { g.ellipse(0, 0, p.r * .9, p.r * .4, 0, 0, Math.PI * 2); }
        g.fill(); g.stroke(); g.restore();
      }
      if (age < 9) this.raf = requestAnimationFrame(step); else g.clearRect(0, 0, innerWidth, innerHeight);
    };
    cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(step);
  },
  stop() { cancelAnimationFrame(this.raf); const cv = $('#confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
};

/* ---------- grown-up settings ---------- */
function fillVoiceSelect() {
  const sel = $('#voiceSel'); if (!sel) return;
  const en = Voice.voices.filter(v => Voice.norm(v.lang).startsWith('en'));
  sel.innerHTML = `<option value="">Automatic${Voice.voice ? ` (${Voice.voice.name})` : ''}</option>` +
    en.map(v => `<option value="${v.voiceURI.replace(/"/g, '&quot;')}">${v.name} — ${v.lang}</option>`).join('');
  sel.value = Store.settings.voiceURI || '';
  if (!Voice.ok) sel.innerHTML = '<option>Speech not available on this browser</option>';
}
function openGrown() {
  const ov = $('#grownup'), st = Store.settings, today = new Date().getDay(), cur = currentDay();
  const realToday = !(st.dayOverride && st.dayOverride.date === todayKey());
  $('#dayChips').innerHTML = `<button class="chip ${realToday ? 'on' : ''}" data-day="auto">Today (${DAY_SHORT[today]})</button>` +
    [1, 2, 3, 4, 5, 6, 0].map(d => `<button class="chip ${!realToday && cur === d ? 'on' : ''}" data-day="${d}">${DAY_SHORT[d]}</button>`).join('');
  $('#rateChips').innerHTML = `<button class="chip ${!st.slow ? 'on' : ''}" data-slow="0">Normal</button><button class="chip ${st.slow ? 'on' : ''}" data-slow="1">Slower</button>`;
  $('#soundChips').innerHTML = `<button class="chip ${st.speech !== false ? 'on' : ''}" data-t="speech">Talking</button><button class="chip ${st.sound !== false ? 'on' : ''}" data-t="sound">Sound effects</button>`;
  fillVoiceSelect();
  ov.hidden = false;
}
function closeGrown() {
  $('#grownup').hidden = true;
  if (S.screen === 'pack' || S.screen === 'unpack' || S.screen === 'mode') go(S.screen);
}
function bindGrown() {
  const ov = $('#grownup');
  ov.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (e.target === ov) return closeGrown();
    if (!b) return;
    const st = Store.settings;
    if (b.dataset.day) { st.dayOverride = b.dataset.day === 'auto' ? null : { date: todayKey(), day: +b.dataset.day }; Store.save(); openGrown(); }
    else if (b.dataset.slow) { st.slow = b.dataset.slow === '1'; Store.save(); openGrown(); }
    else if (b.dataset.t) { st[b.dataset.t] = st[b.dataset.t] === false; Store.save(); openGrown(); }
    else if (b.id === 'voiceTest') { Sfx.unlock(); say(`Hi ${CONFIG.children.map(c => c.name).join(' and ')}! Let's pack your bags.`); }
    else if (b.id === 'resetToday') { Store.data.progress = {}; Store.save(); b.textContent = 'Done ✓'; }
    else if (b.id === 'closeGrown') closeGrown();
  });
  $('#voiceSel').addEventListener('change', e => { Store.settings.voiceURI = e.target.value || null; Store.save(); Voice.choose(); });
}

/* ---------- fullscreen ---------- */
const fsOK = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFS() {
  try {
    if (fsOn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const el = document.documentElement; const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' }); p && p.catch && p.catch(() => {}); }
  } catch (e) {}
}
function updateFS() {
  const b = $('#btnFull');
  const standaloneFull = matchMedia('(display-mode: fullscreen)').matches && !fsOn();
  b.style.display = fsOK() && !standaloneFull ? '' : 'none';
  b.innerHTML = art(fsOn() ? 'shrink' : 'fullscreen');
}

/* ---------- start ---------- */
function boot() {
  Store.load();
  Drag.layer = $('#drag-layer');
  $('#btnBack').innerHTML = art('back');
  $('#btnSay').innerHTML = `${art('speaker')}<span>${CONFIG.labels.again}</span>`;
  $('#btnGrown').innerHTML = art('gear');
  updateFS();
  document.addEventListener('fullscreenchange', updateFS);
  document.addEventListener('webkitfullscreenchange', updateFS);

  // sound can only start after a touch
  const unlock = () => { Sfx.unlock(); $('#btnSay').classList.remove('invite'); };
  document.addEventListener('pointerdown', unlock, { capture: true });

  $('#btnBack').addEventListener('click', () => { Sfx.play('pop'); back(); });
  $('#btnSay').addEventListener('click', () => { flash($('#btnSay'), 'wiggle'); say(S.prompt()); });
  $('#btnFull').addEventListener('click', toggleFS);
  $('#btnGrown').addEventListener('click', openGrown);
  bindGrown();

  // tap anything with a name to hear it
  screen.addEventListener('click', e => {
    const el = e.target.closest('[data-say]');
    if (!el || el.classList.contains('bag-item') || el.classList.contains('house') || el.classList.contains('spot')) return;
    Sfx.play('pop'); wiggle(el); say(el.dataset.say);
  });

  // no long-press menus, no pinch, no double-tap zoom
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || Drag.active) e.preventDefault(); }, { passive: false });

  Voice.init();
  go('home', { child: null });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
}
boot();
})();
</script>
