  const dim = el(sc, 'dark'); dim.style.opacity = .16;
  const list = Object.entries(CONFIG.books);
  setBanner([art('bookIcon')], L.bookPick);
  choose(sc, list.map(([k, b]) => ({ id: k, word: b.word, html: `<span class="bcover" style="background:${b.color}">${art(b.cover)}</span>` }))).then(k => alive() && read(k));

  function read(k) {
    Sfx.play('page');
    const b = CONFIG.books[k], pages = b.pages.slice();
    const book = el(sc, 'book', `--bc:${b.color}`, `<div class="page pl"></div><div class="page pr"></div><div class="bstars">${pages.map(() => `<span>${art('starSlot')}</span>`).join('')}</div><div class="turn">${art('arrow')}</div>`);
    const pl = $('.pl', book), pr = $('.pr', book), turn = $('.turn', book), slots = $$('.bstars span', book);
    let i = -1, found = 0, busy = false;
    const letters = w => [...w].map((ch, j) => `<span class="lt" style="--j:${j}">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('');
    const fillPages = () => {
      if (i < 0) { pl.innerHTML = `<div class="pcover">${art(b.cover)}</div>`; pr.innerHTML = `<div class="ptitle tap">${letters(b.word)}</div>`; }
      else if (i < pages.length) {
        const [pic, word] = pages[i];
        pl.innerHTML = `<div class="ppic tap" data-a="${pic}">${art(pic)}</div>`;
        pr.innerHTML = `<div class="pword tap">${letters(word)}</div><div class="psmall">${art(pic)}</div>`;
        // a little star hides in a corner of one of the pages
        const host = Math.random() < .5 ? pl : pr, spots = [[6, 6], [78, 6], [6, 78], [78, 78]], [x, y] = spots[Math.floor(Math.random() * 4)];
        const st = document.createElement('div'); st.className = 'hstar tap'; st.style.left = x + '%'; st.style.top = y + '%'; st.innerHTML = art('skyStar', { color: '#f4d36b' });
        host.appendChild(st);
        st.addEventListener('click', ev => {
          ev.stopPropagation(); if (st.dataset.got) return; st.dataset.got = 1; Hint.stop();
          Sfx.play('ting'); const [sx, sy] = rectC(st); sparkleAt(sx, sy, 8);
          st.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.8) rotate(180deg)', opacity: 0 }], { duration: 450, fill: 'forwards' });
          slots[found].innerHTML = art('starSlot', { on: true }); flash(slots[found], 'pop'); found++;
          girl.draw({ pose: 'sit', mouth: 'cheer', eyes: 'happy' }); later(() => girl.isConnected && girl.draw({ pose: 'sit' }), 800);
        });
      } else {
        pl.innerHTML = `<div class="ppic">${figure(c, { pose: 'cheer', mouth: 'cheer' })}</div>`;
        pr.innerHTML = `<div class="pword tap">${letters(L.theEnd || 'The End')}</div><div class="psmall">${art('heartIcon')}</div>`;
      }
    };
    fillPages();
    book.animate([{ transform: 'scale(.3) rotate(-8deg)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 450, easing: 'ease-out' });
    setBanner([art('tapHand'), art('bookIcon')], L.bookTap);
    setHelp(() => Hint.tap(turn), 1400);

    /* taps inside the pages */
    book.addEventListener('click', async ev => {
      const pic = ev.target.closest('.ppic.tap'), word = ev.target.closest('.pword, .ptitle');
      if (pic) {
        const fx = PAGE_FX[pic.dataset.a] || ['pop', 'hop']; Sfx.play(fx[0]);
        pic.animate(PAGE_MOVES[fx[1]], { duration: 700, easing: 'ease-in-out' }); bubble(pic, pages[i]?.[1] || '');
        return;
      }
      if (word) {
        $$('.lt', word).forEach((s, j) => { later(() => Sfx.play('letter', 0, j), j * 90); s.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-40%) scale(1.15)' }, { transform: 'translateY(0)' }], { duration: 420, delay: j * 90, easing: 'ease-out' }); });
        return;
      }
      if (!ev.target.closest('.pr, .turn')) return;
      nextPage();
    });
    async function nextPage() {
      if (busy) return; busy = true; Hint.stop();
      if (i >= pages.length) {
        Sfx.play('page'); await finished(book.animate([{ transform: 'none', opacity: 1 }, { transform: 'scale(.4) translateY(40%)', opacity: 0 }], { duration: 400, fill: 'forwards' }));
        if (alive()) done(); return;
      }
      Sfx.play('page');
      await finished(pr.animate([{ transform: 'rotateY(0)' }, { transform: 'rotateY(-90deg)' }], { duration: 200, easing: 'ease-in', fill: 'forwards' }));
      if (!alive()) return;
      i++; fillPages(); pr.getAnimations().forEach(a => a.cancel());
      await finished(pl.animate([{ transform: 'rotateY(90deg)' }, { transform: 'rotateY(0)' }], { duration: 200, easing: 'ease-out' }));
      busy = false;
      if (i >= pages.length) {
        girl.draw({ pose: 'sit', mouth: 'cheer', eyes: 'happy' }); Sfx.play(found >= pages.length ? 'tada' : 'ting');
        if (found >= pages.length) { const [x, y] = rectC($('.bstars', book)); sparkleAt(x, y, 12); }
      }
      // help points at the star first, then at the page turn
      setHelp(() => { const st = $('.hstar:not([data-got])', book); st ? Hint.tap(st) : Hint.tap(turn); }, 5000);
    }
  }
};


/* ---------- grown-up settings ---------- */
function openGrown() {
  const st = Store.settings, today = new Date().getDay(), cur = currentDay();
  const realToday = !(st.dayOverride && st.dayOverride.date === todayKey());
  $('#dayChips').innerHTML = `<button class="chip ${realToday ? 'on' : ''}" data-day="auto">Today (${DAY_SHORT[today]})</button>` +
    [1, 2, 3, 4, 5, 6, 0].map(d => `<button class="chip ${!realToday && cur === d ? 'on' : ''}" data-day="${d}">${DAY_SHORT[d]}</button>`).join('');
  $('#sillyChips').innerHTML = [0, 3, 6, 8].map(n => `<button class="chip ${sillyCount() === n ? 'on' : ''}" data-silly="${n}">${n === 0 ? 'None' : n}</button>`).join('');
  $('#soundChips').innerHTML = `<button class="chip ${st.sound !== false ? 'on' : ''}" data-sound="1">On</button><button class="chip ${st.sound === false ? 'on' : ''}" data-sound="0">Off</button>`;
  $('#grownup').hidden = false;
}
function closeGrown() {
  $('#grownup').hidden = true;
  if (S.screen === 'routine') runStep(S.stepIndex); else if (S.screen === 'mode') go('mode');
}
function bindGrown() {
  const ov = $('#grownup');
  ov.addEventListener('click', e => {
    if (e.target === ov) return closeGrown();
    const b = e.target.closest('button'); if (!b) return;
    const st = Store.settings;
    if (b.dataset.day) { st.dayOverride = b.dataset.day === 'auto' ? null : { date: todayKey(), day: +b.dataset.day }; Store.save(); openGrown(); }
    else if (b.dataset.silly) { st.silly = +b.dataset.silly; Store.save(); openGrown(); }
    else if (b.dataset.sound) { st.sound = b.dataset.sound === '1'; Store.save(); openGrown(); }
    else if (b.id === 'resetToday') { Store.data.progress = {}; Store.save(); b.textContent = 'Done ✓'; }
    else if (b.id === 'closeGrown') closeGrown();
  });
}

/* ---------- fullscreen ---------- */
const fsOK = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFS() {
  try {
    if (fsOn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const el = document.documentElement, p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' }); p && p.catch && p.catch(() => {}); }
  } catch (e) {}
}
function updateFS() {
  const b = $('#btnFull');
  b.style.display = fsOK() && !(matchMedia('(display-mode: fullscreen)').matches && !fsOn()) ? '' : 'none';
  b.innerHTML = art(fsOn() ? 'shrink' : 'fullscreen');
}

/* ---------- start ---------- */
function boot() {
  Store.load();
  Drag.layer = $('#drag-layer');
  $('#hand').innerHTML = art('hand');
  $('#btnBack').innerHTML = art('back');
  $('#btnHelp').innerHTML = `${art('hand')}<span>${CONFIG.labels.help}</span>`;
  $('#btnGrown').innerHTML = art('gear');
  updateFS();
  document.addEventListener('fullscreenchange', updateFS);
  document.addEventListener('webkitfullscreenchange', updateFS);
  document.addEventListener('pointerdown', () => Sfx.unlock(), { capture: true });
  $('#btnBack').addEventListener('click', () => { Sfx.play('pop'); back(); });
  $('#btnHelp').addEventListener('click', () => { flash($('#btnHelp'), 'wiggle'); S.help(); });
  $('#btnFull').addEventListener('click', toggleFS);
  $('#btnGrown').addEventListener('click', openGrown);
  bindGrown();
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || Drag.active) e.preventDefault(); }, { passive: false });
  addEventListener('resize', () => Hint.stop());
  window.PackUp = { art, ART, CONFIG, S, Store, go, figure, outfitDef };   // handy for testing in the browser console
  go('home', { child: null });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
}
boot();
})();
</script>
</body>
</html>
